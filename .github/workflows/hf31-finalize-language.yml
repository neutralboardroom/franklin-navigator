name: HF31 final public-language gate
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - .github/workflows/hf31-finalize-language.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final static wording, profile render cleanup, and Spanish register gate
        run: python3 scripts/hf31-finalize-language.py
      - name: Verify changed interaction JavaScript
        run: |
          node --check dist/assets/hf31-public.js
          node --check dist/assets/hf31-deep-public.js
          node --check dist/assets/hf31-deep-language-runtime.js
          node --check dist/assets/community-explorer.js
          node --check dist/assets/r37-i18n.js
      - name: Persist exact final language state
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist evidence/hf31/PUBLIC_LANGUAGE_ZERO_JARGON_REPORT.json evidence/hf31/SPANISH_REGISTER_FINAL_REVIEW.json evidence/hf31/PROFILE_RENDER_LANGUAGE_RECEIPT.json
          if git diff --cached --quiet; then
            echo 'Final public language state already exact'
          else
            git commit -m 'Finalize resident-facing language and profile render cleanup [skip ci]'
            git push origin HEAD:hf31-profile-currentness-polish-20260910
          fi
