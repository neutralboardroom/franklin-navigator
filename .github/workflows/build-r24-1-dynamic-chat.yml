name: Build Franklin Navigator R24.1 dynamic Ask Navigator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-r24-1-dynamic-chat.yml
      - scripts/apply-r24-1-dynamic-chat.mjs

permissions:
  contents: write

jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out R24.1 build trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, verify and stage clean R24.1 tree
        shell: bash
        run: |
          set -euo pipefail
          BASE='e290fbbf720cdcf95a89d005e9cdc719b1e294a2'
          SCRIPT='scripts/apply-r24-1-dynamic-chat.mjs'

          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test -f "$SCRIPT"
          SCRIPT_SHA256="$(sha256sum "$SCRIPT" | awk '{print $1}')"
          cp "$SCRIPT" /tmp/apply-r24-1-dynamic-chat.mjs

          git checkout -B r24-1-production-stage "$BASE"
          R24_1_PATCH_SCRIPT_SHA="$SCRIPT_SHA256" node /tmp/apply-r24-1-dynamic-chat.mjs
          rm -rf .github scripts

          test "$(find dist -type f | wc -l)" -eq 19351
          test "$(find dist -type f -name '*.html' | wc -l)" -eq 19276
          test "$(find dist/profiles -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)" -eq 19103
          test "$(find . -mindepth 1 -maxdepth 1 ! -name .git | wc -l)" -eq 4
          test -f PRODUCTION_RELEASE.json
          test -f README.md
          test -d dist
          test -f render.yaml
          test ! -e .github
          test ! -e scripts

          grep -q 'R24.1 dynamic Ask Navigator behavior' dist/assets/r24.js
          grep -q "input.dataset.autogrow='six-lines'" dist/assets/r24.js
          grep -q "line\*6" dist/assets/r24.js
          grep -q "card.classList.toggle('has-answer',open)" dist/assets/r24.js
          grep -q 'R24.1 dynamic Ask Navigator behavior' dist/assets/styles.css
          grep -q 'max-height:none' dist/assets/styles.css
          grep -q 'FR-NAV0.9.1-CANDIDATE-R24.1' dist/release-identity.json
          grep -q 'FR-NAV0.9.1-CANDIDATE-R24.1' PRODUCTION_RELEASE.json

          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const manifest=JSON.parse(fs.readFileSync('dist/FRANKLIN_BUILD_MANIFEST.json','utf8'));
          if(manifest.release!=='FR-NAV0.9.1-CANDIDATE-R24.1'||manifest.profilePages!==19103||manifest.builtHtmlPages!==19276)throw new Error('R24.1 identity/count mismatch');
          if(manifest.interactionRevision?.autoGrowMaximumLines!==6)throw new Error('R24.1 auto-grow contract missing');
          if(manifest.files.length!==19350)throw new Error('R24.1 manifest file count mismatch');
          for(const item of manifest.files){const p=path.join('dist',item.path),b=fs.readFileSync(p),h=crypto.createHash('sha256').update(b).digest('hex');if(b.length!==item.bytes||h!==item.sha256)throw new Error('R24.1 manifest mismatch: '+item.path)}
          const release=JSON.parse(fs.readFileSync('PRODUCTION_RELEASE.json','utf8'));
          const ask=release.visibleHomepage?.askNavigator;
          if(ask?.restingDesktopCardMaxWidthPx!==540||ask?.restingTextareaMinHeightPx!==110||ask?.autoGrowMaximumLines!==6||ask?.answerExpansion!=='NATURAL_VERTICAL_BELOW_INPUT')throw new Error('R24.1 Ask Navigator contract mismatch');
          if(release.commerce?.paidCommerceActive!==false||release.commerce?.stripeDownstreamEntitlementProcessingActive!==false||release.commerce?.productionEntitlementPersistence!==false)throw new Error('Commerce fail-closed regression');
          console.log(JSON.stringify({ok:true,release:manifest.release,profiles:manifest.profilePages,htmlPages:manifest.builtHtmlPages,manifestFiles:manifest.files.length,scriptSha256:manifest.interactionRevision.patchScriptSha256},null,2));
          NODE

          git config user.name 'Franklin Navigator Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Stage Franklin Navigator R24.1 dynamic Ask Navigator'
          git push --force origin HEAD:r24-1-production-stage
