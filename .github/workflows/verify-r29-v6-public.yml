name: Verify Franklin R29 V6 public release
on: [push]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check dist/assets/r28-community.js
      - run: node --check dist/assets/r27-home.js
      - run: node scripts/verify-r29-v6-public.mjs
