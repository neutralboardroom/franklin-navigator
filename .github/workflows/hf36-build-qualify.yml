name: Franklin HF3.6 build and qualify
on:
  push:
    branches: [fr-nav1-25-0-hf36-owner-review-20260911]
    paths:
      - 'scripts/hf36-build.py'
      - 'scripts/hf36-verify.py'
      - 'scripts/hf36-browser.py'
      - '.github/workflows/hf36-build-qualify.yml'
permissions:
  contents: write
jobs:
  build-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fr-nav1-25-0-hf36-owner-review-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and browser dependencies
        run: |
          pip install beautifulsoup4==4.13.4 playwright==1.55.0
          python -m playwright install chromium
      - name: Compile release scripts
        run: python -m py_compile scripts/hf36-build.py scripts/hf36-verify.py scripts/hf36-browser.py
      - name: Build owner-review release
        run: python scripts/hf36-build.py
      - name: Static qualification
        run: python scripts/hf36-verify.py
      - name: Representative browser qualification
        run: |
          python -m http.server 8765 --directory dist > /tmp/hf36-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python scripts/hf36-browser.py
      - name: Persist qualified candidate
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist PRODUCTION_RELEASE.json NEXT_VERSION_IMPROVEMENT_LIST__FR_NAV1_25_0_HF36.md HF36_BUILD_RECEIPT.json HF36_QUALIFICATION_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'FR-NAV1.25.0 HF3.6 qualified owner-review simplification [skip ci]'
          git push origin HEAD:fr-nav1-25-0-hf36-owner-review-20260911
