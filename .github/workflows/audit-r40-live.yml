name: Read-only Franklin R40 live route and member audit
on:
  push:
    branches: [r40-live-audit-20260907]
    paths:
      - 'scripts/audit-r40-live.py'
      - '.github/workflows/audit-r40-live.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test runner
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Audit live exact release, customer routes, mobile EN ES and runtime GET endpoints
        run: python scripts/audit-r40-live.py
      - name: Preserve exact live audit and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franklin-r40-live-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
