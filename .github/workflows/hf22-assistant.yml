name: HF22 Assistant exact-source qualification
on:
  push:
    branches: [local-franklin-hf22-assistant-20260907]
    paths: [hf22-transfer/**, .github/workflows/hf22-assistant.yml]
permissions:
  contents: write
concurrency:
  group: franklin-hf22-assistant-source
  cancel-in-progress: false
jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 65fb0dbccacc923f55c8383e2c563aed0cf4959d
          path: candidate/public
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply hash-bound source and tests
        run: |
          python - <<'PY'
          import pathlib,lzma,json,hashlib
          raw=pathlib.Path('transport/hf22-transfer/assistant.delta.xz').read_bytes()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(raw)=='4488113c9938e15d8e81a6304cf975990bd499a81da8846d206c15eeee9e850b'
          d=json.loads(lzma.decompress(raw));assert d['basePublic']=='65fb0dbccacc923f55c8383e2c563aed0cf4959d'
          base=pathlib.Path('candidate/public').resolve()
          for name,o in d['files'].items():
            p=(base/name).resolve();assert p.is_relative_to(base) and not p.is_symlink()
            assert sha(p.read_bytes())==o['baseSha256'],name
            t=p.read_text()
            for a,b,c in reversed(o['replacements']):t=t[:a]+c+t[b:]
            assert sha(t.encode())==o['sha256'],name;p.write_text(t)
          tests=pathlib.Path('candidate/validation');tests.mkdir(parents=True,exist_ok=True)
          for name,o in d['tests'].items():
            t=o['text'];assert sha(t.encode())==o['sha256'];(tests/name).write_text(t)
          ev=pathlib.Path('candidate/evidence');ev.mkdir(exist_ok=True)
          (ev/'SOURCE.json').write_text(json.dumps({'base':d['basePublic'],'deltaSha256':sha(raw),'files':{n:sha((base/n).read_bytes()) for n in d['files']},'productionMutations':0},indent=2))
          PY
      - name: Exact routing and syntax
        run: |
          set -euo pipefail
          node --check candidate/public/dist/assets/r38-assistant-followthrough.js
          node --check candidate/public/dist/assets/navigator-bot.js
          node --check candidate/public/dist/assets/r27-home.js
          node candidate/validation/test_assistant_rank.cjs candidate/public/dist/assets/r38-assistant-followthrough.js candidate/validation/assistant_cases.json > candidate/evidence/ASSISTANT_RANK.json
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual source-browser routing and destination clicks
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory candidate/public/dist >/tmp/franklin-http.log 2>&1 &
          export CHROMIUM_PATH=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          export ASSISTANT_ORIGIN=http://127.0.0.1:8765
          export ASSISTANT_EVIDENCE="$GITHUB_WORKSPACE/candidate/evidence/browser"
          python candidate/validation/browser_assistant.py
      - name: Preserve completed exact public tree without production promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,json,subprocess,hashlib,os,urllib.request
          root=pathlib.Path('candidate/public');repo='neutralboardroom/franklin-navigator';base='65fb0dbccacc923f55c8383e2c563aed0cf4959d'
          def api(path,data=None):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(data).encode() if data else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          assert api('/git/ref/heads/main')['object']['sha']==base,'Production base changed; no commit promotion permitted'
          d=json.loads((pathlib.Path('candidate/evidence')/'SOURCE.json').read_text())
          m=json.loads((root/'PRODUCTION_RELEASE.json').read_text());m.update({'release':'FR-NAV1.15.0-HF2.2-CANDIDATE','parent':base,'assistantCorrection':d,'commerceOpenedByBuild':False})
          h=hashlib.sha256()
          for p in sorted((root/'dist').rglob('*')):
            if p.is_file():h.update((p.relative_to(root/'dist').as_posix()+'\0'+str(p.stat().st_size)+'\0'+hashlib.sha256(p.read_bytes()).hexdigest()+'\n').encode())
          m['publicDistSha256']=h.hexdigest();(root/'PRODUCTION_RELEASE.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          bt=api('/git/commits/'+base)['tree']['sha'];entries=[]
          for name in list(d['files'])+['PRODUCTION_RELEASE.json']:
            entries.append({'path':name,'mode':'100644','type':'blob','content':(root/name).read_text()})
          tree=api('/git/trees',{'base_tree':bt,'tree':entries})['sha']
          commit=api('/git/commits',{'message':'Keep and repair Franklin Assistant with exact membership, service and urgent routes; source-browser qualified [skip ci]','tree':tree,'parents':[base]})['sha']
          ref='refs/heads/local-franklin-hf22-assistant-qualified-20260907'
          api('/git/refs',{'ref':ref,'sha':commit})
          (pathlib.Path('candidate/evidence')/'PREPARED_PUBLIC.json').write_text(json.dumps({'commit':commit,'tree':tree,'branch':ref,'parent':base,'publicDistSha256':h.hexdigest(),'productionPromotion':False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf22-assistant-source-and-browser
          path: candidate/evidence/
          retention-days: 14
          if-no-files-found: error
