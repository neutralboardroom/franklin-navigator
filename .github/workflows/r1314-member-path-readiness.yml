name: R1314 member path readiness
on:
  push:
    branches: [franklin-commerce-runtime-r30]
    paths:
      - 'server.js'
      - 'lib/member-profile-policy.js'
      - 'scripts/owner-review-preflight.cjs'
      - 'data/member-control-profiles.json'
      - 'test/member-profile-policy.test.js'
      - 'package.json'
      - '.github/workflows/r1314-member-path-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  member-path-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: franklin-commerce-runtime-r30
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax gate
        run: npm run check
      - name: Member-path regression suite
        run: npm test
      - name: Control-profile fail-closed contract
        run: |
          grep -F '"FR-TEST-SCC-OWNER-CONTROL"' data/member-control-profiles.json
          grep -F 'isProductionProfile' scripts/owner-review-preflight.cjs
          grep -F 'memberLifecycle' server.js
