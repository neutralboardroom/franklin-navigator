name: Expand Franklin Navigator R23 exact payload

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/expand-r23.yml

permissions:
  contents: write

jobs:
  expand-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out uploaded carrier commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact upload and construct clean R23 staging tree
        shell: bash
        run: |
          set -euo pipefail
          BASE='1f912410b3127f5be3482b0b5674fcd57ec697ed'
          ZIP='FRANKLIN_R23__GITHUB_DEPLOY_PAYLOAD.zip'
          EXPECTED_ZIP_SHA='6d0b3e2ad7dcc6efc5adae1395adcec8eeeca38cd1590a2324cb9926250c59e9'
          EXPECTED_ZIP_BYTES='9395712'
          EXPECTED_DIST_TAR_SHA='c72b60d23064f67f5a86b864e9e8b0720b12d7f496a0dbb7b4f48c1d9f12612a'

          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test -f "$ZIP"
          test "$(stat -c%s "$ZIP")" = "$EXPECTED_ZIP_BYTES"
          echo "$EXPECTED_ZIP_SHA  $ZIP" | sha256sum -c -

          rm -rf /tmp/r23-upload /tmp/r23-dist.tar
          mkdir -p /tmp/r23-upload
          unzip -q "$ZIP" -d /tmp/r23-upload
          test "$(find /tmp/r23-upload -maxdepth 1 -type f | wc -l)" -eq 5
          echo 'e143adac0f358f69f4af84e901c9c982749f7e8117567b45bd55962549dd362c  /tmp/r23-upload/r23-dist.tar.zst' | sha256sum -c -
          echo 'df3e1afe7989814fa35c8d2be58756f0997f730ba9839afab14258130211b80b  /tmp/r23-upload/PRODUCTION_RELEASE.json' | sha256sum -c -
          echo '6cdddabdd8abc4ce73469ae80621c0233fc3bf30691f6b8b97315e4bf72cc0b7  /tmp/r23-upload/README.md' | sha256sum -c -
          echo '93689d429cb85334db8cd9b5de4c92562839b4cdc19045830b847dcd33392736  /tmp/r23-upload/deploy-r23.sh' | sha256sum -c -

          zstd -q -dc /tmp/r23-upload/r23-dist.tar.zst > /tmp/r23-dist.tar
          echo "$EXPECTED_DIST_TAR_SHA  /tmp/r23-dist.tar" | sha256sum -c -

          git checkout -B r23-production-stage "$BASE"
          rm -rf dist
          tar -xf /tmp/r23-dist.tar
          cp /tmp/r23-upload/PRODUCTION_RELEASE.json PRODUCTION_RELEASE.json
          cp /tmp/r23-upload/README.md README.md
          rm -f "$ZIP"
          rm -rf .github

          test "$(find dist -type f -name '*.html' | wc -l)" -eq 19276
          test "$(find dist/profiles -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)" -eq 19103
          grep -q 'FR-NAV0.8.0-CANDIDATE-R23' dist/release-identity.json
          grep -q 'FOUNDING30' dist/membership-pricing/index.html
          grep -q '(615) 656-7020' dist/index.html
          grep -q 'Franklin Navigator Growth Desk' dist/growth-desk/index.html
          echo '7a19067a26045b44db2598ce578e00019baaedd024b91ff1c985a7cbbeeac195  dist/sitemap.xml' | sha256sum -c -
          echo 'c3f301cb4b8e59c2f2d022ba52936e793051b372383b69d72891d8af1afc4f43  dist/index.html' | sha256sum -c -
          echo '4edcb03098644421626ec20d8781e42f1eda1bff2f7169eb38742cc311841dbf  dist/FRANKLIN_BUILD_MANIFEST.json' | sha256sum -c -

          python - <<'PY'
          import hashlib
          import json
          import os

          root = 'dist'
          manifest_path = os.path.join(root, 'FRANKLIN_BUILD_MANIFEST.json')
          with open(manifest_path, encoding='utf-8') as handle:
              manifest = json.load(handle)

          records = manifest['files']
          assert len(records) == 19348, len(records)
          expected = {record['path'] for record in records}
          actual = set()
          for directory, _, filenames in os.walk(root):
              for filename in filenames:
                  path = os.path.join(directory, filename)
                  actual.add(os.path.relpath(path, root).replace(os.sep, '/'))

          assert actual == expected | {'FRANKLIN_BUILD_MANIFEST.json'}
          for record in records:
              path = os.path.join(root, record['path'])
              with open(path, 'rb') as handle:
                  payload = handle.read()
              assert len(payload) == record['bytes'], record['path']
              assert hashlib.sha256(payload).hexdigest() == record['sha256'], record['path']

          digest = hashlib.sha256()
          for record in sorted(records, key=lambda item: item['path']):
              digest.update(record['path'].encode('utf-8'))
              digest.update(b'\0')
              digest.update(str(record['bytes']).encode('ascii'))
              digest.update(b'\0')
              digest.update(record['sha256'].encode('ascii'))
              digest.update(b'\n')
          assert digest.hexdigest() == '497ed73a53170169e02e07211bd12395e29fc7a5d00a5aea8a13d2b4c86b3d3a'
          print('R23 manifest verified:', len(records), 'files')
          PY

          find dist -type d -exec chmod 755 {} +
          find dist -type f -exec chmod 644 {} +

          git config user.name 'Franklin Navigator Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Stage Franklin Navigator R23 exact verified public payload'
          git push --force origin HEAD:r23-production-stage
