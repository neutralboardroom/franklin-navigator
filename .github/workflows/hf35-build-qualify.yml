name: Franklin HF3.5 build and qualify
on:
  push:
    branches: [fr-nav1-24-0-hf35-finish-simplify-20260911]
    paths:
      - 'scripts/hf35-build.py'
      - 'scripts/hf35-verify.py'
      - 'scripts/hf35-browser.py'
      - '.github/workflows/hf35-build-qualify.yml'
permissions:
  contents: write
jobs:
  build-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fr-nav1-24-0-hf35-finish-simplify-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and browser dependencies
        run: |
          pip install beautifulsoup4==4.13.4 playwright==1.55.0
          python -m playwright install chromium
      - name: Compile builder and qualification scripts
        run: python -m py_compile scripts/hf35-build.py scripts/hf35-verify.py scripts/hf35-browser.py
      - name: Build finishing release
        run: python scripts/hf35-build.py
      - name: Static qualification
        run: python scripts/hf35-verify.py
      - name: Representative browser qualification
        run: |
          python -m http.server 8765 --directory dist > /tmp/hf35-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python scripts/hf35-browser.py
      - name: Persist qualified candidate
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist PRODUCTION_RELEASE.json NEXT_VERSION_IMPROVEMENT_LIST__FR_NAV1_24_0_HF35.md HF35_BUILD_RECEIPT.json HF35_QUALIFICATION_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'FR-NAV1.24.0 HF3.5 qualified finishing simplification [skip ci]'
          git push origin HEAD:fr-nav1-24-0-hf35-finish-simplify-20260911
