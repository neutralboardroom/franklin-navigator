name: Franklin final single-annual catalog qualification
on:
  push:
    branches: [franklin-commerce-runtime-r30]
    paths:
      - lib/catalog.js
      - lib/purchase-reservations.js
      - test/final-single-annual-closeout.test.js
      - .github/workflows/catalog-open-truth.yml
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full runtime checks
        run: |
          npm run check
          npm test
      - name: Exact new-sale catalog truth
        run: |
          node - <<'NODE'
          const c=require('./lib/catalog');
          process.env.COMMERCE_ENABLED='false';
          let x=c.publicCatalog();
          if(x.publicCheckoutOpen!==false) throw Error('closed catalog mismatch');
          process.env.COMMERCE_ENABLED='true';
          x=c.publicCatalog();
          if(x.publicCheckoutOpen!==true) throw Error('open catalog mismatch');
          if(x.publicChoiceCount!==1 || x.choices.length!==1) throw Error('new-sale choice count regression');
          const choice=x.choices[0];
          if(choice.id!=='ANNUAL'||choice.priceUsd!==35||choice.autoRenew!==true||choice.renewal!=='ANNUAL_UNTIL_CANCELED') throw Error('annual public offer mismatch');
          const p=c.getPlan('franklin_community_member_annual_v6');
          if(!p||p.stripePriceId!=='price_1UE31nRxNra9nizoEPyavVQF'||p.newSaleEligible!==true) throw Error('annual mapping mismatch');
          for(const k of ['franklin_community_member_monthly_v5','franklin_community_member_annual_v5','franklin_charter_member_36_month_v5','franklin_charter_member_36_month_v6']){
            const old=c.getPlan(k); if(!old||old.newSaleEligible!==false) throw Error('historical recognition/retirement mismatch '+k);
          }
          console.log(JSON.stringify({result:'PASS',publicChoices:1,priceUsd:35,annual:true,retiredNewSaleBlocked:true,historicalRecognition:true,financialMutations:0}));
          NODE
