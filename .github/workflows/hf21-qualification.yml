name: HF21 native reviewer qualification
on:
  push:
    branches: [local-franklin-reviewer-console-hf21-20260907]
    paths: [.github/workflows/hf21-qualification.yml, hf21-transfer/**]
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_USER: fixture
          POSTGRES_DB: franklin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d franklin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture:isolated_test_only@127.0.0.1:5432/franklin_test
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e0ea8625343f6ec0e2eb2f0e55ec6457ec762bf1
          path: candidate/public
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 808709426ebc65efed7b74920e89c5fd49b60483
          path: candidate/runtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct and verify exact HF2 and HF21 source
        run: |
          python - <<'PY'
          import pathlib,json,lzma,hashlib,subprocess
          base=pathlib.Path('candidate').resolve()
          sha=lambda b:hashlib.sha256(b).hexdigest()
          raw=b''.join((pathlib.Path('transport/hf2-transfer')/f'source.part{i:02d}').read_bytes() for i in range(1,4))
          assert len(raw)==22644 and sha(raw)=='a43b30c946ba37ecb9d4aff1cb1284a9dd15d82c7851731a85db22846fb215fd'
          d=json.loads(lzma.decompress(raw))
          assert d['schema']=='local.hf2.strict-delta.v1'
          assert d['publicBase']=='e0ea8625343f6ec0e2eb2f0e55ec6457ec762bf1'
          assert d['runtimeBase']=='808709426ebc65efed7b74920e89c5fd49b60483'
          def apply(files):
              for name,o in files.items():
                  p=(base/name).resolve()
                  assert p.is_relative_to(base) and not p.is_symlink()
                  if 'baseSha256' in o:
                      assert sha(p.read_bytes())==o['baseSha256'],name
                      text=p.read_text()
                      for start,end,replacement in reversed(o['replacements']):
                          assert 0<=start<=end<=len(text)
                          text=text[:start]+replacement+text[end:]
                  else:
                      assert not p.exists(),name
                      text=o['text']
                  assert sha(text.encode())==o['sha256'],name
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(text)
          apply(d['files'])
          subprocess.run(['python',str(base/'validation/apply_hf2_transport.py')],check=True)
          refinement=pathlib.Path('transport/hf2-transfer/ui-refinement.json').read_bytes()
          u=json.loads(refinement)
          assert u['schema']=='local.hf2.ui-refinement.v1'
          assert set(u['files'])=={'public/dist/assets/member-profile-live.js','validation/browser_member.py'}
          apply(u['files'])
          dist=base/'public/dist';h=hashlib.sha256()
          for p in sorted(dist.rglob('*')):
              if p.is_file(): h.update((p.relative_to(dist).as_posix()+'\0'+str(p.stat().st_size)+'\0'+sha(p.read_bytes())+'\n').encode())
          assert h.hexdigest()==u['publicDistSha256']
          raw21=b''.join((pathlib.Path('transport/hf21-transfer')/f'source.part{i:02d}').read_bytes() for i in range(1,3))
          assert len(raw21)==23632 and sha(raw21)=='48ec9f2f927f1fc5293b123a735f3e577c443e8574b7bc3425fd1c1f872bcbb5'
          v=json.loads(lzma.decompress(raw21))
          assert v['schema']=='franklin.hf21.strict-source-delta.v1'
          assert v['baseHf2ArchiveSha256']=='dab550aa8899da4800efa01a5f9cfd72a932db71ae66799d8cf5f87f36224f13'
          assert h.hexdigest()==v['publicDistSha256']
          for name,o in v['files'].items():
              p=(base/name).resolve()
              assert p.is_relative_to(base) and not p.is_symlink()
              if o['base']:
                  assert sha(p.read_bytes())==o['base'],name
                  text=p.read_text()
                  for start,end,replacement in reversed(o['replacements']):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              else:
                  assert not p.exists() or (o.get('optionalExistingSha256') and sha(p.read_bytes())==o['optionalExistingSha256']),name
                  text=o['text']
              assert sha(text.encode())==o['sha256'],name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text)
          ev=base/'evidence';ev.mkdir(exist_ok=True)
          (ev/'HF21_CI_SOURCE_RECONSTRUCTION.json').write_text(json.dumps({'result':'PASS_EXACT_TARGET_HASHES','hf2SourceTransportSha256':sha(raw),'hf2UiRefinementSha256':sha(refinement),'hf21DeltaSha256':sha(raw21),'publicDistSha256':h.hexdigest(),'files':{n:sha((base/n).read_bytes()) for n in v['files']},'productionMutations':0},indent=2)+'\n')
          PY
      - name: Install locked runtime dependencies
        working-directory: candidate/runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual runtime unit regression
        working-directory: candidate/runtime
        run: |
          set -o pipefail
          node --test | tee ../evidence/HF21_CI_UNIT_TESTS.tap
      - name: Actual reviewer PostgreSQL and HTTP workflow
        working-directory: candidate/runtime
        run: |
          export TEST_REPORT_DIR="$GITHUB_WORKSPACE/candidate/evidence/hf21/http"
          node acceptance/reviewer-console.integration.cjs
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Native bilingual reviewer browser workflow
        run: |
          export CHROMIUM_PATH=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          export TEST_REPORT_DIR="$GITHUB_WORKSPACE/candidate/evidence/hf21/browser"
          python candidate/validation/browser_reviewer.py
      - name: Inherited member browser workflow
        run: |
          export CHROMIUM_PATH=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          python candidate/validation/browser_member.py
      - name: Preserve bounded test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf21-source-bound-qualification
          path: |
            candidate/evidence/HF21_CI_SOURCE_RECONSTRUCTION.json
            candidate/evidence/HF21_CI_UNIT_TESTS.tap
            candidate/evidence/hf21/
            candidate/evidence/browser/
          retention-days: 7
          if-no-files-found: error
