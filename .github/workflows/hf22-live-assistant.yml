name: HF22 live Assistant HTTPS verification
on:
  push:
    branches: [local-franklin-hf22-assistant-20260907]
    paths: [.github/workflows/hf22-live-assistant.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: da45cc2a81e2232861a7419d81fc78d16674a5c0
          path: public
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Read-only exact live HTTP comparison
        run: |
          python - <<'PY'
          import pathlib,hashlib,urllib.request,json,concurrent.futures,datetime
          root=pathlib.Path('public/dist');out=pathlib.Path('evidence');out.mkdir()
          pages=sorted(p for p in root.rglob('*.html') if not p.relative_to(root).as_posix().startswith('profiles/'))
          profiles=sorted((root/'profiles').rglob('*.html'))
          sample=profiles[::max(1,len(profiles)//25)][:25]
          assets=sorted(p for p in (root/'assets').rglob('*') if p.is_file() and p.suffix in ['.js','.css'])
          todo=sorted(set(pages+sample+assets));sha=lambda b:hashlib.sha256(b).hexdigest()
          def check(p):
            n=p.relative_to(root).as_posix();route='/'+n
            if route.endswith('/index.html'):route=route[:-10]
            if route=='/index.html':route='/'
            try:
              req=urllib.request.Request('https://franklinnavigator.com'+route,headers={'User-Agent':'Franklin-owner-authorized-readonly-qualification/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: data=r.read();status=r.status;url=r.url
              return {'path':n,'status':status,'url':url,'expectedSha256':sha(p.read_bytes()),'actualSha256':sha(data),'pass':status==200 and data==p.read_bytes()}
            except Exception as e:return {'path':n,'pass':False,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(check,todo))
          report={'atUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'publicCommit':'da45cc2a81e2232861a7419d81fc78d16674a5c0','mode':'LIVE_HTTPS_READ_ONLY','pass':sum(x['pass'] for x in results),'fail':sum(not x['pass'] for x in results),'nonProfilePages':len(pages),'profileSamples':len(sample),'assets':len(assets),'results':results,'financialWrites':0,'profileWrites':0}
          (out/'LIVE_HTTP.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:v for k,v in report.items() if k!='results'}));assert report['fail']==0
          PY
      - name: Restore exact Assistant browser test source
        run: |
          python - <<'PY'
          import pathlib,lzma,json,hashlib
          raw=pathlib.Path('transport/hf22-transfer/assistant.delta.xz').read_bytes();sha=lambda b:hashlib.sha256(b).hexdigest()
          assert sha(raw)=='4488113c9938e15d8e81a6304cf975990bd499a81da8846d206c15eeee9e850b'
          d=json.loads(lzma.decompress(raw));v=pathlib.Path('validation');v.mkdir()
          for name,o in d['tests'].items():
            assert sha(o['text'].encode())==o['sha256'];text=o['text']
            if name=='browser_assistant.py':text=text.replace("'mode':'LOCAL_EXACT_SOURCE_BROWSER'","'mode':'LIVE_HTTPS_PUBLIC_BROWSER_NO_WRITES'")
            (v/name).write_text(text)
          PY
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual live Assistant and homepage browser journeys
        run: |
          export CHROMIUM_PATH=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          export ASSISTANT_ORIGIN=https://franklinnavigator.com
          export ASSISTANT_EVIDENCE="$GITHUB_WORKSPACE/evidence/browser"
          python validation/browser_assistant.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf22-live-assistant-https
          path: evidence/
          retention-days: 14
          if-no-files-found: error
