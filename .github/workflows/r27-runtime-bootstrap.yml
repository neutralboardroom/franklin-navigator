name: Franklin R27 one-time runtime bootstrap

on:
  push:
    branches:
      - franklin-commerce-runtime
    paths:
      - scripts/apply-r27-hardening.mjs
      - .github/workflows/r27-runtime-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out runtime branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply R27 hardening and generate deterministic lock
        run: |
          set -euo pipefail
          node scripts/apply-r27-hardening.mjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Commit hardened runtime and retire bootstrap carrier
        run: |
          set -euo pipefail
          rm -f scripts/apply-r27-hardening.mjs .github/workflows/r27-runtime-bootstrap.yml
          git config user.name 'Franklin Navigator Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Harden Franklin R27 commerce runtime and add exact dependency lock'
          git push origin HEAD:franklin-commerce-runtime
