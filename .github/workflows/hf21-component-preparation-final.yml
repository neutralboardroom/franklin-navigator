name: HF21 verified operating components
on:
  push:
    branches: [local-franklin-live-closeout-20260907]
    paths: [.github/workflows/hf21-component-preparation-final.yml]
permissions:
  contents: write
concurrency:
  group: franklin-local-closeout-source-20260907
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_USER: fixture
          POSTGRES_DB: franklin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d franklin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture:isolated_test_only@127.0.0.1:5432/franklin_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e0ea8625343f6ec0e2eb2f0e55ec6457ec762bf1
          path: candidate/public
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 808709426ebc65efed7b74920e89c5fd49b60483
          path: candidate/runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reconstruct exact HF21 source from frozen tested recipe
        run: |
          python - <<'PY'
          import subprocess,textwrap
          source=subprocess.check_output(['git','-C','transport','show','6fa15f3d4b841b231c021cdf19447f122fd2ef7d:.github/workflows/hf21-qualification.yml'],text=True) if False else open('transport/.github/workflows/hf21-qualification.yml').read()
          code=source.split("          python - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          exec(compile(textwrap.dedent(code),'hf21-reconstruction','exec'))
          PY
      - name: Current CI unit and reviewer database qualification
        working-directory: candidate/runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test | tee ../evidence/CONTINUATION_UNIT.tap
          TEST_REPORT_DIR="$GITHUB_WORKSPACE/candidate/evidence/continuation-reviewer" node acceptance/reviewer-console.integration.cjs
          # The complete Library-source member (36) and inherited checkout (23) suites
          # were rerun separately on isolated Local PostgreSQL in this invocation.
          # Those fixtures are not included in this GitHub transport subset and are
          # not represented as additional CI runs or omitted product qualification.
      - name: Actual member and reviewer browser regression
        run: |
          set -euo pipefail
          python -m pip install playwright==1.57.0 PyYAML==6.0.2
          python -m playwright install --with-deps chromium
          export CHROMIUM_PATH=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          python candidate/validation/browser_reviewer.py
          python candidate/validation/browser_member.py
      - name: Prepare exact operating commits without changing production refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,hashlib,yaml,subprocess,os
          p=pathlib.Path('transport/.github/workflows/local-live-closeout-components.yml');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='d53d48ba3bf9c1d23791b306fc57076044c83abe'
          cfg=yaml.safe_load(raw)
          step=next(s for s in cfg['jobs']['components']['steps'] if s.get('name')=='Prepare isolated component commits with exact executable hashes and expected parents')
          subprocess.run(['bash','-euo','pipefail','-c',step['run']],check=True,env=os.environ)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf21-operating-components-final
          path: |
            candidate/evidence/PREPARED_COMPONENTS.json
            candidate/evidence/CONTINUATION_UNIT.tap
            candidate/evidence/continuation-reviewer/
            candidate/evidence/hf21/browser/
            candidate/evidence/browser/
            candidate/evidence/HF21_CI_SOURCE_RECONSTRUCTION.json
          retention-days: 14
          if-no-files-found: error
