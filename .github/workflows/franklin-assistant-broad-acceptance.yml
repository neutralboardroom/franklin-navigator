name: Franklin Assistant broad acceptance bank
on:
  push:
    branches: [main]
    paths:
      - 'tests/franklin-assistant-broad-acceptance-bank.json'
      - 'tests/franklin-assistant-broad-acceptance-bank.cjs'
      - '.github/workflows/franklin-assistant-broad-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tests/franklin-assistant-broad-acceptance-bank.cjs
