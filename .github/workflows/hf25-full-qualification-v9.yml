name: HF25 complete post-launch truth qualification v9
on:
  push:
    branches: [local-franklin-hf25-postlaunch-truth-20260908]
    paths: [.github/workflows/hf25-full-qualification-v9.yml]
permissions:
  contents: write
concurrency:
  group: franklin-hf25-complete-v9
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: transport, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 9e8195d9c3939f791795ab38add326402b5d55c8, path: candidate/public, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8, path: candidate/runtime, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Apply exact deterministic HF2.5 patch
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys,shutil
          d=json.loads(pathlib.Path('transport/.github/hf25/postlaunch_truth_patch.json').read_text())
          for x in d['replacements']:x['min']=1
          d['replacements'] += [
            {'old':'new public membership checkout is closed.','new':'Franklin Community Membership enrollment is open for eligible verified profiles.','min':1},
            {'old':'Franklin will not reopen new enrollment until the remaining launch checks are complete.','new':'Eligible verified profiles can start membership setup now after representation is confirmed.','min':1},
            {'old':'New public membership checkout remains closed while Franklin completes the remaining launch checks.','new':'Franklin Community Membership enrollment is open for eligible verified profiles.','min':1},
            {'old':'Franklin Community Membership enrollment is open for eligible verified profiles. An existing paid Community Membership is connected to the correct account and profile, is active, and can use secure billing and cancellation. Do not make another payment for an existing membership while Franklin completes the remaining launch checks for new enrollment.','new':'Franklin Community Membership enrollment is open for eligible verified profiles. An existing paid Community Membership is connected to the correct account and profile, is active, and can use secure billing and cancellation. Existing active members should not make another payment for the same membership.','min':1}
          ]
          d['newSpanishTranslations'].update({
            'Eligible verified profiles can start membership setup now after representation is confirmed.':'Los perfiles verificados elegibles pueden iniciar la configuración de la membresía ahora después de confirmar la representación.',
            'Checking your basic listing and preparing a factual correction are free. The Business Growth Planner and these guides are also free to use today. Community Membership enrollment is open for eligible verified profiles. Free planning tools remain available. If sponsored placements are offered later, they will be clearly labeled and will not change ordinary directory placement. No guide or plan can guarantee leads, customers or revenue.':'Revisar tu listado básico y preparar una corrección factual es gratuito. El Planificador de Crecimiento Empresarial y estas guías también son gratuitos hoy. La inscripción a la Membresía Comunitaria está abierta para perfiles verificados elegibles. Las herramientas gratuitas de planificación siguen disponibles. Si más adelante se ofrecen ubicaciones patrocinadas, estarán claramente identificadas y no cambiarán la ubicación normal en el directorio. Ninguna guía ni plan puede garantizar contactos, clientes ni ingresos.',
            'Community Membership enrollment and secure payment are open for eligible verified profiles. Basic listings, factual corrections and the current business planning tools remain free.':'La inscripción a la Membresía Comunitaria y el pago seguro están abiertos para perfiles verificados elegibles. Los listados básicos, las correcciones factuales y las herramientas actuales de planificación empresarial siguen siendo gratuitos.',
            'Community Membership enrollment is open for eligible verified profiles. You can use these planning guides without paying.':'La inscripción a la Membresía Comunitaria está abierta para perfiles verificados elegibles. Puedes usar estas guías de planificación sin pagar.',
            'For new enrollment, the approved choices are $5 monthly, $50 annual and $120 once for a prepaid 36-month Franklin Charter Membership. Public checkout is open for eligible verified profiles. Monthly and annual memberships renew until canceled; Charter does not automatically renew. Renewal behavior and cancellation access must be shown before payment.':'Para nuevas inscripciones, las opciones aprobadas son $5 mensuales, $50 anuales y $120 una sola vez por una Membresía Charter de Franklin prepagada por 36 meses. El pago público está abierto para perfiles verificados elegibles. Las membresías mensual y anual se renuevan hasta que se cancelen; Charter no se renueva automáticamente. Las condiciones de renovación y el acceso a la cancelación deben mostrarse antes del pago.',
            'Franklin Community Membership enrollment is open for eligible verified profiles. An existing paid Community Membership is active and can use secure billing and cancellation. Eligible verified profiles can start membership setup now after representation is confirmed.':'La inscripción a la Membresía Comunitaria de Franklin está abierta para perfiles verificados elegibles. Una Membresía Comunitaria de pago existente está activa y puede usar facturación y cancelación seguras. Los perfiles verificados elegibles pueden iniciar la configuración de la membresía ahora después de confirmar la representación.',
            'Franklin Community Membership enrollment is open for eligible verified profiles. An existing paid Community Membership is connected to the correct account and profile, is active, and can use secure billing and cancellation. Existing active members should not make another payment for the same membership.':'La inscripción a la Membresía Comunitaria de Franklin está abierta para perfiles verificados elegibles. Una Membresía Comunitaria de pago existente está conectada a la cuenta y al perfil correctos, está activa y puede usar facturación y cancelación seguras. Los miembros activos no deben realizar otro pago por la misma membresía.',
            'Franklin Navigator keeps the basic listing free. Paid membership adds access to richer reviewed profile details, practical growth tools and a stronger local community presence—not paid control of factual accuracy or ordinary directory results.':'Franklin Navigator mantiene gratuito el listado básico. La membresía de pago da acceso a detalles de perfil revisados más completos, herramientas prácticas de crecimiento y una presencia comunitaria local más sólida; no compra control sobre la exactitud factual ni sobre los resultados normales del directorio.',
            'Free listing review and factual correction preparation remain separate. Community Membership enrollment and secure payment are open for eligible verified profiles.':'La revisión gratuita del listado y la preparación de correcciones factuales permanecen separadas. La inscripción a la Membresía Comunitaria y el pago seguro están abiertos para perfiles verificados elegibles.',
            'You can review membership value and prepare your profile now. An existing paid Community Membership is active and can manage billing securely. Franklin Community Membership enrollment is open for eligible verified profiles.':'Puedes revisar el valor de la membresía y preparar tu perfil ahora. Una Membresía Comunitaria de pago existente está activa y puede administrar la facturación de forma segura. La inscripción a la Membresía Comunitaria de Franklin está abierta para perfiles verificados elegibles.',
            'You can use this guide now for free. Community Membership enrollment is open for eligible verified profiles, and no plan can guarantee leads, customers or revenue.':'Puedes usar esta guía gratis ahora. La inscripción a la Membresía Comunitaria está abierta para perfiles verificados elegibles y ningún plan puede garantizar contactos, clientes ni ingresos.',
            'an existing paid Community Membership is connected to the correct account and profile, is active, and stays active after restart. Existing members can use their member tools and secure billing and cancellation. New public enrollment is open for eligible verified profiles.':'una Membresía Comunitaria de pago existente está conectada a la cuenta y al perfil correctos, está activa y permanece activa después de un reinicio. Los miembros existentes pueden usar sus herramientas de miembro y la facturación y cancelación seguras. La nueva inscripción pública está abierta para perfiles verificados elegibles.'
          })
          tmp=pathlib.Path('/tmp/hf25-final-patch.json');tmp.write_text(json.dumps(d,ensure_ascii=False))
          subprocess.run([sys.executable,'transport/.github/hf25/apply_postlaunch_truth.py','candidate/public',str(tmp)],check=True)
          ev=pathlib.Path('candidate/public/evidence');ev.mkdir(exist_ok=True)
          shutil.copy2('transport/evidence/HF25_RULE_AND_SOURCE_RECONCILIATION_RECEIPT.json',ev/'HF25_RULE_AND_SOURCE_RECONCILIATION_RECEIPT.json')
          (ev/'HF25_EXACT_BUILD_INPUT.json').write_text(json.dumps({'publicParent':'9e8195d9c3939f791795ab38add326402b5d55c8','runtimePair':'44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8','controlCommit':__import__('subprocess').check_output(['git','-C','transport','rev-parse','HEAD'],text=True).strip(),'patchSha256':__import__('hashlib').sha256(tmp.read_bytes()).hexdigest()},indent=2)+'\n')
          PY
      - name: Whole-public-tree P0 truth, no-loss and authority gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess,hashlib
          root=Path('candidate/public');dist=root/'dist';runtime=Path('candidate/runtime')
          profiles=sorted((dist/'profiles').rglob('index.html'));assert len(profiles)==19103,len(profiles)
          diff=subprocess.check_output(['git','-C',str(root),'diff','--name-only','9e8195d9c3939f791795ab38add326402b5d55c8'],text=True).splitlines()
          assert not any(x.startswith('dist/profiles/') for x in diff),[x for x in diff if x.startswith('dist/profiles/')][:10]
          assert not any(x.startswith('data/') or x.startswith('lib/') for x in diff),[x for x in diff if x.startswith(('data/','lib/'))][:10]
          banned=['new public membership checkout is closed','new public membership checkout remains closed','new public checkout is currently closed','new public checkout remains closed','membership checkout is not open yet','membership enrollment is currently closed','membership enrollment and payment are not open yet','paid business membership is not open yet','enrollment, checkout, billing and paid member access are not active on this site','while enrollment remains closed','before checkout is available','membership comes later','before new checkout opens:','franklin will not reopen new enrollment']
          stale=[]
          for p in dist.rglob('*.html'):
            low=p.read_text(errors='ignore').lower()
            for phrase in banned:
              if phrase in low:stale.append((p.relative_to(dist).as_posix(),phrase))
          assert not stale,stale[:30]
          rx=re.compile(r'(?i)(membership|checkout|enrollment|paid member access).{0,100}(closed|not open yet|not available yet|not active on this site|when enrollment opens|before checkout is available)|will not reopen.{0,50}enrollment')
          semantic=[]
          for p in dist.rglob('*.html'):
            plain=re.sub(r'<[^>]+>',' ',p.read_text(errors='ignore'));plain=re.sub(r'\s+',' ',plain)
            for m in rx.finditer(plain):semantic.append((p.relative_to(dist).as_posix(),m.group(0)))
          assert not semantic,semantic[:30]
          assert subprocess.check_output(['git','-C',str(runtime),'rev-parse','HEAD'],text=True).strip()=='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8'
          server=(runtime/'server.js').read_text();reservation=(runtime/'lib/purchase-reservations.js').read_text();catalog=(runtime/'lib/catalog.js').read_text()
          for token in ['COMMERCE_DISABLED','MEMBERSHIP_ALREADY_ACTIVE','PROFILE_VERIFICATION_REQUIRED','startSafePurchase']:assert token in server or token in reservation,token
          for token in ['regularUsd:5','regularUsd:50','regularUsd:120','franklin_community_member_monthly_v5','franklin_community_member_annual_v5','franklin_charter_member_36_month_v5']:assert token in catalog,token
          missing=[]
          for p in dist.rglob('*.html'):
            t=p.read_text(errors='ignore')
            for href in re.findall(r'href=["\']([^"\']+)',t):
              if not href.startswith('/') or href.startswith('//'):continue
              href=href.split('#',1)[0].split('?',1)[0]
              if not href:continue
              q=dist/href.lstrip('/')
              if not(q.is_file() or (q/'index.html').is_file()):missing.append((p.relative_to(dist).as_posix(),href))
          assert not missing,missing[:30]
          for name in diff:
            if not name.startswith('dist/'):continue
            t=(root/name).read_text(errors='ignore');low=t.lower()
            assert not re.search(r'\bsk_live_[A-Za-z0-9]{16,}',t),name
            assert not re.search(r'\bwhsec_[A-Za-z0-9]{16,}',t),name
            assert 'smarterjustice.com' not in low and 'smarter-justice' not in low,name
          report={'schemaVersion':'franklin.hf25.static-no-loss.v1','profilePages':19103,'changedFiles':diff,'staleStaticClaims':0,'semanticPrelaunchClaims':0,'internalBrokenLinks':0,'runtimeCommit':'44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8','pricesUsd':[5,50,120],'profileFactsChanged':False,'profileMutations':0,'financialMutations':0,'smarterJusticeDonorUsed':False}
          (root/'evidence/HF25_STATIC_NO_LOSS.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps({'profiles':19103,'changed':len(diff),'stale':0,'brokenLinks':0}))
          PY
      - name: Full unchanged runtime checks
        working-directory: candidate/runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Render all changed HTML in EN/ES on phone and desktop
        run: |
          set -euo pipefail
          python -m http.server 8876 --bind 127.0.0.1 --directory candidate/public/dist >/tmp/hf25-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,subprocess
          root=Path('candidate/public');ev=root/'evidence/hf25-browser';ev.mkdir(parents=True,exist_ok=True)
          changed=[x for x in subprocess.check_output(['git','-C',str(root),'diff','--name-only','9e8195d9c3939f791795ab38add326402b5d55c8'],text=True).splitlines() if x.startswith('dist/') and x.endswith('.html')]
          banned=['new public membership checkout is closed','new public membership checkout remains closed','new public checkout is currently closed','new public checkout remains closed','membership checkout is not open yet','membership enrollment is currently closed','membership enrollment and payment are not open yet','paid business membership is not open yet','while enrollment remains closed','before checkout is available','membership comes later','before new checkout opens:','franklin will not reopen new enrollment'];rows=[]
          def ok(i,v,d=''):rows.append({'id':i,'pass':bool(v),'detail':d});assert v,(i,d)
          with sync_playwright() as p:
            b=p.chromium.launch()
            for rel in changed:
              route='/'+rel[5:];route=route[:-10] if route.endswith('index.html') else route
              for width in [390,1280]:
                c=b.new_context(viewport={'width':width,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));resp=page.goto('http://127.0.0.1:8876'+route,wait_until='networkidle');body=page.locator('body').inner_text();low=body.lower()
                ok(f'{rel}:{width}:http',resp is not None and resp.status==200,str(resp.status if resp else None));ok(f'{rel}:{width}:h1',page.locator('main h1').count()==1);ok(f'{rel}:{width}:stale',not any(x in low for x in banned));ok(f'{rel}:{width}:overflow',page.evaluate('document.documentElement.scrollWidth<=document.documentElement.clientWidth+2'));ok(f'{rel}:{width}:js',not errs,' | '.join(errs[:3]))
                if page.locator('[data-r37-lang="es"]').count():
                  page.locator('[data-r37-lang="es"]').click();page.wait_for_timeout(220);ok(f'{rel}:{width}:es-lang',page.locator('html').get_attribute('lang')=='es');spanish=page.locator('body').inner_text();ok(f'{rel}:{width}:es-open-copy','Eligible verified profiles can start membership setup now after representation is confirmed.' not in spanish)
                c.close()
            b.close()
          report={'schemaVersion':'franklin.hf25.browser.v1','result':'PASS','changedHtmlPages':len(changed),'viewports':[390,1280],'assertions':len(rows),'pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'results':rows};(ev/'BROWSER.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n');print(json.dumps({'pages':len(changed),'assertions':len(rows),'fail':report['fail']}))
          PY
      - name: Verify current live commerce remains open and exact during qualification
        run: |
          python - <<'PY'
          import urllib.request,json
          def get(u):return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Franklin-HF25-v9/1.0','Cache-Control':'no-cache'}),timeout=30))
          r=get('https://franklin-navigator-membership.onrender.com/ready');c=get('https://franklin-navigator-membership.onrender.com/api/catalog')
          assert r['ok'] and r['database'] and r['commerceEnabled'] and r['liveCheckoutEnabled'] and r['stripeCheckoutSessionConfigured'] and r['stripeWebhookConfigured'] and r['portalSessionConfigured'] and r['startupError'] is None
          assert c['publicCheckoutOpen'] and [x['priceUsd'] for x in c['choices']]==[5,50,120]
          print(json.dumps({'commerceEnabled':True,'liveCheckoutEnabled':True,'publicCheckoutOpen':True,'pricesUsd':[5,50,120]}))
          PY
      - name: Exact-parent currentness recheck and prepared direct-child commit
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,urllib.request,os,subprocess,base64,datetime
          root=Path('candidate/public');base='9e8195d9c3939f791795ab38add326402b5d55c8';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8';repo='neutralboardroom/franklin-navigator'
          def api(p):return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}),timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base,'main advanced; must rebase'
          assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime,'runtime advanced; must requalify pair'
          diff=subprocess.check_output(['git','-C',str(root),'diff','--name-only',base],text=True).splitlines()
          def td(p):
            h=hashlib.sha256();p=Path(p)
            for f in sorted(p.rglob('*')):
              if f.is_file():h.update(f.relative_to(p).as_posix().encode()+b'\0'+hashlib.sha256(f.read_bytes()).hexdigest().encode()+b'\n')
            return h.hexdigest()
          release={'release':'FR-NAV1.15.0-HF2.5-CANDIDATE','component':'public','parent':base,'runtimePair':runtime,'publicDistSha256':td(root/'dist'),'publicDistDigestRule':'sorted path + NUL + file sha256 hex + LF','profileCount':19103,'profileFactsChanged':False,'commerceOpenedByBuild':False,'commercePreservedOpen':True,'commercialContractChanged':False,'smarterJusticeDonorUsed':False,'qualification':{'runId':int(os.environ['GITHUB_RUN_ID']),'sourceState':'PUBLIC_SOURCE_BROWSER_QUALIFIED','financialMutations':0},'rollback':{'publicCommit':base,'runtimeCommerceKillSwitch':'COMMERCE_ENABLED=false'},'generatedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()};(root/'PRODUCTION_RELEASE.json').write_text(json.dumps(release,indent=2,sort_keys=True)+'\n');names=sorted(set(diff+['PRODUCTION_RELEASE.json']))
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf25-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);assert set(git('diff','--cached','--name-only').splitlines())==set(names);git('commit','-m','Correct Franklin post-launch membership truth across public EN/ES surfaces; preserve live checkout [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env);out={'preparedCommit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base,'runtimePair':runtime,'branch':branch,'changedFiles':names,'productionPromotion':False,'financialMutations':0};(root/'evidence/HF25_PREPARED.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: hf25-complete-v9-evidence, path: candidate/public/evidence/, retention-days: 14, if-no-files-found: error}
