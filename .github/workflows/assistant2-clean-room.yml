name: Franklin Assistant clean-room boundary
on:
  push:
    branches: [main]
    paths:
      - 'dist/assets/franklin-assistant.js'
      - 'dist/assets/hf36.js'
      - 'dist/index.html'
      - 'dist/es/index.html'
      - 'dist/assistant/index.html'
      - 'dist/es/asistente/index.html'
      - 'tests/assistant2-clean-room-boundary.cjs'
      - '.github/workflows/assistant2-clean-room.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check dist/assets/franklin-assistant.js
          node --check dist/assets/hf36.js
      - name: Clean-room boundary
        run: node tests/assistant2-clean-room-boundary.cjs
