name: HF26 full public-language qualification v2
on:
  push:
    branches: [local-franklin-hf26-public-language-20260908]
    paths: [.github/hf26/public_language_refine.py, .github/workflows/hf26-language-qualification-v2.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: transport, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 01aecafbfe16202d9d5a80eb6b97443c9ee305ad, path: candidate, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8, path: runtime, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Apply public-language pass and context-safe refinement
        run: |
          set -euo pipefail
          cp transport/.github/hf26/public_language_patch.py ./public_language_patch.py
          python public_language_patch.py
          python transport/.github/hf26/public_language_refine.py
      - name: Protect all profile data, prices, runtime and open checkout
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,urllib.request
          cand=Path('candidate');protected=[]
          for p in sorted((cand/'dist/data').glob('franklin-profiles*')):
            if p.is_file():protected.append(p)
          for p in sorted((cand/'dist/data/profiles').rglob('*')) if (cand/'dist/data/profiles').exists() else []:
            if p.is_file():protected.append(p)
          for p in protected:
            rel=p.relative_to(cand).as_posix();before=subprocess.check_output(['git','-C','candidate','show','HEAD:'+rel]);assert hashlib.sha256(before).hexdigest()==hashlib.sha256(p.read_bytes()).hexdigest(),rel
          profiles=list((cand/'dist/profiles').rglob('index.html'));assert len(profiles)==19103
          assert subprocess.check_output(['git','-C','runtime','rev-parse','HEAD'],text=True).strip()=='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8'
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Franklin-HF26-language-v2/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          ready=get('https://franklin-navigator-membership.onrender.com/ready');cat=get('https://franklin-navigator-membership.onrender.com/api/catalog')
          assert ready['database'] and ready['commerceEnabled'] and ready['liveCheckoutEnabled'] and ready['stripeCheckoutSessionConfigured'] and ready['stripeWebhookConfigured'] and ready['portalSessionConfigured'] and ready['startupError'] is None
          assert cat['publicCheckoutOpen'] and [x['priceUsd'] for x in cat['choices']]==[5,50,120]
          print(json.dumps({'profiles':len(profiles),'protectedProfileDataFiles':len(protected),'runtime':'UNCHANGED','checkout':'OPEN','prices':[5,50,120]}))
          PY
      - name: Syntax-check every changed public JavaScript file
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/hf26js
          import json
          d=json.load(open('candidate/evidence/HF26_LANGUAGE_PATCH_SCOPE.json'))
          for p in d['changedFiles']:
            if p.endswith('.js'):print('candidate/'+p)
          PY
          while IFS= read -r f; do node --check "$f"; done </tmp/hf26js
      - name: Strict full-site language and metadata quality gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter
          import json,re
          root=Path('candidate/dist');records=[];issues=[]
          hidden={'script','style','noscript','template','svg','path','meta','link'};attrs={'title','aria-label','placeholder','alt'}
          class P(HTMLParser):
            def __init__(self,path):super().__init__(convert_charrefs=True);self.path=path;self.stack=[];self.skip=0
            def handle_starttag(self,tag,a):
              self.stack.append(tag)
              if tag in hidden:self.skip+=1
              d=dict(a)
              if tag=='meta' and d.get('name')=='description' and d.get('content'):records.append((self.path,'meta',d['content'].strip()))
              if not self.skip:
                for k in attrs:
                  v=d.get(k)
                  if v and re.search(r'[A-Za-zÁ-ÿ]',v):records.append((self.path,k,re.sub(r'\s+',' ',v).strip()))
            def handle_endtag(self,tag):
              if tag in hidden and self.skip:self.skip-=1
              if self.stack:self.stack.pop()
            def handle_data(self,data):
              if not self.skip:
                t=re.sub(r'\s+',' ',data).strip()
                if t and re.search(r'[A-Za-zÁ-ÿ]',t):records.append((self.path,self.stack[-1] if self.stack else 'text',t))
          htmls=sorted(root.rglob('*.html'))
          for p in htmls:P(p.relative_to(root).as_posix()).feed(p.read_text(errors='ignore'))
          banned=['Ask Navigator','Your everyday operating system','public-source evidence','public-source facts','source-backed facts','directory projection','Profile representation review','representation review','Growth Desk entitlement','learning-provider schema','The user indicated','material claim','next-best actions','first-value path','first-value plan','responsible starting points','paid membership is not open today','membership paid is not open today','evidence window','reach the responsible official source','Preview bilingual member growth tools','future active paid subscribed locations','Claim / manage this profile','Profile verified. You can continue when checkout is available.']
          internal=re.compile(r'\b(?:ADMIN_TOKEN|lookup key|lookupKey|entitlement key|canonical profile id|runtime service|schema version|webhook event|reconciliation control|deployment receipt|source state|authority state|Profile Factory|Local Investigator)\b',re.I)
          for path,kind,text in records:
            low=text.casefold()
            for b in banned:
              if b.casefold() in low:issues.append({'type':'BANNED_PHRASE','file':path,'kind':kind,'phrase':b,'text':text})
            if internal.search(text):issues.append({'type':'INTERNAL_LANGUAGE','file':path,'kind':kind,'text':text})
            if kind=='meta' and len(text)>165:issues.append({'type':'META_TOO_LONG','file':path,'chars':len(text),'text':text})
          # Organization names are canonical facts and may legitimately be uppercase. Judge all-caps style only outside profile pages.
          allowed={'FAQ','IRS','USDA','FEMA','ADA','TDEC','TDOT','NPI','HIPAA','YMCA','TN','USA','COVID','CPR','GED','ESL','DMV','TBI','DCS','TDHS','SNAP','WIC','VA','WCPR'}
          for p,k,t in records:
            if p.startswith('profiles/'):continue
            bad=[w for w in re.findall(r'\b[A-Z][A-Z/&-]{3,}\b',t) if w not in allowed]
            if bad and len(t)<160:issues.append({'type':'ALL_CAPS_UI','file':p,'words':bad,'text':t})
          # Context-safe Spanish voice: possessives/conjugations always reveal informal address; imperatives only when used as commands.
          informal_any=re.compile(r'\b(?:tú|tu|tus|puedes|quieres|tienes|necesitas|debes)\b',re.I)
          informal_imp=re.compile(r'(?:^|[.!?;:]\s+|\b(?:y|luego|después|también|primero|ahora)\s+)(?:elige|selecciona|confirma|revisa|usa|utiliza|abre|busca|filtra|compara|guarda|escribe|introduce|ingresa|haz|mantén|verifica|evita|solicita|crea|prepara|organiza|encuentra|explora|lee|añade|adjunta|reinicia)\b',re.I)
          for p,k,t in records:
            if p.startswith('es/'):
              m1=informal_any.search(t);m2=informal_imp.search(t)
              if m1 or m2:issues.append({'type':'SPANISH_VOICE_MIX','file':p,'text':t,'match':(m1 or m2).group(0)})
          # Dynamic translation catalog must follow the same voice and terminology.
          tr=json.loads((root/'data/r37-es-public-strings.json').read_text())['translations']
          for key,val in tr.items():
            m1=informal_any.search(val);m2=informal_imp.search(val)
            if m1 or m2:issues.append({'type':'SPANISH_CATALOG_VOICE_MIX','key':key,'text':val,'match':(m1 or m2).group(0)})
            for b in banned:
              if b.casefold() in val.casefold():issues.append({'type':'SPANISH_CATALOG_BANNED','key':key,'phrase':b,'text':val})
          # Inspect customer-facing JS string literals for internal/stale language and shouting output headings.
          lit=re.compile(r"(?<![A-Za-z0-9_$])(['\"])(.{2,700}?)(?<!\\)\1")
          for jp in sorted((root/'assets').glob('*.js')):
            if jp.stat().st_size>900000:continue
            for m in lit.finditer(jp.read_text(errors='ignore')):
              s=re.sub(r'\\[nt]',' ',m.group(2));
              if not re.search(r'[A-Za-zÁ-ÿ]{3}',s):continue
              for b in banned:
                if b.casefold() in s.casefold():issues.append({'type':'JS_BANNED','file':jp.name,'phrase':b,'text':s})
              if internal.search(s):issues.append({'type':'JS_INTERNAL','file':jp.name,'text':s})
              # All-caps only when the whole customer label/message is substantially uppercase, not abbreviations within prose.
              letters=''.join(c for c in s if c.isalpha())
              if len(letters)>=12 and letters.upper()==letters and any(c.isalpha() for c in s):issues.append({'type':'JS_ALL_CAPS','file':jp.name,'text':s[:300]})
              if re.search(r'[áéíóúñ¿¡]',s,re.I):
                m1=informal_any.search(s);m2=informal_imp.search(s)
                if m1 or m2:issues.append({'type':'JS_SPANISH_VOICE_MIX','file':jp.name,'text':s[:500],'match':(m1 or m2).group(0)})
          assert 'Franklin Navigator | Franklin Navigator' not in (root/'index.html').read_text()
          assert 'Franklin Navigator | Franklin Navigator' not in (root/'es/index.html').read_text()
          summary={'schemaVersion':'franklin.hf26.language-quality.v2','htmlPages':len(htmls),'profilePages':sum(1 for p in htmls if p.relative_to(root).as_posix().startswith('profiles/')),'visibleRecords':len(records),'issues':len(issues),'issueCounts':dict(Counter(x['type'] for x in issues))}
          Path('candidate/evidence/HF26_LANGUAGE_QUALITY.json').write_text(json.dumps({'summary':summary,'issues':issues[:5000]},ensure_ascii=False,indent=2)+'\n');print(json.dumps(summary));
          if issues:
            print(json.dumps(issues[:100],ensure_ascii=False,indent=2));raise SystemExit('language defects remain: '+str(len(issues)))
          PY
      - name: Full runtime regression
        run: |
          set -euo pipefail
          cd runtime
          npm ci --ignore-scripts --no-audit --no-fund
          node --test | tee ../candidate/evidence/HF26_RUNTIME_TESTS.tap
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser every non-profile page at phone and desktop plus broad profile sample
        run: |
          set -euo pipefail
          python -m http.server 8878 --bind 127.0.0.1 --directory candidate/dist >/tmp/hf26-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          root=Path('candidate/dist');origin='http://127.0.0.1:8878';rows=[]
          pages=sorted(p.relative_to(root).as_posix() for p in root.rglob('index.html') if not p.relative_to(root).as_posix().startswith('profiles/'));profiles=sorted(p.relative_to(root).as_posix() for p in (root/'profiles').rglob('index.html'));step=max(1,len(profiles)//100);sample=profiles[::step][:100]
          def url(rel):return origin+'/'+(rel[:-10] if rel.endswith('index.html') else rel)
          with sync_playwright() as p:
            b=p.chromium.launch()
            for width,subset in [(390,pages+sample),(1280,pages)]:
              for rel in subset:
                c=b.new_context(viewport={'width':width,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));resp=page.goto(url(rel),wait_until='domcontentloaded');page.wait_for_timeout(20);rows.append({'file':rel,'width':width,'status':resp.status if resp else 0,'h1':page.locator('main h1').count(),'errors':errs,'overflow':page.evaluate('document.documentElement.scrollWidth>document.documentElement.clientWidth+2'),'lang':page.locator('html').get_attribute('lang')});c.close()
            b.close()
          fail=[r for r in rows if r['status']!=200 or r['h1']!=1 or r['errors'] or r['overflow']];out={'schemaVersion':'franklin.hf26.browser-all-public.v2','nonProfilePages':len(pages),'profileSample':len(sample),'assertedViews':len(rows),'failures':len(fail),'results':rows,'financialMutations':0};Path('candidate/evidence/HF26_BROWSER_ALL_PUBLIC.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps({k:out[k] for k in ['nonProfilePages','profileSample','assertedViews','failures']}));assert not fail,fail[:10]
          PY
      - name: Preserve Assistant, member safety and live commerce
        run: |
          set -euo pipefail
          grep -q 'MEMBERSHIP_ALREADY_ACTIVE' candidate/dist/assets/membership-live.js
          grep -q 'CHECKOUT_PENDING_MESSAGE' candidate/dist/assets/membership-live.js
          grep -q 'checkout.stripe.com' candidate/dist/assets/membership-live.js
          grep -q 'tel:911' candidate/dist/assets/r38-assistant-followthrough.js
          python - <<'PY'
          import urllib.request,json
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Franklin-HF26-preserve-v2/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          r=get('https://franklin-navigator-membership.onrender.com/ready');c=get('https://franklin-navigator-membership.onrender.com/api/catalog');assert r['commerceEnabled'] and r['liveCheckoutEnabled'] and r['database'] and r['startupError'] is None;assert c['publicCheckoutOpen'] and [x['priceUsd'] for x in c['choices']]==[5,50,120];print('LIVE_COMMERCE_PRESERVED')
          PY
      - name: Fresh parent check and prepare direct child
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request,os,subprocess,base64
          repo='neutralboardroom/franklin-navigator';base='01aecafbfe16202d9d5a80eb6b97443c9ee305ad';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8';root=Path('candidate')
          def api(p):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'});return json.load(urllib.request.urlopen(req,timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base;assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime
          scope=json.loads((root/'evidence/HF26_LANGUAGE_PATCH_SCOPE.json').read_text());names=sorted(scope['changedFiles'])+['evidence/HF26_LANGUAGE_PATCH_SCOPE.json','evidence/HF26_LANGUAGE_QUALITY.json','evidence/HF26_RUNTIME_TESTS.tap','evidence/HF26_BROWSER_ALL_PUBLIC.json'];meta={'release':'FR-NAV1.15.0-HF2.6-CANDIDATE','component':'public','parent':base,'runtimePair':runtime,'scope':'PUBLIC_LANGUAGE_ONLY','changedFiles':len(scope['changedFiles']),'profileCount':19103,'profileFactsChanged':False,'pricesChanged':False,'checkoutRemainsOpen':True,'qualificationRunId':int(os.environ['GITHUB_RUN_ID']),'authorityTransfer':False};(root/'PRODUCTION_RELEASE.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n');names.append('PRODUCTION_RELEASE.json')
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf26-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);staged=git('diff','--cached','--name-only').splitlines();assert set(staged)==set(names);git('commit','-m','Refine public language across every Franklin page in English and Spanish; preserve facts and live commerce [skip ci]');assert git('rev-parse','HEAD^')==base;env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env);out={'preparedCommit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base,'runtimePair':runtime,'branch':branch,'changedFiles':len(scope['changedFiles']),'profileCount':19103,'profileFactsChanged':False,'checkoutRemainsOpen':True,'financialMutations':0};(root/'evidence/HF26_PREPARED.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf26-public-language-qualification-v2
          path: candidate/evidence/
          retention-days: 14
          if-no-files-found: error
