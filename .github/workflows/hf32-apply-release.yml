name: HF32 repair shared UI stability

on:
  push:
    branches:
      - hf32-owner-approved-simplification-20260910
    paths:
      - .github/workflows/hf32-apply-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf32-owner-approved-simplification-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make shared label writes idempotent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/assets/hf32-public.js')
          s=p.read_text(encoding='utf-8')
          old="""  function markNative(el,en,es){
    if(!el)return;el.dataset.hf32En=en;el.dataset.hf32Es=es;el.setAttribute('data-franklin-native-locale','');el.textContent=tx(en,es);
  }"""
          new="""  function markNative(el,en,es){
    if(!el)return;
    if(el.dataset.hf32En!==en)el.dataset.hf32En=en;
    if(el.dataset.hf32Es!==es)el.dataset.hf32Es=es;
    if(!el.hasAttribute('data-franklin-native-locale'))el.setAttribute('data-franklin-native-locale','');
    const next=tx(en,es);if(el.textContent!==next)el.textContent=next;
  }"""
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('MARKNATIVE_IDEMPOTENT_APPLIED')
          elif 'const next=tx(en,es);if(el.textContent!==next)el.textContent=next;' in s:
              print('MARKNATIVE_ALREADY_IDEMPOTENT')
          else:
              raise SystemExit('unexpected markNative implementation')
          PY
      - name: Verify source and no-loss invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check dist/assets/hf32-public.js
          node --check dist/assets/r37-i18n.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          pages=list(Path('dist').rglob('index.html'))
          assert len(pages)==19355,len(pages)
          assert len(list(Path('dist/profiles').glob('*/index.html')))==19103
          assert all('FR-NAV1.21.0-HF3.2-CANDIDATE' in p.read_text(encoding='utf-8') for p in pages)
          assert all(p.read_text(encoding='utf-8').count('data-hf32-direct="1"')==1 for p in pages)
          changed=subprocess.check_output(['git','diff','--name-only','50bf87535d7cd9bb5aabaaf5b1b93f4602549fa2...HEAD'],text=True).splitlines()
          assert not [x for x in changed if x.startswith(('server/','dist/data/'))]
          print('HF32_SOURCE_NO_LOSS_PASS')
          PY
          git diff --check
      - name: Commit stability repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist/assets/hf32-public.js
          if git diff --cached --quiet; then
            echo 'No stability change to commit.'
          else
            git commit -m 'Make HF3.2 shared UI label writes idempotent'
            git push origin HEAD:hf32-owner-approved-simplification-20260910
          fi
