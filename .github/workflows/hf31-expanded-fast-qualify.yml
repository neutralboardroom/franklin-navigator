name: HF31 expanded fast qualification
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - .github/workflows/hf31-expanded-fast-qualify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fast exact expanded source qualification
        run: python3 scripts/validate-hf31-expanded-fast.py
      - name: Syntax check changed and retained interaction layers
        run: |
          node --check dist/assets/hf31-public.js
          node --check dist/assets/hf31-deep-public.js
          node --check dist/assets/hf31-deep-language-runtime.js
          node --check dist/assets/community-explorer.js
          node --check dist/assets/r37-i18n.js
          node --check dist/assets/hf27-navigation.js
          node --check dist/assets/hf29-design.js
          node --check dist/assets/r40-assistant-safety-guard.js
      - name: Assert retained assistant and navigation safety contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          need={
            'dist/assets/hf27-navigation.js':['r41-nav-more','r41-more-actions','urgent-section'],
            'dist/assets/hf29-design.js':['hf29-example-select','Other useful options','hf29-card-more'],
            'dist/assets/r40-assistant-safety-guard.js':['911','988'],
          }
          for path,tokens in need.items():
            s=Path(path).read_text('utf-8')
            missing=[t for t in tokens if t not in s]
            if missing: raise SystemExit(f'{path} missing retained tokens {missing}')
          print('HF31_RETAINED_NAV_ASSISTANT_SAFETY_PASS')
          PY
