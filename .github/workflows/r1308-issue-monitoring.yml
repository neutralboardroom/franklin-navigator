name: Franklin issue monitoring and alert hygiene acceptance
on:
  push:
    branches: [franklin-commerce-runtime-r30, r1353-alert-storm-runtime-20260921, r1353-alert-storm-runtime-hotfix-20260921]
    paths:
      - 'server.js'
      - 'lib/incident-monitor.js'
      - 'schema/005_issue_monitoring.sql'
      - 'acceptance/issue-monitoring.integration.cjs'
      - 'test/r1353-alert-hygiene.test.js'
      - 'acceptance/owner-review-setup.integration.cjs'
      - 'acceptance/owner-first-value-reconcile.integration.cjs'
      - '.github/workflows/r1308-issue-monitoring.yml'
  pull_request:
    branches: [franklin-commerce-runtime-r30]
    paths:
      - 'server.js'
      - 'lib/incident-monitor.js'
      - 'render.yaml'
      - '.env.example'
      - 'package.json'
      - 'test/profile-claim-management.test.js'
      - 'test/r1346-claim-path-contract.test.js'
      - 'test/r1353-alert-hygiene.test.js'
      - 'acceptance/issue-monitoring.integration.cjs'
      - '.github/workflows/r1308-issue-monitoring.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: franklin-issue-monitoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: franklin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d franklin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/franklin_test
      TEST_REPORT_DIR: evidence/r1308
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and source contracts
        run: |
          node --check server.js
          node --check lib/incident-monitor.js
          test -f schema/005_issue_monitoring.sql
          grep -F "const VERSION='FRANKLIN_ISSUE_MONITOR_3'" lib/incident-monitor.js
          grep -F "EXTERNAL_CONFIG_REQUIRED" schema/005_issue_monitoring.sql
          grep -F "SRE_OWNER_CONSOLE_ISSUE_HANDOFF_V1" server.js
      - name: Existing runtime unit tests
        run: npm test
      - name: R1353 alert lifecycle decision tests
        run: node --test test/r1353-alert-hygiene.test.js
      - name: R1308 issue monitoring HTTP acceptance
        run: |
          mkdir -p evidence/r1308
          set +e
          node acceptance/issue-monitoring.integration.cjs > evidence/r1308/ISSUE_MONITORING_HTTP_ACCEPTANCE.log 2>&1
          status=$?
          cat evidence/r1308/ISSUE_MONITORING_HTTP_ACCEPTANCE.log
          exit $status
      - name: Existing registration claim profile review acceptance
        run: |
          set +e
          node acceptance/owner-review-setup.integration.cjs > evidence/r1308/MEMBER_CLAIM_PROFILE_ACCEPTANCE.log 2>&1
          status=$?
          cat evidence/r1308/MEMBER_CLAIM_PROFILE_ACCEPTANCE.log
          exit $status
      - name: Existing first-value reconciliation acceptance
        run: |
          set +e
          node acceptance/owner-first-value-reconcile.integration.cjs > evidence/r1308/FIRST_VALUE_ACCEPTANCE.log 2>&1
          status=$?
          cat evidence/r1308/FIRST_VALUE_ACCEPTANCE.log
          exit $status
      - name: Upload R1308 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FR-NAV1.30.53-HF3.13.35-alert-hygiene-evidence
          path: evidence/r1308
          if-no-files-found: warn
          retention-days: 30
