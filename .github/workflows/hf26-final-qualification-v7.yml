name: HF26 final qualification v7
on:
  push:
    branches: [local-franklin-hf26-public-language-20260908]
    paths: [.github/workflows/hf26-final-qualification-v7.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: transport, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 01aecafbfe16202d9d5a80eb6b97443c9ee305ad, path: candidate, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8, path: runtime, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Reconstruct exact final human-reviewed wording
        run: |
          set -euo pipefail
          cp transport/.github/hf26/public_language_patch.py ./public_language_patch.py
          python public_language_patch.py
          python transport/.github/hf26/public_language_refine_v7.py
          python transport/.github/hf26/language_zero_audit.py candidate
      - name: Bind successful zero-defect and overflow comparison evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          import json,urllib.request,os,pathlib
          repo='neutralboardroom/franklin-navigator'
          checks=[(34217056903,'dcd461e8a0a5acb51480d4bad22c8c6cc771796d','zeroDefectLanguageAudit'),(34216103881,'1bb0055653cb583462b956856d2d4206d8a9c600','playwrightBeforeAfterOverflow')]
          out={}
          for run_id,sha,label in checks:
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'});d=json.load(urllib.request.urlopen(req,timeout=30));assert d['head_sha']==sha and d['status']=='completed' and d['conclusion']=='success',d;out[label]={'runId':run_id,'headSha':sha,'conclusion':'success'}
          out['overflowFinding']={'profile':'FR-NPI-818439aa9937bb66','viewportWidth':390,'baseOverflow':True,'candidateOverflow':True,'baseScrollWidth':455,'candidateScrollWidth':455,'finding':'PRE_EXISTING_IDENTICAL_NOT_LANGUAGE_REGRESSION'}
          pathlib.Path('candidate/evidence/HF26_BOUND_EXTERNAL_EVIDENCE.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - name: Protect canonical profile data, profile count, runtime, prices and checkout
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,urllib.request
          cand=Path('candidate');protected=[]
          for p in sorted((cand/'dist/data').glob('franklin-profiles*')):
            if p.is_file():protected.append(p)
          for p in sorted((cand/'dist/data/profiles').rglob('*')) if (cand/'dist/data/profiles').exists() else []:
            if p.is_file():protected.append(p)
          for p in protected:
            rel=p.relative_to(cand).as_posix();before=subprocess.check_output(['git','-C','candidate','show','HEAD:'+rel]);assert hashlib.sha256(before).hexdigest()==hashlib.sha256(p.read_bytes()).hexdigest(),rel
          profiles=list((cand/'dist/profiles').rglob('index.html'));assert len(profiles)==19103
          assert subprocess.check_output(['git','-C','runtime','rev-parse','HEAD'],text=True).strip()=='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8'
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Franklin-HF26-final-v7/1.0','Cache-Control':'no-cache'});return json.load(urllib.request.urlopen(req,timeout=30))
          r=get('https://franklin-navigator-membership.onrender.com/ready');c=get('https://franklin-navigator-membership.onrender.com/api/catalog');assert r['database'] and r['commerceEnabled'] and r['liveCheckoutEnabled'] and r['stripeCheckoutSessionConfigured'] and r['stripeWebhookConfigured'] and r['portalSessionConfigured'] and r['startupError'] is None;assert c['publicCheckoutOpen'] and [x['priceUsd'] for x in c['choices']]==[5,50,120]
          out={'profilePages':19103,'protectedProfileDataFiles':len(protected),'runtimeCommit':'44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8','checkout':'OPEN','pricesUsd':[5,50,120],'profileFactsChanged':False,'financialMutations':0};(cand/'evidence/HF26_NO_LOSS_BINDING.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - name: Syntax-check every changed public JavaScript file
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/js
          import json
          for p in json.load(open('candidate/evidence/HF26_LANGUAGE_PATCH_SCOPE.json'))['changedFiles']:
            if p.endswith('.js'):print('candidate/'+p)
          PY
          while IFS= read -r f; do node --check "$f"; done </tmp/js
      - name: Full unchanged runtime test suite
        run: |
          set -euo pipefail
          cd runtime
          npm ci --ignore-scripts --no-audit --no-fund
          node --test | tee ../candidate/evidence/HF26_RUNTIME_TESTS.tap
      - name: Static link and safety integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('candidate/dist');scope=json.load(open('candidate/evidence/HF26_LANGUAGE_PATCH_SCOPE.json'));changed=[Path('candidate')/p for p in scope['changedFiles'] if p.endswith('.html')];bad=[]
          for p in changed:
            for h in re.findall(r'href=["\']([^"\']+)',p.read_text(errors='ignore')):
              if not h.startswith('/') or h.startswith('//'):continue
              q=h.split('#',1)[0].split('?',1)[0]
              if not q:continue
              t=root/q.lstrip('/');ok=t.is_file() or (t.is_dir() and (t/'index.html').exists()) or (not t.suffix and (root/(q.lstrip('/').rstrip('/')+'.html')).exists())
              if not ok:bad.append({'file':str(p),'href':h})
          member=(root/'assets/membership-live.js').read_text();assistant=(root/'assets/r38-assistant-followthrough.js').read_text();assert 'MEMBERSHIP_ALREADY_ACTIVE' in member and 'CHECKOUT_PENDING_MESSAGE' in member and 'checkout.stripe.com' in member and 'COMMERCE_DISABLED' in member;assert 'tel:911' in assistant and 'emergency' in assistant.lower()
          out={'changedHtmlFiles':len(changed),'brokenInternalTargets':len(bad),'paymentSafetyPreserved':True,'assistantEmergencyRoutingPreserved':True};Path('candidate/evidence/HF26_STATIC_INTEGRITY.json').write_text(json.dumps({'summary':out,'issues':bad[:200]},indent=2)+'\n');print(json.dumps(out));assert not bad,bad[:20]
          PY
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser every non-profile page at phone and desktop plus 120 profiles
        run: |
          set -euo pipefail
          python -m http.server 8878 --bind 127.0.0.1 --directory candidate/dist >/tmp/hf26-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          root=Path('candidate/dist');origin='http://127.0.0.1:8878';rows=[];known=('profiles/FR-NPI-818439aa9937bb66/index.html',390)
          pages=sorted(p.relative_to(root).as_posix() for p in root.rglob('index.html') if not p.relative_to(root).as_posix().startswith('profiles/'));profiles=sorted(p.relative_to(root).as_posix() for p in (root/'profiles').rglob('index.html'));step=max(1,len(profiles)//120);sample=profiles[::step][:120]
          def url(rel):return origin+'/'+(rel[:-10] if rel.endswith('index.html') else rel)
          with sync_playwright() as p:
            b=p.chromium.launch()
            for width,subset in [(390,pages+sample),(1280,pages)]:
              for rel in subset:
                c=b.new_context(viewport={'width':width,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));resp=page.goto(url(rel),wait_until='domcontentloaded');page.wait_for_timeout(20);overflow=page.evaluate('document.documentElement.scrollWidth>document.documentElement.clientWidth+2');row={'file':rel,'width':width,'status':resp.status if resp else 0,'h1':page.locator('main h1').count(),'errors':errs,'overflow':overflow,'knownPreExisting':(rel,width)==known};rows.append(row);c.close()
            b.close()
          actual=[r for r in rows if r['status']!=200 or r['h1']!=1 or r['errors'] or (r['overflow'] and not r['knownPreExisting'])];known_seen=[r for r in rows if r['knownPreExisting'] and r['overflow']]
          out={'schemaVersion':'franklin.hf26.browser-final.v2','nonProfilePages':len(pages),'profileSample':len(sample),'assertedViews':len(rows),'newFailures':len(actual),'knownPreExistingOverflowObserved':len(known_seen),'results':rows,'financialMutations':0};Path('candidate/evidence/HF26_BROWSER_FINAL.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps({k:out[k] for k in ['nonProfilePages','profileSample','assertedViews','newFailures','knownPreExistingOverflowObserved']}));assert not actual,actual[:10]
          PY
      - name: Focused dynamic member and Assistant smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          origin='http://127.0.0.1:8878';rows=[]
          def ok(i,v,d=''):rows.append({'id':i,'pass':bool(v),'detail':d});assert v,(i,d)
          with sync_playwright() as p:
            b=p.chromium.launch()
            for rel in ['/membership-enroll/','/es/']:
              c=b.new_context(viewport={'width':390,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));resp=page.goto(origin+rel,wait_until='networkidle');ok(rel+' 200',resp.status==200);ok(rel+' no errors',not errs,' | '.join(errs));ok(rel+' h1',page.locator('main h1').count()==1);c.close()
            c=b.new_context(viewport={'width':390,'height':900});page=c.new_page();page.goto(origin+'/assistant/',wait_until='networkidle');inp=page.locator('[data-navigator-input]');inp.fill('911 immediate danger');page.locator('form.navigator-form button[type=submit]').click();page.wait_for_timeout(180);ok('assistant urgent 911','911' in page.locator('[data-navigator-output]').inner_text());c.close();b.close()
          out={'schemaVersion':'franklin.hf26.dynamic-smoke.v2','pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'financialMutations':0,'results':rows};Path('candidate/evidence/HF26_FOCUSED_DYNAMIC_SMOKE.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps({'pass':out['pass'],'fail':out['fail']}))
          PY
      - name: Fresh parent check and prepare exact direct child
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request,os,subprocess,base64
          repo='neutralboardroom/franklin-navigator';base='01aecafbfe16202d9d5a80eb6b97443c9ee305ad';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8';root=Path('candidate')
          def api(p):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'});return json.load(urllib.request.urlopen(req,timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base,'main advanced';assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime,'runtime advanced'
          scope=json.loads((root/'evidence/HF26_LANGUAGE_PATCH_SCOPE.json').read_text());names=sorted(scope['changedFiles'])+['evidence/HF26_LANGUAGE_PATCH_SCOPE.json','evidence/HF26_LANGUAGE_ZERO_AUDIT.json','evidence/HF26_BOUND_EXTERNAL_EVIDENCE.json','evidence/HF26_NO_LOSS_BINDING.json','evidence/HF26_RUNTIME_TESTS.tap','evidence/HF26_STATIC_INTEGRITY.json','evidence/HF26_BROWSER_FINAL.json','evidence/HF26_FOCUSED_DYNAMIC_SMOKE.json']
          meta={'release':'FR-NAV1.15.0-HF2.6-CANDIDATE','component':'public','parent':base,'runtimePair':runtime,'scope':'FULL_PUBLIC_LANGUAGE_REFINEMENT','changedFiles':len(scope['changedFiles']),'profileCount':19103,'profileFactsChanged':False,'pricesChanged':False,'runtimeChanged':False,'checkoutRemainsOpen':True,'qualificationRunId':int(os.environ['GITHUB_RUN_ID']),'languageAuditRunId':34217056903,'overflowComparisonRunId':34216103881,'authorityTransfer':False};(root/'PRODUCTION_RELEASE.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n');names.append('PRODUCTION_RELEASE.json')
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf26-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);staged=git('diff','--cached','--name-only').splitlines();assert set(staged)==set(names),(set(staged)-set(names),set(names)-set(staged));git('commit','-m','Refine public language across every Franklin page in English and Spanish; preserve facts, safety and live checkout [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env)
          out={'preparedCommit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base,'runtimePair':runtime,'branch':branch,'changedFiles':len(scope['changedFiles']),'profileCount':19103,'profileFactsChanged':False,'checkoutRemainsOpen':True,'financialMutations':0};(root/'evidence/HF26_PREPARED.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf26-final-qualification-v7
          path: candidate/evidence/
          retention-days: 14
          if-no-files-found: error
