name: HF26 full public-language qualification
on:
  push:
    branches: [local-franklin-hf26-public-language-20260908]
    paths: [.github/hf26/public_language_patch.py, .github/workflows/hf26-language-qualification.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 01aecafbfe16202d9d5a80eb6b97443c9ee305ad
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Apply bounded public-language patch
        run: |
          set -euo pipefail
          cp transport/.github/hf26/public_language_patch.py .
          python public_language_patch.py | tee candidate/evidence/HF26_PATCH_OUTPUT.log
      - name: Protect profile facts, pricing, checkout and runtime lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request
          base=Path('transport-base-does-not-exist')
          cand=Path('candidate')
          # Public structured profile data is the canonical projection consumed by pages; language work must not alter it.
          protected=[]
          for p in sorted((cand/'dist/data').glob('franklin-profiles*')):
            if p.is_file():protected.append(p)
          for p in sorted((cand/'dist/data/profiles').rglob('*')) if (cand/'dist/data/profiles').exists() else []:
            if p.is_file():protected.append(p)
          # Compare against exact base by git object identity instead of trusting working-copy history.
          import subprocess
          for p in protected:
            rel=p.relative_to(cand).as_posix()
            current=hashlib.sha256(p.read_bytes()).hexdigest()
            original=subprocess.check_output(['git','-C','candidate','show','01aecafbfe16202d9d5a80eb6b97443c9ee305ad:'+rel],stderr=subprocess.DEVNULL)
            assert current==hashlib.sha256(original).hexdigest(),rel
          profiles=list((cand/'dist/profiles').rglob('index.html'));assert len(profiles)==19103,len(profiles)
          # Runtime source is independently checked out and untouched.
          assert subprocess.check_output(['git','-C','runtime','rev-parse','HEAD'],text=True).strip()=='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8'
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Franklin-HF26-language/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          ready=get('https://franklin-navigator-membership.onrender.com/ready');cat=get('https://franklin-navigator-membership.onrender.com/api/catalog')
          assert ready['database'] and ready['commerceEnabled'] and ready['liveCheckoutEnabled'] and ready['stripeCheckoutSessionConfigured'] and ready['stripeWebhookConfigured'] and ready['portalSessionConfigured'] and ready['startupError'] is None
          assert cat['publicCheckoutOpen'] and [x['priceUsd'] for x in cat['choices']]==[5,50,120]
          print(json.dumps({'profiles':len(profiles),'profileDataProtected':len(protected),'runtime':'unchanged','checkout':'OPEN','prices':[5,50,120]}))
          PY
      - name: Syntax-check every changed public JavaScript file
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/hf26_changed_js.txt
          import json
          d=json.load(open('candidate/evidence/HF26_LANGUAGE_PATCH_SCOPE.json'))
          for p in d['changedFiles']:
            if p.endswith('.js'):print('candidate/'+p)
          PY
          while IFS= read -r f; do node --check "$f"; done < /tmp/hf26_changed_js.txt
      - name: Full-site language quality scanner
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from collections import Counter,defaultdict
          import json,re,html
          root=Path('candidate/dist');records=[];issues=[]
          hidden={'script','style','noscript','template','svg','path','meta','link'}
          attrs={'title','aria-label','placeholder','alt'}
          class P(HTMLParser):
            def __init__(self,path):super().__init__(convert_charrefs=True);self.path=path;self.stack=[];self.skip=0
            def handle_starttag(self,tag,a):
              self.stack.append(tag)
              if tag in hidden:self.skip+=1
              d=dict(a)
              if tag=='meta' and d.get('name')=='description' and d.get('content'):
                records.append((self.path,'meta',d['content'].strip()))
              if not self.skip:
                for k in attrs:
                  v=d.get(k)
                  if v and re.search(r'[A-Za-zÁ-ÿ]',v):records.append((self.path,k,re.sub(r'\s+',' ',v).strip()))
            def handle_endtag(self,tag):
              if tag in hidden and self.skip:self.skip-=1
              if self.stack:self.stack.pop()
            def handle_data(self,data):
              if not self.skip:
                t=re.sub(r'\s+',' ',data).strip()
                if t and re.search(r'[A-Za-zÁ-ÿ]',t):records.append((self.path,self.stack[-1] if self.stack else 'text',t))
          htmls=sorted(root.rglob('*.html'))
          for p in htmls:
            rel=p.relative_to(root).as_posix();q=P(rel);q.feed(p.read_text(errors='ignore'))
          # Exact phrases that should never remain visible after the language pass.
          banned=[
            'Ask Navigator','Your everyday operating system','public-source evidence','public-source facts','source-backed facts',
            'directory projection','Profile representation review','representation review','Growth Desk entitlement','learning-provider schema',
            'The user indicated','material claim','next-best actions','first-value path','first-value plan','responsible starting points',
            'paid membership is not open today','membership paid is not open today','evidence window','reach the responsible official source',
            'Preview bilingual member growth tools','future active paid subscribed locations','Claim / manage this profile',
            'Profile verified. You can continue when checkout is available.'
          ]
          for path,kind,text in records:
            low=text.casefold()
            for b in banned:
              if b.casefold() in low:issues.append({'type':'BANNED_PHRASE','file':path,'kind':kind,'phrase':b,'text':text})
          # Public-facing internal language patterns. Source names like Profile Factory are never expected in public pages.
          internal=re.compile(r'\b(?:ADMIN_TOKEN|lookup key|lookupKey|entitlement key|canonical profile id|runtime service|schema version|webhook event|reconciliation control|deployment receipt|source state|authority state|SCC|SRE|Profile Factory|Local Investigator)\b',re.I)
          for path,kind,text in records:
            if internal.search(text):issues.append({'type':'INTERNAL_LANGUAGE','file':path,'kind':kind,'text':text})
          # Metadata should be concise enough for search/display surfaces. Record >180 as defect, not merely advisory.
          metas=[(p,t) for p,k,t in records if k=='meta']
          for p,t in metas:
            if len(t)>180:issues.append({'type':'META_TOO_LONG','file':p,'chars':len(t),'text':t})
          # UI labels should not shout. Allow meaningful acronyms, event names, and emergency 911/988.
          allowed={'FAQ','IRS','USDA','FEMA','ADA','TDEC','TDOT','NPI','HIPAA','YMCA','TN','USA','COVID','CPR','GED','ESL','DMV','TBI','DCS','TDHS','SNAP','WIC','VA'}
          for p,k,t in records:
            words=re.findall(r'\b[A-Z][A-Z/&-]{3,}\b',t)
            bad=[w for w in words if w not in allowed and not re.fullmatch(r'\d+',w)]
            if bad and len(t)<160:issues.append({'type':'ALL_CAPS_UI','file':p,'words':bad,'text':t})
          # Spanish voice: formal usted. Flag common informal second-person forms on Spanish pages.
          informal=re.compile(r'\b(?:tú|tu|tus|elige|selecciona|confirma|revisa|usa|utiliza|abre|busca|filtra|compara|guarda|escribe|introduce|ingresa|haz|mantén|verifica|consulta|inténtalo|evita|solicita|crea|prepara|organiza|encuentra|explora|lee|marca|copia|descarga|añade|adjunta|elimina|reinicia)\b',re.I)
          for p,k,t in records:
            if p.startswith('es/') and informal.search(t):issues.append({'type':'SPANISH_VOICE_MIX','file':p,'text':t,'matches':informal.findall(t)})
          # Check Spanish translation catalog too, because dynamic UI may not appear in static HTML.
          cat=json.loads((root/'data/r37-es-public-strings.json').read_text())['translations']
          for en,es in cat.items():
            if informal.search(es):issues.append({'type':'SPANISH_CATALOG_VOICE_MIX','key':en,'text':es,'matches':informal.findall(es)})
            for b in banned:
              if b.casefold() in es.casefold():issues.append({'type':'BANNED_SPANISH_CATALOG','key':en,'phrase':b,'text':es})
          # Duplicate site title must be gone.
          for p in [root/'index.html',root/'es/index.html']:
            assert 'Franklin Navigator | Franklin Navigator' not in p.read_text()
          summary={'schemaVersion':'franklin.hf26.language-quality.v1','htmlPages':len(htmls),'profilePages':sum(1 for p in htmls if p.relative_to(root).as_posix().startswith('profiles/')),'visibleRecords':len(records),'metaDescriptions':len(metas),'issues':len(issues),'issueCounts':dict(Counter(x['type'] for x in issues))}
          Path('candidate/evidence/HF26_LANGUAGE_QUALITY.json').write_text(json.dumps({'summary':summary,'issues':issues[:3000]},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(summary))
          if issues:
            print(json.dumps(issues[:80],ensure_ascii=False,indent=2))
            raise SystemExit('language quality defects remain: '+str(len(issues)))
          PY
      - name: Run full static site integrity and unchanged runtime tests
        run: |
          set -euo pipefail
          if [ -f candidate/scripts/validate.js ]; then node candidate/scripts/validate.js; fi
          if [ -f candidate/validate-release.js ]; then node candidate/validate-release.js; fi
          cd runtime
          npm ci --ignore-scripts --no-audit --no-fund
          node --test | tee ../candidate/evidence/HF26_RUNTIME_TESTS.tap
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser every non-profile page, English/Spanish and sampled profiles
        run: |
          set -euo pipefail
          python -m http.server 8878 --bind 127.0.0.1 --directory candidate/dist >/tmp/hf26-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,hashlib,re
          root=Path('candidate/dist');origin='http://127.0.0.1:8878';rows=[]
          pages=sorted(p.relative_to(root).as_posix() for p in root.rglob('index.html') if not p.relative_to(root).as_posix().startswith('profiles/'))
          profiles=sorted(p.relative_to(root).as_posix() for p in (root/'profiles').rglob('index.html'))
          # Deterministic broad profile sample across the whole sorted corpus.
          if profiles:
            step=max(1,len(profiles)//80);sample=profiles[::step][:80]
          else:sample=[]
          test_pages=pages+sample
          def route(path):
            return '/'+(path[:-10] if path.endswith('index.html') else path)
          with sync_playwright() as p:
            b=p.chromium.launch()
            for rel in test_pages:
              c=b.new_context(viewport={'width':390,'height':900});page=c.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              resp=page.goto(origin+route(rel),wait_until='domcontentloaded');page.wait_for_timeout(50)
              body=page.locator('body').inner_text()
              rows.append({'file':rel,'status':resp.status if resp else None,'h1':page.locator('main h1').count(),'pageErrors':errors,'overflow':page.evaluate('document.documentElement.scrollWidth>document.documentElement.clientWidth+2'),'lang':page.locator('html').get_attribute('lang'),'textChars':len(body)})
              c.close()
            # Desktop scan every non-profile page for nav/footer readability and overflow.
            for rel in pages:
              c=b.new_context(viewport={'width':1280,'height':900});page=c.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)));resp=page.goto(origin+route(rel),wait_until='domcontentloaded');page.wait_for_timeout(25)
              rows.append({'file':rel,'viewport':'desktop','status':resp.status if resp else None,'h1':page.locator('main h1').count(),'pageErrors':errors,'overflow':page.evaluate('document.documentElement.scrollWidth>document.documentElement.clientWidth+2'),'lang':page.locator('html').get_attribute('lang')});c.close()
            b.close()
          failures=[r for r in rows if r.get('status')!=200 or r.get('h1')!=1 or r.get('pageErrors') or r.get('overflow')]
          report={'schemaVersion':'franklin.hf26.browser-all-public.v1','nonProfilePages':len(pages),'profileSample':len(sample),'assertedViews':len(rows),'failures':len(failures),'results':rows,'financialMutations':0};Path('candidate/evidence/HF26_BROWSER_ALL_PUBLIC.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps({k:report[k] for k in ['nonProfilePages','profileSample','assertedViews','failures']}));assert not failures,failures[:10]
          PY
      - name: Preserve Assistant and live membership behavior
        run: |
          set -euo pipefail
          # Static preservation of key safety/payment semantics.
          grep -q 'MEMBERSHIP_ALREADY_ACTIVE' candidate/dist/assets/membership-live.js
          grep -q 'CHECKOUT_PENDING_MESSAGE' candidate/dist/assets/membership-live.js
          grep -q 'checkout.stripe.com' candidate/dist/assets/membership-live.js
          grep -q 'tel:911' candidate/dist/assets/r38-assistant-followthrough.js
          python - <<'PY'
          import urllib.request,json
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Franklin-HF26-preserve/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          r=get('https://franklin-navigator-membership.onrender.com/ready');c=get('https://franklin-navigator-membership.onrender.com/api/catalog')
          assert r['commerceEnabled'] and r['liveCheckoutEnabled'] and r['database'] and r['startupError'] is None
          assert c['publicCheckoutOpen'] and [x['priceUsd'] for x in c['choices']]==[5,50,120]
          print('LIVE_COMMERCE_PRESERVED')
          PY
      - name: Fresh parent check and prepare direct child only
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request,os,subprocess,base64,hashlib
          repo='neutralboardroom/franklin-navigator';base='01aecafbfe16202d9d5a80eb6b97443c9ee305ad';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8';root=Path('candidate')
          def api(p):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'});return json.load(urllib.request.urlopen(req,timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base,'main advanced; requalify'
          assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime,'runtime advanced; requalify'
          scope=json.loads((root/'evidence/HF26_LANGUAGE_PATCH_SCOPE.json').read_text());names=sorted(scope['changedFiles'])+['evidence/HF26_LANGUAGE_PATCH_SCOPE.json','evidence/HF26_LANGUAGE_QUALITY.json','evidence/HF26_RUNTIME_TESTS.tap','evidence/HF26_BROWSER_ALL_PUBLIC.json']
          # Release metadata for this candidate; no production promotion here.
          meta={'release':'FR-NAV1.15.0-HF2.6-CANDIDATE','component':'public','parent':base,'runtimePair':runtime,'scope':'PUBLIC_LANGUAGE_ONLY','changedFiles':len(scope['changedFiles']),'profileCount':19103,'profileFactsChanged':False,'pricesChanged':False,'commerceOpenedByBuild':False,'checkoutRemainsOpen':True,'qualificationRunId':int(os.environ['GITHUB_RUN_ID']),'authorityTransfer':False}
          (root/'PRODUCTION_RELEASE.json').write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n');names.append('PRODUCTION_RELEASE.json')
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf26-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);staged=git('diff','--cached','--name-only').splitlines();assert set(staged)==set(names),(set(staged)-set(names),set(names)-set(staged));git('commit','-m','Refine public language across every Franklin page in English and Spanish; preserve facts and live commerce [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env)
          out={'preparedCommit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base,'runtimePair':runtime,'branch':branch,'changedFiles':len(scope['changedFiles']),'profileCount':19103,'profileFactsChanged':False,'checkoutRemainsOpen':True,'financialMutations':0};(root/'evidence/HF26_PREPARED.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf26-public-language-qualification
          path: candidate/evidence/
          retention-days: 14
          if-no-files-found: error
