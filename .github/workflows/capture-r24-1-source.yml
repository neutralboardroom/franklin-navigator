name: Capture Franklin R24.1 production source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-r24-1-source.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind exact live predecessor
        shell: bash
        run: |
          set -euo pipefail
          LIVE='f64de3e133bba0ad5902d33e3e4e6039e9a6344c'
          git checkout --detach "$LIVE"
          test -f dist/index.html
          test -f dist/FRANKLIN_BUILD_MANIFEST.json
          test -f PRODUCTION_RELEASE.json
          node - <<'NODE'
          const fs=require('fs');
          const id=JSON.parse(fs.readFileSync('dist/release-identity.json','utf8'));
          if(id.release!=='FR-NAV0.9.1-CANDIDATE-R24.1'||id.profileCount!==19103) throw new Error('unexpected live predecessor identity');
          NODE
      - name: Package exact source carrier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture
          tar -czf capture/franklin-r24-1-live-source.tar.gz dist PRODUCTION_RELEASE.json README.md render.yaml
          sha256sum capture/franklin-r24-1-live-source.tar.gz > capture/franklin-r24-1-live-source.tar.gz.sha256
          printf '%s\n' 'f64de3e133bba0ad5902d33e3e4e6039e9a6344c' > capture/LIVE_GITHUB_COMMIT.txt
          printf '%s\n' '5434a6aa99ecfcf4f42fa6ce476a43028515a3d3' > capture/LIVE_GITHUB_TREE.txt
          printf '%s\n' 'dep-daabfppf2nfc739qdbog' > capture/LIVE_RENDER_DEPLOY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: franklin-r24-1-live-source
          path: capture/
          retention-days: 7
          compression-level: 0
