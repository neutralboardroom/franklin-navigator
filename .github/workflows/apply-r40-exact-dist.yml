name: Apply exact Franklin R40 static payload

on:
  push:
    branches: [main]
    paths:
      - 'deploy/R40_GITHUB_DEPLOYMENT_PAYLOAD.zip'

permissions:
  contents: write

concurrency:
  group: franklin-r40-exact-dist
  cancel-in-progress: false

jobs:
  apply-r40:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact sealed R40 payload
        run: python deploy/apply_r40_deployment_payload.py
      - name: Confirm exact public release identity and closed checkout
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('dist')
          manifest = json.loads((root/'FRANKLIN_BUILD_MANIFEST.json').read_text())
          assert manifest['release'] == 'FR-NAV1.15.0-CANDIDATE-R40'
          assert manifest['commerce']['publicCheckoutOpen'] is False
          files = [p for p in root.rglob('*') if p.is_file()]
          assert len(files) == 19481, len(files)
          styles = (root/'assets'/'styles.css').read_text()
          explorer = (root/'assets'/'community-explorer.css').read_text()
          r37 = (root/'assets'/'r37.css').read_text()
          assert 'color-scheme:only light!important' in styles
          assert '.explorer-shortlist{position:static!important' in explorer
          assert '.r37-language-switch span{display:none!important}' in r37
          print('R40_EXACT_DIST_READY', len(files))
          PY
      - name: Commit exact R40 dist to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A dist
          if git diff --cached --quiet; then
            echo 'R40 dist already exact; no commit required.'
          else
            git commit -m 'Publish exact Franklin R40 static dist [skip ci]'
            git push origin HEAD:main
          fi
