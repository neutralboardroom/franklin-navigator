name: R1360 profile quality qualification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'runtime/franklin-membership/**'
      - 'PRODUCTION_RELEASE.json'
      - 'R1360_QUALIFICATION_RECEIPT.json'
      - 'R1360_GENERATOR_RESULT.json'
      - 'r1360-input/PF1538_CONSUMER_AUTHORITY.json'
      - 'scripts/r1360-profile-quality-build.py'
      - 'tests/r1352-claim-review-path.cjs'
      - 'tests/r1358-profile-claim-management-depth.cjs'
      - 'tests/r1346-claim-path-outreach-readiness.cjs'
      - 'tests/r1342-claim-recovery.cjs'
      - '.github/workflows/r1360-profile-quality.yml'
permissions:
  contents: read
concurrency:
  group: r1360-profile-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify-r1360:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact PF15.38 authority and public projection
        run: |
          python - <<'PY'
          import json,re,glob,pathlib
          receipt=json.load(open('R1360_QUALIFICATION_RECEIPT.json'))
          result=json.load(open('R1360_GENERATOR_RESULT.json'))
          authority=json.load(open('r1360-input/PF1538_CONSUMER_AUTHORITY.json'))
          aliases=json.load(open('dist/data/profile-aliases-r1360.json'))
          assert receipt['release']=='FR-NAV1.30.60-HF3.13.42'
          assert receipt['profileFactory']['version']=='FR-PF-PLATFORM-15.38'
          assert receipt['profileFactory']['artifactSha256']=='e90cc02dfe026ea64d287eef59c12a067bfa9e55a3879e282fd7a50a30afd89b'
          assert receipt['profileFactory']['semantics']=='FULL_REPLACE_NOT_APPEND'
          assert receipt['profileFactory']['aliasCount']==100
          assert receipt['profileFactory']['reviewHeld']==0
          assert receipt['profileFactory']['suppressedGeneric']==1
          assert receipt['publicProjection']['canonicalPublicProfiles']==19002
          assert receipt['publicProjection']['protectedLocalOverlayProfiles']==1
          assert receipt['publicProjection']['unsafePublicDisplayHitsAfter']==0
          assert result['profileFactory']=='FR-PF-PLATFORM-15.38'
          assert result['aliases']==100 and result['reviewHeld']==0
          assert result['suppressedGenericProfiles']==1
          assert aliases['profileFactoryVersion']=='FR-PF-PLATFORM-15.38'
          assert len(aliases['aliases'])==100
          assert aliases.get('reviewHeldProfileIds',[])==[]
          assert aliases.get('suppressedGenericProfileIds')==['FR-ORG-a0776afee5ec-firstbank']
          assert authority['profileFactoryVersion']=='FR-PF-PLATFORM-15.38'
          unsafe=re.compile(r'(source coordinate|street address not asserted|exact coordinates retained|public irs filing address geocoded|assigned community|current named member/resource|\bPF\d+\b)',re.I)
          hits=[]
          for p in glob.glob('dist/profiles/*/index.html'):
            if unsafe.search(pathlib.Path(p).read_text(errors='ignore')): hits.append(p)
          assert not hits,hits[:10]
          print('PF15.38 authority/public projection PASS')
          PY
      - name: Focused R1360 claim and alias qualification
        run: |
          node tests/r1352-claim-review-path.cjs
          node tests/r1358-profile-claim-management-depth.cjs
          node tests/r1346-claim-path-outreach-readiness.cjs
          node tests/r1342-claim-recovery.cjs
          node runtime/franklin-membership/test-r1360-alias-firewall.js
          node --check dist/assets/membership-live.js
          node --check dist/assets/hf36.js
          node --check runtime/franklin-membership/server.js
      - name: Qualification is read-only
        run: |
          test -z "$(git status --porcelain)"
