name: Franklin HF3.4 build and qualify
on:
  push:
    branches: [fr-nav1-23-0-hf34-full-audit-simplification-20260911]
    paths:
      - 'scripts/hf34-build.py'
      - 'scripts/hf34-builder-preflight.py'
      - 'scripts/hf34-postbuild.py'
      - 'scripts/hf34-verify.py'
      - 'scripts/hf34-browser.py'
      - '.github/workflows/hf34-build-qualify.yml'
permissions:
  contents: write
jobs:
  build-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fr-nav1-23-0-hf34-full-audit-simplification-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and browser dependencies
        run: |
          pip install beautifulsoup4==4.13.4 playwright==1.55.0
          python -m playwright install chromium
      - name: Builder preflight
        run: |
          python scripts/hf34-builder-preflight.py
          python -m py_compile scripts/hf34-build.py scripts/hf34-postbuild.py scripts/hf34-verify.py scripts/hf34-browser.py
      - name: Build audited static release
        run: |
          python scripts/hf34-build.py
          python scripts/hf34-postbuild.py
      - name: Static qualification
        run: python scripts/hf34-verify.py
      - name: Representative browser qualification
        run: |
          python -m http.server 8765 --directory dist > /tmp/hf34-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python scripts/hf34-browser.py
      - name: Persist qualified candidate
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist scripts/hf34-build.py scripts/hf34-postbuild.py HF34_BUILD_RECEIPT.json HF34_QUALIFICATION_REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'FR-NAV1.23.0 HF3.4 qualified full-audit simplification [skip ci]'
          git push origin HEAD:fr-nav1-23-0-hf34-full-audit-simplification-20260911
