name: HF31 Spanish public-language audit
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - .github/workflows/hf31-spanish-audit.yml
      - scripts/audit-hf31-spanish.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan every static Spanish public page
        run: python3 scripts/audit-hf31-spanish.py
      - name: Persist exact candidate report
        run: |
          test -s evidence/hf31/SPANISH_LANGUAGE_AUDIT_CANDIDATES.json
          git config user.name 'neutralboardroom'
          git config user.email 'reachrgnow@gmail.com'
          git add evidence/hf31/SPANISH_LANGUAGE_AUDIT_CANDIDATES.json
          if git diff --cached --quiet; then
            echo 'Spanish audit report unchanged'
          else
            git commit -m 'Record HF3.1 all-page Spanish language audit candidates [skip ci]'
            git push origin HEAD:hf31-profile-currentness-polish-20260910
          fi
