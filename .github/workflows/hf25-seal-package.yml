      - name: Add one-command package validator
        run: |
          cat > stage/VALIDATE_RELEASE.py <<'PY'
          from pathlib import Path
          import json,hashlib,re,sys
          root=Path(sys.argv[1] if len(sys.argv)>1 else '.').resolve();manifest=json.loads((root/'CONTENT_MANIFEST.json').read_text());entries=manifest['members'];expected=set(entries);actual=set()
          for p in root.rglob('*'):
            if p.is_symlink():raise SystemExit('symlink:'+str(p))
            if p.is_file():
              rel=p.relative_to(root).as_posix()
              if rel=='CONTENT_MANIFEST.json':continue
              actual.add(rel)
              if rel.lower().endswith(('.zip','.tar','.tgz','.gz','.7z','.rar')):raise SystemExit('nested archive:'+rel)
          if actual!=expected:raise SystemExit('manifest set mismatch missing='+str(sorted(expected-actual)[:10])+' extra='+str(sorted(actual-expected)[:10]))
          for rel,meta in entries.items():
            b=(root/rel).read_bytes()
            if len(b)!=meta['bytes'] or hashlib.sha256(b).hexdigest()!=meta['sha256']:raise SystemExit('hash mismatch:'+rel)
          profiles=list((root/'public/dist/profiles').rglob('index.html'))
          if len(profiles)!=19103:raise SystemExit('profile count '+str(len(profiles)))
          receipt=json.loads((root/'evidence/RELEASE_RECEIPT.json').read_text());assert receipt['publicCommit']=='01aecafbfe16202d9d5a80eb6b97443c9ee305ad';assert receipt['runtimeCommit']=='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8';assert receipt['checkoutState']=='OPEN'
          banned=['new public membership checkout is closed','new public membership checkout remains closed','new public checkout is currently closed','new public checkout remains closed','membership checkout is not open yet','membership enrollment is currently closed','membership enrollment and payment are not open yet','paid business membership is not open yet','while enrollment remains closed','before checkout is available','membership comes later','before new checkout opens:','franklin will not reopen new enrollment','profile verified. you can continue when checkout is available.']
          for p in (root/'public/dist').rglob('*.html'):
            low=p.read_text(errors='ignore').lower()
            for phrase in banned:
              if phrase in low:raise SystemExit('stale public phrase '+phrase+' in '+str(p))
          js=(root/'public/dist/assets/membership-live.js').read_text();assert "state.ready?.liveCheckoutEnabled?'Profile verified. You can continue to membership.'" in js;assert 'MEMBERSHIP_ALREADY_ACTIVE' in js and 'CHECKOUT_PENDING_MESSAGE' in js
          for p in [root/'public/dist/assets/membership-live.js',root/'runtime/server.js']:
            t=p.read_text(errors='ignore');assert not re.search(r'\bsk_live_[A-Za-z0-9]{16,}',t);assert not re.search(r'\bwhsec_[A-Za-z0-9]{16,}',t)
          print(json.dumps({'result':'PASS','members':len(entries),'profiles':len(profiles),'publicCommit':receipt['publicCommit'],'runtimeCommit':receipt['runtimeCommit'],'checkoutState':receipt['checkoutState']}))
          PY
      - name: Generate complete self-excluding content manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('stage');members={}
          for p in sorted(root.rglob('*')):
            if p.is_file() and p.name!='CONTENT_MANIFEST.json':
              b=p.read_bytes();members[p.relative_to(root).as_posix()]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          m={'schemaVersion':'franklin.release-content-manifest.v1','selfHashRule':'CONTENT_MANIFEST.json is intentionally excluded from its own member map; every other packaged file is covered.','memberCount':len(members),'members':members};(root/'CONTENT_MANIFEST.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n');print(json.dumps({'members':len(members)}))
          PY
      - name: Build two deterministic byte-identical archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json,stat
          root=Path('stage');name='FRANKLIN_NAVIGATOR__FR-NAV1.15.0-HF2.5__POST_LAUNCH_TRUTH__LIVE_VERIFIED__2026-09-08.zip'
          def build(out):
            with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                rel=p.relative_to(root).as_posix();info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=(0o100644 & 0xFFFF)<<16;info.create_system=3;z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          build('build1.zip');build('build2.zip');a=Path('build1.zip').read_bytes();b=Path('build2.zip').read_bytes();assert a==b,'archives not byte-identical';Path(name).write_bytes(a);att={'schemaVersion':'franklin.hf25.external-release-attestation.v1','artifact':name,'bytes':len(a),'sha256':hashlib.sha256(a).hexdigest(),'deterministicDoubleBuild':True,'build1Sha256':hashlib.sha256(a).hexdigest(),'build2Sha256':hashlib.sha256(b).hexdigest()};Path('RELEASE_ATTESTATION.json').write_text(json.dumps(att,indent=2)+'\n');print(json.dumps(att))
          PY
