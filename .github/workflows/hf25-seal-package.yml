          root=Path('fresh');paths=json.loads((root/'evidence/HF25_CHANGED_HTML.json').read_text())['paths'];banned=['new public membership checkout is closed','new public membership checkout remains closed','new public checkout is currently closed','new public checkout remains closed','membership checkout is not open yet','membership enrollment is currently closed','membership enrollment and payment are not open yet','paid business membership is not open yet','while enrollment remains closed','before checkout is available','membership comes later','before new checkout opens:','franklin will not reopen new enrollment'];rows=[]
