          (stage/'evidence/TEST_SUMMARY.json').write_text(json.dumps(tests,indent=2)+'\n')
          release={'schemaVersion':'franklin.local.release-receipt.v1','status':'QUALIFIED_SUCCESSOR','release':'FR-NAV1.15.0-HF2.5','builderRole':'LOCAL_COMMUNITY_PLATFORM','activeEdition':'FRANKLIN_TN','writableLane':'LOCAL_COMMUNITY_EDITION:FRANKLIN_TN','ownerCommandRevision':'2026-09-03-R2','publicCommit':public,'publicTree':subprocess.check_output(['git','-C','source-public','rev-parse','HEAD^{tree}'],text=True).strip(),'runtimeCommit':runtime,'runtimeTree':subprocess.check_output(['git','-C','source-runtime','rev-parse','HEAD^{tree}'],text=True).strip(),'publicDeploy':'dep-dafsgtvqj5pc7387j6v0','runtimeDeploy':'dep-dafq07on74is73b4sp00','deploymentState':'LIVE_VERIFIED','checkoutState':'OPEN','pricesUsd':[5,50,120],'profileCount':19103,'profileFactsChanged':False,'changedOutcome':['Corrected stale pre-launch membership/checkout copy across public English and Spanish surfaces','Updated current paid-member capability descriptions without claiming planned features operational','Corrected verified-profile dynamic enrollment message to reflect open checkout while preserving closed rollback behavior','Preserved open commerce, verified-profile gate, idempotency, no-second-charge, billing/cancellation, Assistant, reviewer tools and free corrections'],'upstream':{'profileFactory':'DEFER_WITH_CAUSE','localInvestigatorV25':'DEFER_WITH_CAUSE','smarterJusticeDonor':'NOT_USED'},'knownLimitation':'No fabricated eligible non-member was created solely to generate a live Checkout Session; first genuine eligible user remains external-trigger evidence.','sccAcceptanceOfThisSuccessor':'NOT_YET_CLAIMED','authorityTransfer':False,'generatedAtUtc':now}
          (stage/'evidence/RELEASE_RECEIPT.json').write_text(json.dumps(release,indent=2)+'\n')
          # Record changed HTML set used by fresh extraction browser qualification.
          changed=subprocess.check_output(['git','-C','source-public','diff','--name-only','9e8195d9c3939f791795ab38add326402b5d55c8..'+public],text=True).splitlines()
          html=sorted(x[5:] for x in changed if x.startswith('dist/') and x.endswith('.html'))
