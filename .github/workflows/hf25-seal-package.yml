                c=browser.new_context(viewport={'width':width,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));r=page.goto('http://127.0.0.1:8878'+route,wait_until='networkidle');body=page.locator('body').inner_text();low=body.lower();ok(rel+':'+str(width)+':http',r is not None and r.status==200);ok(rel+':'+str(width)+':h1',page.locator('main h1').count()==1);ok(rel+':'+str(width)+':stale',not any(x in low for x in banned));ok(rel+':'+str(width)+':overflow',page.evaluate('document.documentElement.scrollWidth<=document.documentElement.clientWidth+2'));ok(rel+':'+str(width)+':js',not errs,' | '.join(errs[:3]));
                if page.locator('[data-r37-lang="es"]').count():page.locator('[data-r37-lang="es"]').click();page.wait_for_timeout(180);ok(rel+':'+str(width)+':es',page.locator('html').get_attribute('lang')=='es')
                c.close()
