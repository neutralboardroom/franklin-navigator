          (stage/'evidence/NEXT_VERSION_IMPROVEMENT_LIST.json').write_text(json.dumps(nextlist,indent=2)+'\n')
          history={'schemaVersion':'franklin.hf25.failure-history.v1','keptAsEvidence':True,'attempts':[{'class':'SOURCE_ASSERTION','disposition':'FIXED_AND_RERUN','detail':'Exact stale-copy variants and translation gaps discovered by strict underflow/global gates; gates were not weakened.'},{'class':'LIVE_EVIDENCE_HARNESS','disposition':'FIXED_AND_RERUN','detail':'Initial live continuity workflow passed product assertions then failed evidence write because Path import was missing.'},{'class':'DYNAMIC_PREPARED_RECEIPT_PATH','disposition':'NON_PRODUCT_HARNESS_FAILURE_AFTER_COMMIT_PUSH','detail':'Dynamic open/closed EN/ES browser assertions passed 16/16 and prepared direct-child commit was pushed; receipt write used wrong path after push.'}]}
          (stage/'evidence/HISTORICAL_FAILED_ASSERTIONS_RECEIPT.json').write_text(json.dumps(history,indent=2)+'\n')
