            dist=root/'public/dist';man=json.loads((dist/'data/franklin-profiles-manifest.json').read_text());chunk=json.loads((dist/man['chunks'][0]['file'].lstrip('/')).read_text());pid=chunk['records'][0]['i']
            for open_state in [True,False]:
              c=browser.new_context(viewport={'width':390,'height':900});page=c.new_page();page.route('https://franklin-navigator-membership.onrender.com/ready',lambda route:route.fulfill(status=200,content_type='application/json',body=json.dumps({'ok':True,'liveCheckoutEnabled':open_state})));page.route('https://franklin-navigator-membership.onrender.com/api/accounts/me',lambda route:route.fulfill(status=200,content_type='application/json',body=json.dumps({'ok':True,'account':{'email':'fixture@example.invalid'},'profileLinks':[{'profile_id':pid,'authority_state':'VERIFIED'}],'membership':None})));page.goto('http://127.0.0.1:8878/membership-enroll/',wait_until='networkidle');page.wait_for_timeout(700);body=page.locator('body').inner_text();ok('dynamic-'+str(open_state),'Profile verified. You can continue to membership.' in body if open_state else 'Profile verified. Checkout is not open.' in body);c.close()
            browser.close()
