          copytree('source-public',stage/'public');copytree('source-runtime',stage/'runtime')
          shutil.copy2('PRE_SEAL_CURRENTNESS_RECEIPT.json',stage/'evidence/PRE_SEAL_CURRENTNESS_RECEIPT.json')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat();public='01aecafbfe16202d9d5a80eb6b97443c9ee305ad';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8'
          role={'schemaVersion':'franklin.hf25.role-scope-authority-no-drift.v1','atUtc':now,'stableRoleId':'LOCAL_COMMUNITY_PLATFORM','activeEdition':'FRANKLIN_TN','writableProductLane':'LOCAL_COMMUNITY_EDITION:FRANKLIN_TN','authorityTransfer':False,'localOwns':['public product','UI/copy','accounts','member/payment/entitlement implementation','runtime','deployment','rollback'],'doesNotOriginate':['Profile Factory canonical facts','Local Investigator dynamic facts','SRE prices/offers/outreach','SCC acceptance'],'smarterJusticeDonorUsed':False}
