name: R1363 release seal build

on:
  push:
    branches: [r1363-release-seal-20261004]

permissions:
  contents: write

concurrency:
  group: r1363-release-seal-build
  cancel-in-progress: true

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build R1363 seal files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          release='FR-NAV1.30.63-HF3.13.45'
          predecessor='FR-NAV1.30.62-HF3.13.44'
          public_base='b6eabfdf4ab12c290763c949dd2711caa127ba17'
          runtime_commit='10bc9678415589335b63b86c92bd4ae6d39d7baa'
          deploy_id='dep-db0t7u2d0e5s73d3vmc0'
          p=Path('PRODUCTION_RELEASE.json')
          data=json.loads(p.read_text())
          assert data['release']==predecessor, data['release']
          data['release']=release
          data['date']='2026-10-04'
          data['base']=predecessor
          data['scope']='R1363 minimizes ordinary signed-in account, membership, checkout, and billing JSON to explicit user-facing allowlists, removing unnecessary internal authorization, provider, session, and lifecycle identifiers while preserving current claim, profile-management, membership, billing, security, and commerce behavior. Public design and profile facts are unchanged.'
          data['r1363']={'role':'LOCAL_COMMUNITY_PLATFORM','edition':'FRANKLIN_TN','predecessorRelease':predecessor,'sourceBaseCommit':public_base,'runtimeRelease':release,'runtimeMergeCommit':runtime_commit,'renderServiceId':'srv-dabgvefqj5pc739vr4h0','renderDeployId':deploy_id,'runtimeDeployState':'LIVE','qualification':{'runtimeTestsPassed':111,'runtimeTestsFailed':0,'runtimeSyntaxCheck':'PASS','startupReady':True,'releaseIdentityObserved':release,'releaseIdentityLock':True},'findingClosed':204,'materialChange':'ORDINARY_ACCOUNT_AND_PAYMENT_RESPONSE_DATA_MINIMIZATION','accountResponse':'EXPLICIT_ALLOWLIST_ONLY','membershipResponse':'EXPLICIT_ALLOWLIST_ONLY','checkoutProviderSessionIdentifiersExposed':False,'billingPortalSessionIdentifierExposed':False,'publicDesignChanged':False,'profileFactsChanged':False,'pricingChanged':False,'membershipPolicyChanged':False,'profileFactoryMutation':False,'localInvestigatorConsumed':False,'smarterJusticeDonorUsed':False,'preserved':{'freeBasicProfileManagement':True,'freeFactualCorrectionRemoval':True,'optionalCommunityMembershipAnnualUsd':35,'claimAndReviewerBoundaries':True,'serverSideBillingAndEntitlementLogic':True,'canonicalAliasNoFork':True},'liveEvidence':{'renderDeployLive':True,'runtimeListeningReady':True,'aliasCount':100,'canonicalProfileCount':19003,'incidentMonitorSelfTest':True},'authorityTransfer':False}
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          m=Path('dist/assets/franklin-site-monitor-r1308.js')
          s=m.read_text()
          old="const CURRENT_RELEASE='FR-NAV1.30.62-HF3.13.44';"
          new="const CURRENT_RELEASE='FR-NAV1.30.63-HF3.13.45';"
          assert old in s
          m.write_text(s.replace(old,new,1))
          receipt={'schemaVersion':'franklin.local.release-receipt.v1','release':release,'date':'2026-10-04','role':'LOCAL_COMMUNITY_PLATFORM','edition':'FRANKLIN_TN','predecessorRelease':predecessor,'findingClosed':204,'publicSourceBaseCommit':public_base,'runtimeBranch':'franklin-commerce-runtime-r30','runtimeCommit':runtime_commit,'renderServiceId':'srv-dabgvefqj5pc739vr4h0','renderDeployId':deploy_id,'renderDeployState':'LIVE','runtimeTests':{'passed':111,'failed':0},'runtimeSyntaxCheck':'PASS','startup':{'ready':True,'observedRelease':release},'change':{'ordinaryAccountResponse':'ALLOWLISTED','ordinaryMembershipResponse':'ALLOWLISTED','checkoutResponseProviderIdentifiers':'REMOVED_WHEN_NOT_CALLER_REQUIRED','billingPortalSessionIdentifier':'REMOVED_FROM_CLIENT_RESPONSE','publicDesignChanged':False,'profileFactsChanged':False,'pricingChanged':False,'membershipPolicyChanged':False},'authority':{'profileFacts':'UNCHANGED_PROFILE_FACTORY_AUTHORITY_PRESERVED','reviewerAuthority':'PRIVATE_SERVER_AUTHORIZATION_PRESERVED','billingAuthority':'SERVER_SIDE_PROVIDER_STATE_PRESERVED','authorityTransfer':False}}
          Path('R1363_RELEASE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          lines=[
            '# Franklin Navigator — Next Version Improvement List — after R1363','',
            "1. Continue Roger's live profile/account/claim review after R1363; number only genuinely new Local findings beginning with #205.",
            '2. Continue the response-minimization audit on other ordinary member/public endpoints, but only remove fields proven unnecessary to callers; do not weaken owner, reviewer, billing, entitlement, support, or incident-control visibility.',
            '3. Add behavioral integration coverage that proves signed-in account, active membership, checkout recovery, and billing-portal UI continue working against the minimized response shapes, including a real database-backed acceptance path where safe test fixtures exist.',
            '4. Reconcile historical HIGH client telemetry only against fresh provider/runtime evidence; do not auto-close stale signals and prioritize newly reproduced 4xx/5xx, broken-asset, latency, claim, account, or payment failures.',
            '5. Preserve R1360-R1363 canonical alias/no-fork, self-review, private-review, free-management, optional-membership, no-paid-factual-superiority, bounded-public-readiness, release-identity-lock, and response-minimization gates in every material successor.',
            '6. Keep reviewer work isolated in the dedicated private reviewer workspace and preserve fail-closed authorization boundaries.',
            '7. Consume newer Profile Factory or Local Investigator handoffs only after exact current acceptance is proven; never infer, fabricate, or self-promote profile facts.',
            '8. Continue live smoke coverage for first-time profile selection, account creation/sign-in, management verification, free correction/removal, Profile Center, optional Community Membership, payment recovery, and billing management without redesigning working pages merely for novelty.'
          ]
          Path('NEXT_VERSION_IMPROVEMENT_LIST__R1363.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit tested seal source
        shell: bash
        run: |
          python -m json.tool PRODUCTION_RELEASE.json >/dev/null
          python -m json.tool R1363_RELEASE_RECEIPT.json >/dev/null
          rm .github/workflows/r1363-release-seal-build.yml
          git config user.name "neutralboardroom"
          git config user.email "reachrgnow@gmail.com"
          git add -A
          git commit -m "R1363: seal live account response minimization release"
          git push origin HEAD:r1363-release-seal-20261004
