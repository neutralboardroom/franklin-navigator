name: R1363 account response minimization build

on:
  push:
    branches: [r1363-account-response-minimization-20261004]

permissions:
  contents: write

concurrency:
  group: r1363-account-response-minimization-build
  cancel-in-progress: true

jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply R1363 response-minimization patch
        run: |
          python - <<'PY'
          from pathlib import Path
          server=Path('server.js')
          s=server.read_text()
          old_release='FR-NAV1.30.62-HF3.13.44'
          new_release='FR-NAV1.30.63-HF3.13.45'
          assert f"const EMBEDDED_RELEASE = '{old_release}';" in s
          s=s.replace(f"const EMBEDDED_RELEASE = '{old_release}';",f"const EMBEDDED_RELEASE = '{new_release}';",1)

          old="async function membershipForAccount(accountId){const result=await query(`select m.*,e.access_state,e.growth_desk,e.rich_profile,e.local_visibility_tools from franklin_memberships m left join franklin_entitlements e using(membership_id) where m.account_id=$1 order by m.updated_at desc limit 1`,[accountId]);return result.rows[0]||null;}"
          new=old+"\nfunction publicAccount(session){if(!session)return null;return {account_id:session.account_id,email:session.email,display_name:session.display_name||null,preferred_language:session.preferred_language||'ENGLISH'};}\nfunction publicMembership(membership){if(!membership)return null;return {profile_id:membership.profile_id,lookup_key:membership.lookup_key,status:membership.status,cancel_at_period_end:Boolean(membership.cancel_at_period_end),current_period_end:membership.current_period_end||null,access_state:membership.access_state||null,growth_desk:Boolean(membership.growth_desk),rich_profile:Boolean(membership.rich_profile),local_visibility_tools:Boolean(membership.local_visibility_tools)};}"
          assert old in s
          s=s.replace(old,new,1)

          old_me="if(req.method==='GET'&&url.pathname==='/api/accounts/me'){const session=await requireSession(req);await reconcileProtectedAdminAccess(session,reqId);const links=await query(`select l.profile_id,l.authority_state,l.verified_at,r.state as review_state,r.revision as review_revision,r.created_at as review_created_at,r.updated_at as review_updated_at from franklin_profile_links l left join franklin_representation_reviews r using(account_id,profile_id) where l.account_id=$1 order by l.created_at`,[session.account_id]);const membership=await membershipForAccount(session.account_id);return sendJson(req,res,200,{ok:true,account:session,profileLinks:links.rows,membership},reqId);}"
          new_me="if(req.method==='GET'&&url.pathname==='/api/accounts/me'){const session=await requireSession(req);await reconcileProtectedAdminAccess(session,reqId);const links=await query(`select l.profile_id,l.authority_state,r.state as review_state,r.revision as review_revision,r.created_at as review_created_at,r.updated_at as review_updated_at from franklin_profile_links l left join franklin_representation_reviews r using(account_id,profile_id) where l.account_id=$1 order by l.created_at`,[session.account_id]);const membership=await membershipForAccount(session.account_id);return sendJson(req,res,200,{ok:true,account:publicAccount(session),profileLinks:links.rows,membership:publicMembership(membership)},reqId);}"
          assert old_me in s
          s=s.replace(old_me,new_me,1)

          old_start="return sendJson(req,res,200,{ok:true,...purchase,plan:{lookupKey:plan.lookupKey,priceUsd:plan.regularUsd,autoRenew:plan.autoRenew,termMonths:plan.termMonths,billingMode:plan.billingMode,stripePriceId:plan.stripePriceId}},reqId);"
          new_start="const {checkoutUrl,reused}=purchase;return sendJson(req,res,200,{ok:true,checkoutUrl,reused:Boolean(reused),plan:{lookupKey:plan.lookupKey,priceUsd:plan.regularUsd,autoRenew:plan.autoRenew,termMonths:plan.termMonths,billingMode:plan.billingMode}},reqId);"
          assert old_start in s
          s=s.replace(old_start,new_start,1)

          old_status="if(req.method==='GET'&&url.pathname==='/api/membership/status'){const session=await requireSession(req);return sendJson(req,res,200,{ok:true,membership:await membershipForAccount(session.account_id)},reqId);}"
          new_status="if(req.method==='GET'&&url.pathname==='/api/membership/status'){const session=await requireSession(req);return sendJson(req,res,200,{ok:true,membership:publicMembership(await membershipForAccount(session.account_id))},reqId);}"
          assert old_status in s
          s=s.replace(old_status,new_status,1)

          old_portal="if(req.method==='POST'&&url.pathname==='/api/billing/portal'){const session=await requireSession(req);const membership=await membershipForAccount(session.account_id);if(!membership)throw publicError('MEMBERSHIP_NOT_FOUND','No Franklin membership was found for this account.',404);const portal=await createStripeBillingPortalSession(membership.stripe_customer_id);return sendJson(req,res,200,{ok:true,url:portal.url,portalSessionId:portal.id},reqId);}"
          new_portal="if(req.method==='POST'&&url.pathname==='/api/billing/portal'){const session=await requireSession(req);const membership=await membershipForAccount(session.account_id);if(!membership)throw publicError('MEMBERSHIP_NOT_FOUND','No Franklin membership was found for this account.',404);const portal=await createStripeBillingPortalSession(membership.stripe_customer_id);return sendJson(req,res,200,{ok:true,url:portal.url},reqId);}"
          assert old_portal in s
          s=s.replace(old_portal,new_portal,1)
          server.write_text(s)

          literal_files=[
            'test/profile-claim-management.test.js',
            'test/r1354-member-recognition.test.js',
            'test/r1357-profile-review-audit.test.js'
          ]
          for name in literal_files:
            p=Path(name); t=p.read_text(); assert old_release in t; p.write_text(t.replace(old_release,new_release))

          regex_files=[
            'test/r1346-claim-path-contract.test.js',
            'test/r1358-claim-workflow-depth.test.js',
            'test/r1361-reviewer-boundary.test.js',
            'test/r1362-public-readiness-boundary.test.js'
          ]
          old_regex=r'FR-NAV1\.30\.62-HF3\.13\.44'
          new_regex=r'FR-NAV1\.30\.63-HF3\.13\.45'
          for name in regex_files:
            p=Path(name); t=p.read_text(); assert old_regex in t; t=t.replace(old_regex,new_regex)
            t=t.replace('survives the R1362 release advance','survives the R1363 release advance')
            t=t.replace('R1362 advances the runtime release without changing commerce policy','R1362 readiness boundary survives the R1363 runtime release advance without changing commerce policy')
            t=t.replace('R1362 runtime fails closed if deployment release identity drifts from embedded source','R1362 fail-closed identity guard survives the R1363 runtime release advance')
            p.write_text(t)

          Path('test/r1363-account-response-minimization.test.js').write_text(r'''\'use strict\';
          const test=require(\'node:test\');
          const assert=require(\'node:assert/strict\');
          const fs=require(\'node:fs\');
          const src=()=>fs.readFileSync(\'server.js\',\'utf8\');
          const section=(s,start,end)=>{const a=s.indexOf(start),b=s.indexOf(end,a+start.length);assert.ok(a>=0&&b>a,`${start} section missing`);return s.slice(a,b)};
          test(\'R1363 release identity advances for account response minimization\',()=>{assert.ok(src().includes("const EMBEDDED_RELEASE = \'FR-NAV1.30.63-HF3.13.45\'"));});
          test(\'ordinary account identity is allowlisted and omits verification internals\',()=>{const m=section(src(),\'function publicAccount(session)\',\'function publicMembership\');for(const key of [\'account_id:session.account_id\',\'email:session.email\',\'display_name:session.display_name\',\'preferred_language:session.preferred_language\'])assert.ok(m.includes(key),key);assert.ok(!m.includes(\'email_verified_at\'));});
          test(\'ordinary membership response is an explicit user-facing allowlist\',()=>{const m=section(src(),\'function publicMembership(membership)\',\'async function resolveEventContext\');for(const key of [\'profile_id\',\'lookup_key\',\'status\',\'cancel_at_period_end\',\'current_period_end\',\'access_state\',\'growth_desk\',\'rich_profile\',\'local_visibility_tools\'])assert.ok(m.includes(key),key);for(const secret of [\'membership_id\',\'account_id\',\'stripe_customer_id\',\'stripe_subscription_id\',\'failure_count\',\'last_event_created\',\'created_at\',\'updated_at\'])assert.ok(!m.includes(secret),secret);});
          test(\'accounts me and membership status return sanitized shapes\',()=>{const s=src(),me=section(s,"url.pathname===\'/api/accounts/me\'","url.pathname===\'/api/profile-links\'");assert.ok(me.includes(\'account:publicAccount(session)\'));assert.ok(me.includes(\'membership:publicMembership(membership)\'));assert.ok(!me.includes(\'l.verified_at\'));assert.ok(!me.includes(\'account:session\'));const status=section(s,"url.pathname===\'/api/membership/status\'","url.pathname===\'/api/billing/portal\'");assert.ok(status.includes(\'publicMembership(await membershipForAccount(session.account_id))\'));});
          test(\'checkout and billing responses do not expose provider session identifiers\',()=>{const s=src(),checkout=section(s,\'const {checkoutUrl,reused}=purchase\',"url.pathname===\'/api/membership/status\'");assert.ok(checkout.includes(\'checkoutUrl\'));for(const secret of [\'checkoutSessionId\',\'intentId\',\'stripePriceId\'])assert.ok(!checkout.includes(secret),secret);const portal=section(s,"url.pathname===\'/api/billing/portal\'","url.pathname===\'/api/onboarding\'");assert.ok(portal.includes(\'url:portal.url\'));assert.ok(!portal.includes(\'portalSessionId\'));});
          ''')
          PY
      - name: Install and test complete runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run check
      - name: Commit tested R1363 source
        run: |
          git rm .github/workflows/r1363-account-response-minimization-build.yml
          git config user.name 'neutralboardroom'
          git config user.email 'reachrgnow@gmail.com'
          git add server.js test/
          git diff --cached --check
          git commit -m 'R1363: minimize ordinary account and billing response data'
          git push origin HEAD:r1363-account-response-minimization-20261004
