name: Franklin runtime password recovery closeout
on:
  push:
    branches: [local-franklin-runtime-password-recovery-closeout-20260908]
    paths: [.github/runtime-reset/**, .github/workflows/runtime-password-recovery-closeout.yml]
permissions:
  contents: write
concurrency:
  group: franklin-runtime-password-recovery-closeout
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: franklin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d franklin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture:isolated_test_only@127.0.0.1:5432/franklin_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a9c918b656ced6386b1af604fde51d4a7e88d3b9
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Reconstruct exact bounded recovery patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib
          sha=lambda b:hashlib.sha256(b).hexdigest()
          raw=base64.b64decode(Path('transport/.github/runtime-reset/patch.b64').read_text().strip(),validate=True)
          assert sha(raw)=='d7fa57a3794e4f50bf173d887f1b98cc8d4fa4138a024b906df9d6b90891ecab'
          d=json.loads(lzma.decompress(raw));assert d['schema']=='franklin.runtime.password-recovery-closeout.v1' and d['base']=='a9c918b656ced6386b1af604fde51d4a7e88d3b9'
          root=Path('candidate').resolve()
          for n,o in d['files'].items():
            p=(root/n).resolve();assert p.is_relative_to(root)
            if 'baseSha256' in o: assert p.exists() and sha(p.read_bytes())==o['baseSha256'],n
            else: assert not p.exists(),n
            b=o['text'].encode();assert sha(b)==o['sha256'],n
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b)
          ev=root/'evidence';ev.mkdir(exist_ok=True)
          (ev/'PASSWORD_RECOVERY_SOURCE_BINDING.json').write_text(json.dumps({'base':d['base'],'patchSha256':sha(raw),'files':{n:o['sha256'] for n,o in d['files'].items()},'commerceEnabled':False,'financialMutations':0,'authorityTransfer':False},indent=2)+'\n')
          PY
      - name: Install locked runtime dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and regression tests
        working-directory: candidate
        run: |
          set -o pipefail
          npm test | tee evidence/PASSWORD_RECOVERY_UNIT_TESTS.tap
      - name: Existing reviewer/member Postgres regression
        working-directory: candidate
        run: |
          mkdir -p evidence/reviewer
          TEST_REPORT_DIR="$GITHUB_WORKSPACE/candidate/evidence/reviewer" node acceptance/reviewer-console.integration.cjs
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser password reset then reviewer sign in
        working-directory: candidate
        run: |
          set -euo pipefail
          export BROWSER_FIXTURE_PATH="$GITHUB_WORKSPACE/candidate/evidence/password-reset-fixture.json"
          node acceptance/owner-review-browser-fixture.cjs > evidence/password-reset-fixture.log 2>&1 &
          echo $! > evidence/password-reset-fixture.pid
          for i in $(seq 1 160); do test -s "$BROWSER_FIXTURE_PATH" && break; sleep .1; done
          test -s "$BROWSER_FIXTURE_PATH"
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          fixture=json.loads(Path('evidence/password-reset-fixture.json').read_text())
          origin=fixture['origin']; email=fixture['email']; code=fixture['emailCode']; old=fixture['password']; new='Synthetic_reset_password_987654321!'
          rows=[]
          def ok(i,v): rows.append({'id':i,'pass':bool(v)}); assert v,i
          with sync_playwright() as p:
            b=p.chromium.launch();c=b.new_context(viewport={'width':390,'height':900});page=c.new_page()
            page.goto(origin+'/review/',wait_until='networkidle');ok('forgot_password_link_visible',page.get_by_role('link',name='Forgot your password?').is_visible());page.get_by_role('link',name='Forgot your password?').click();page.wait_for_url('**/review/reset/')
            ok('reset_page_noindex',page.locator('meta[name=robots]').get_attribute('content')=='noindex,nofollow,noarchive')
            page.locator('#email').fill(email);page.locator('#email-code').fill(code);page.locator('#new-password').fill(new);page.locator('#confirm-password').fill(new);page.get_by_role('button',name='Reset password').click();page.locator('#status').filter(has_text='Password reset.').wait_for()
            ok('reset_success', 'Password reset.' in page.locator('#status').inner_text())
            page.get_by_role('link',name='Back to reviewer sign in').click();page.wait_for_url('**/review/')
            page.locator('#email').fill(email);page.locator('#password').fill(new);page.get_by_role('button',name='Sign in to reviews').click();page.locator('#workspace').wait_for(state='visible');ok('new_password_signin_without_code',page.locator('#workspace').is_visible())
            page.goto(origin+'/review/reset/',wait_until='networkidle');page.locator('#email').fill(email);page.locator('#email-code').fill(code);page.locator('#new-password').fill('Another_synthetic_password_12345!');page.locator('#confirm-password').fill('Another_synthetic_password_12345!');page.get_by_role('button',name='Reset password').click();page.wait_for_timeout(150);ok('one_time_code_reuse_rejected','already been used' in page.locator('#status').inner_text())
            c.close();b.close()
          Path('evidence/PASSWORD_RECOVERY_BROWSER.json').write_text(json.dumps({'result':'PASS','pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'results':rows,'realOwnerCredentialsUsed':False,'realPayments':0,'productionMutations':0},indent=2)+'\n')
          print(json.dumps(rows))
          PY
          node - <<'NODE'
          const fs=require('fs'),{Pool}=require('pg'),{verifyPassword}=require('./lib/security');
          (async()=>{const f=JSON.parse(fs.readFileSync('evidence/password-reset-fixture.json'));const p=new Pool({connectionString:f.db,ssl:false});const a=(await p.query('select password_hash,email_verified_at from franklin_accounts where account_id=$1',[f.owner])).rows[0];if(!a.email_verified_at)throw Error('EMAIL_NOT_VERIFIED');if(await verifyPassword(f.password,a.password_hash))throw Error('OLD_PASSWORD_STILL_VALID');if(!await verifyPassword('Synthetic_reset_password_987654321!',a.password_hash))throw Error('NEW_PASSWORD_NOT_VALID');const counts=(await p.query("select (select count(*) from franklin_memberships) memberships,(select count(*) from franklin_checkout_intents) checkout_intents,(select count(*) from franklin_profile_links where account_id=$1) owner_links",[f.owner])).rows[0];if(Number(counts.memberships)!==1)throw Error('FIXTURE_MEMBERSHIP_COUNT_CHANGED');if(Number(counts.checkout_intents)!==0)throw Error('CHECKOUT_INTENT_CREATED');if(Number(counts.owner_links)!==0)throw Error('OWNER_PROFILE_LINK_CREATED');await p.end();fs.writeFileSync('evidence/PASSWORD_RECOVERY_DB.json',JSON.stringify({result:'PASS',emailVerified:true,oldPasswordInvalid:true,newPasswordValid:true,checkoutIntentsCreated:0,ownerProfileLinksCreated:0,financialProviderCalls:0},null,2)+'\n')})().catch(e=>{console.error(e);process.exit(1)})
NODE
          kill $(cat evidence/password-reset-fixture.pid) || true
      - name: Prepare exact qualified runtime child commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess,os,urllib.request,base64
          root=Path('candidate');repo='neutralboardroom/franklin-navigator';base='a9c918b656ced6386b1af604fde51d4a7e88d3b9'
          req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/ref/heads/franklin-commerce-runtime-r30',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: assert json.load(r)['object']['sha']==base,'runtime branch advanced; do not overwrite'
          binding=json.loads((root/'evidence/PASSWORD_RECOVERY_SOURCE_BINDING.json').read_text());browser=json.loads((root/'evidence/PASSWORD_RECOVERY_BROWSER.json').read_text());db=json.loads((root/'evidence/PASSWORD_RECOVERY_DB.json').read_text())
          receipt={'release':'FR-NAV1.15.0-HF2.4-RUNTIME-RECOVERY-CANDIDATE','parent':base,'qualificationRun':int(os.environ['GITHUB_RUN_ID']),'browser':browser,'database':db,'changedFiles':binding['files'],'commerceOpened':False,'realFinancialMutations':0,'authorityTransfer':False}
          (root/'evidence/PASSWORD_RECOVERY_QUALIFICATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          names=list(binding['files'])+['evidence/PASSWORD_RECOVERY_QUALIFICATION.json']
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='franklin-runtime-password-recovery-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);git('commit','-m','Add secure one-time Franklin reviewer password recovery and invalidate sessions; commerce held [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env)
          print(json.dumps({'branch':branch,'commit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: franklin-runtime-password-recovery-evidence
          path: candidate/evidence/
          retention-days: 14
          if-no-files-found: error
