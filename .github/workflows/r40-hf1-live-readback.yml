name: Franklin R40 HF1 live readback, no payment actions
on:
  push:
    branches: [franklin-r40-ui-safety-continuation]
    paths: ['.github/workflows/r40-hf1-live-readback.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e0ea8625343f6ec0e2eb2f0e55ec6457ec762bf1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact deployed bytes and read-only readiness
        run: |
          python - <<'PY'
          import pathlib,json,hashlib,urllib.request,urllib.error,datetime,time,concurrent.futures
          base='https://franklinnavigator.com';runtime='https://franklin-navigator-membership.onrender.com'
          out=pathlib.Path('live-hf1-readback');out.mkdir(exist_ok=True)
          checks=[]
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Franklin-owner-read-only-launch-check','Cache-Control':'no-cache','Accept-Encoding':'identity'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read(),dict(r.headers)
              except urllib.error.HTTPError as e:return e.code,e.read(),dict(e.headers)
          for n in ['assets/app.js','assets/membership-live.js','data/r37-es-public-strings.json']:
              status,body,headers=get(base+'/'+n+'?hf1='+str(int(time.time())))
              expected=hashlib.sha256(pathlib.Path('dist',n).read_bytes()).hexdigest()
              got=hashlib.sha256(body).hexdigest()
              checks.append({'path':'/'+n,'status':status,'expectedSha256':expected,'observedSha256':got,'pass':status==200 and expected==got})
          routes=['/','/claim-profile/','/membership-enroll/','/membership-pricing/','/membership-status/','/member-support/','/member-first-value/','/profile-studio/','/terms/','/privacy/']
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              for route,(status,body,headers) in zip(routes,pool.map(lambda x:get(base+x),routes)):
                  checks.append({'path':route,'status':status,'pass':status==200})
          readiness={}
          for attempt in range(12):
              status,body,headers=get(runtime+'/ready')
              try:readiness=json.loads(body)
              except Exception:readiness={}
              if status==200 and readiness.get('checkoutSafetyVersion')=='FRANKLIN_CHECKOUT_SAFETY_1':break
              time.sleep(5)
          checks.append({'path':'runtime/ready','status':status,'pass':status==200 and readiness.get('ok') is True and readiness.get('database') is True and readiness.get('checkoutSafetyVersion')=='FRANKLIN_CHECKOUT_SAFETY_1' and readiness.get('commerceEnabled') is False and readiness.get('liveCheckoutEnabled') is False})
          status,body,headers=get(runtime+'/api/accounts/me')
          checks.append({'path':'runtime/api/accounts/me','status':status,'pass':status==401})
          result={'observedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'staticCommit':'e0ea8625343f6ec0e2eb2f0e55ec6457ec762bf1','runtimeExpectedDeployCommit':'808709426ebc65efed7b74920e89c5fd49b60483','checks':checks,'passed':sum(c['pass'] for c in checks),'total':len(checks),'readiness':readiness,'paymentActions':0,'accountWrites':0,'outreachActions':0,'publicCheckoutOpen':False,'paidCustomerAcceptance':'NOT_CLAIMED'}
          (out/'LIVE_HTTP_READBACK.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
          assert all(c['pass'] for c in checks),'Readback mismatch; inspect saved observations'
          PY
      - name: Install browser for live public claim-path readback
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise live claim search without submitting a claim or account
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import pathlib,json,datetime
          root=pathlib.Path('dist');manifest=json.loads((root/'data/franklin-profiles-manifest.json').read_text())
          profile=json.loads((root/manifest['chunks'][0]['file'].lstrip('/')).read_text())['records'][0]
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for lang in ['en','es']:
                  ctx=browser.new_context();ctx.add_init_script(f"localStorage.setItem('franklinLanguage','{lang}')")
                  blocked=[];errors=[]
                  def guard(route):
                      if route.request.method not in ['GET','HEAD','OPTIONS']:
                          blocked.append({'method':route.request.method,'url':route.request.url.split('?')[0]});route.abort()
                      else:route.continue_()
                  ctx.route('**/*',guard);page=ctx.new_page();page.on('pageerror',lambda e:errors.append(str(e)))
                  page.goto('https://franklinnavigator.com/claim-profile/',wait_until='networkidle')
                  page.locator('[data-r37-claim-search]').fill(profile['n']);page.locator('[data-r37-claim-go]').click()
                  page.locator('.r37-search-result').first.wait_for();page.locator('.r37-search-result').first.click()
                  page.locator('a[href*="membership-enroll/?profile="]').wait_for()
                  results.append({'language':lang,'claimSearchAndSelection':True,'pageErrors':errors,'blockedWrites':blocked,'pass':not errors})
                  page.screenshot(path='live-hf1-readback/claim-'+lang+'.png',full_page=True);ctx.close()
              browser.close()
          report={'observedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results,'accountWrites':0,'claimsSubmitted':0,'paymentActions':0}
          pathlib.Path('live-hf1-readback/LIVE_BROWSER_READBACK.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          assert all(r['pass'] for r in results)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franklin-r40-hf1-live-readback
          path: live-hf1-readback/
          retention-days: 30
