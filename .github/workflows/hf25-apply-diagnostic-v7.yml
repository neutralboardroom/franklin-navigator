name: HF25 apply diagnostic v7
on:
  push:
    branches: [local-franklin-hf25-postlaunch-truth-20260908]
    paths: [.github/workflows/hf25-apply-diagnostic-v7.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: transport, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 9e8195d9c3939f791795ab38add326402b5d55c8, path: candidate/public, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Apply all exact variants
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          d=json.loads(pathlib.Path('transport/.github/hf25/postlaunch_truth_patch.json').read_text())
          for x in d['replacements']:x['min']=1
          d['replacements'] += [
            {'old':'new public membership checkout is closed.','new':'Franklin Community Membership enrollment is open for eligible verified profiles.','min':1},
            {'old':'Franklin will not reopen new enrollment until the remaining launch checks are complete.','new':'Eligible verified profiles can start membership setup now after representation is confirmed.','min':1},
            {'old':'New public membership checkout remains closed while Franklin completes the remaining launch checks.','new':'Franklin Community Membership enrollment is open for eligible verified profiles.','min':1}
          ]
          d['newSpanishTranslations']['Eligible verified profiles can start membership setup now after representation is confirmed.']='Los perfiles verificados elegibles pueden iniciar la configuración de la membresía ahora después de confirmar la representación.'
          tmp=pathlib.Path('/tmp/hf25-patch.json');tmp.write_text(json.dumps(d,ensure_ascii=False))
          subprocess.run([sys.executable,'transport/.github/hf25/apply_postlaunch_truth.py','candidate/public',str(tmp)],check=True)
          print('APPLY_PASS')
          PY
