name: HF25 final post-launch truth qualification v5
on:
  push:
    branches: [local-franklin-hf25-postlaunch-truth-20260908]
    paths: [.github/workflows/hf25-build-qualify-v5.yml]
permissions:
  contents: write
concurrency:
  group: franklin-hf25-final-public-truth-v5
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: transport, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 9e8195d9c3939f791795ab38add326402b5d55c8, path: candidate/public, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8, path: candidate/runtime, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Apply deterministic patch including exact markup-split pricing banner
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          d=json.loads(pathlib.Path('transport/.github/hf25/postlaunch_truth_patch.json').read_text())
          for x in d['replacements']:
            x['min']=1
            if x['old']=='New public membership checkout is closed.':x['old']='new public membership checkout is closed.'
          d['replacements'].append({'old':'Franklin will not reopen new enrollment until the remaining launch checks are complete.','new':'Eligible verified profiles can start membership setup now after representation is confirmed.','min':1})
          d['newSpanishTranslations']['Eligible verified profiles can start membership setup now after representation is confirmed.']='Los perfiles verificados elegibles pueden iniciar la configuración de la membresía ahora después de confirmar la representación.'
          tmp=pathlib.Path('/tmp/hf25-patch.json');tmp.write_text(json.dumps(d,ensure_ascii=False))
          subprocess.run([sys.executable,'transport/.github/hf25/apply_postlaunch_truth.py','candidate/public',str(tmp)],check=True)
          PY
      - name: Global public truth, no-loss, authority and link gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          root=Path('candidate/public');dist=root/'dist';runtime=Path('candidate/runtime');profiles=sorted((dist/'profiles').rglob('index.html'));assert len(profiles)==19103
          diff=subprocess.check_output(['git','-C',str(root),'diff','--name-only','9e8195d9c3939f791795ab38add326402b5d55c8'],text=True).splitlines();assert not any(x.startswith('dist/profiles/') for x in diff);assert not any(x.startswith('data/') or x.startswith('lib/') for x in diff)
          patch=json.loads(Path('transport/.github/hf25/postlaunch_truth_patch.json').read_text());banned=list(patch['bannedVisiblePhrases'])+['before new checkout opens:','paid business membership is not open yet','if membership opens, pricing will be shown clearly before any payment','franklin will not reopen new enrollment']
          stale=[]
          for p in dist.rglob('*.html'):
            low=p.read_text(errors='ignore').lower()
            for phrase in banned:
              if phrase.lower() in low:stale.append((p.relative_to(dist).as_posix(),phrase))
          assert not stale,stale[:30]
          # Broad post-launch semantic scan over all public HTML.
          rx=re.compile(r'(?i)(membership|checkout|enrollment|paid member access).{0,100}(closed|not open yet|not available yet|not active on this site|when enrollment opens|before checkout is available)|will not reopen.{0,50}enrollment')
          suspect=[]
          for p in dist.rglob('*.html'):
            text=re.sub(r'<[^>]+>',' ',p.read_text(errors='ignore'));text=re.sub(r'\s+',' ',text)
            for m in rx.finditer(text):suspect.append((p.relative_to(dist).as_posix(),m.group(0)))
          assert not suspect,suspect[:30]
          assert subprocess.check_output(['git','-C',str(runtime),'rev-parse','HEAD'],text=True).strip()=='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8'
          server=(runtime/'server.js').read_text();reserv=(runtime/'lib/purchase-reservations.js').read_text();catalog=(runtime/'lib/catalog.js').read_text()
          for token in ['COMMERCE_DISABLED','MEMBERSHIP_ALREADY_ACTIVE','PROFILE_VERIFICATION_REQUIRED','startSafePurchase']:assert token in server or token in reserv
          for token in ['regularUsd:5','regularUsd:50','regularUsd:120','franklin_community_member_monthly_v5','franklin_community_member_annual_v5','franklin_charter_member_36_month_v5']:assert token in catalog
          missing=[]
          for p in dist.rglob('*.html'):
            t=p.read_text(errors='ignore')
            for href in re.findall(r'href=["\']([^"\']+)',t):
              if not href.startswith('/') or href.startswith('//'):continue
              href=href.split('#',1)[0].split('?',1)[0]
              if not href:continue
              q=dist/href.lstrip('/')
              if not(q.is_file() or (q/'index.html').is_file()):missing.append((p.relative_to(dist).as_posix(),href))
          assert not missing,missing[:30]
          for name in diff:
            if not name.startswith('dist/'):continue
            t=(root/name).read_text(errors='ignore');assert not re.search(r'\bsk_live_[A-Za-z0-9]{16,}',t);assert not re.search(r'\bwhsec_[A-Za-z0-9]{16,}',t);low=t.lower();assert 'smarterjustice.com' not in low and 'smarter-justice' not in low
          report={'profiles':19103,'changedFiles':diff,'staleClaims':0,'semanticPrelaunchClaims':0,'internalBrokenLinks':0,'runtimeCommit':'44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8','prices':[5,50,120],'profileMutations':0,'financialMutations':0,'smarterJusticeDonorUsed':False};(root/'evidence/HF25_STATIC_NO_LOSS.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps({'profiles':19103,'changed':len(diff),'stale':0,'broken':0}))
          PY
      - name: Full unchanged runtime regression
        working-directory: candidate/runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real changed-page EN/ES phone and desktop qualification
        run: |
          set -euo pipefail
          python -m http.server 8876 --bind 127.0.0.1 --directory candidate/public/dist >/tmp/hf25-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,subprocess
          root=Path('candidate/public');ev=root/'evidence/hf25-browser';ev.mkdir(parents=True,exist_ok=True);changed=[x for x in subprocess.check_output(['git','-C',str(root),'diff','--name-only','9e8195d9c3939f791795ab38add326402b5d55c8'],text=True).splitlines() if x.startswith('dist/') and x.endswith('.html')]
          patch=json.loads(Path('transport/.github/hf25/postlaunch_truth_patch.json').read_text());banned=[x.lower() for x in patch['bannedVisiblePhrases']]+['before new checkout opens:','franklin will not reopen new enrollment'];rows=[]
          def ok(i,v,d=''):rows.append({'id':i,'pass':bool(v),'detail':d});assert v,(i,d)
          with sync_playwright() as p:
            b=p.chromium.launch()
            for rel in changed:
              route='/'+rel[5:];route=route[:-10] if route.endswith('index.html') else route
              for width in [390,1280]:
                c=b.new_context(viewport={'width':width,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));r=page.goto('http://127.0.0.1:8876'+route,wait_until='networkidle');body=page.locator('body').inner_text();low=body.lower();ok(f'{rel}:{width}:http',r and r.status==200);ok(f'{rel}:{width}:h1',page.locator('main h1').count()==1);ok(f'{rel}:{width}:stale',not any(x in low for x in banned));ok(f'{rel}:{width}:overflow',page.evaluate('document.documentElement.scrollWidth<=document.documentElement.clientWidth+2'));ok(f'{rel}:{width}:js',not errs,' | '.join(errs[:3]))
                if page.locator('[data-r37-lang="es"]').count():page.locator('[data-r37-lang="es"]').click();page.wait_for_timeout(200);ok(f'{rel}:{width}:es-lang',page.locator('html').get_attribute('lang')=='es');spanish=page.locator('body').inner_text();ok(f'{rel}:{width}:es-no-open-english','Eligible verified profiles can start membership setup now after representation is confirmed.' not in spanish)
                c.close()
            b.close()
          report={'result':'PASS','changedHtmlPages':len(changed),'assertions':len(rows),'pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'results':rows};(ev/'BROWSER.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps({'pages':len(changed),'assertions':len(rows),'fail':0}))
          PY
      - name: Verify current live commerce remains open and exact
        run: |
          python - <<'PY'
          import urllib.request,json
          def get(u):return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Franklin-HF25/1.0','Cache-Control':'no-cache'}),timeout=30))
          r=get('https://franklin-navigator-membership.onrender.com/ready');c=get('https://franklin-navigator-membership.onrender.com/api/catalog');assert r['ok'] and r['database'] and r['commerceEnabled'] and r['liveCheckoutEnabled'] and r['stripeCheckoutSessionConfigured'] and r['stripeWebhookConfigured'] and r['portalSessionConfigured'] and r['startupError'] is None;assert c['publicCheckoutOpen'] and [x['priceUsd'] for x in c['choices']]==[5,50,120];print(json.dumps({'commerce':True,'checkout':True,'prices':[5,50,120]}))
          PY
      - name: Recheck exact parents and prepare clean direct-child product candidate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,urllib.request,os,subprocess,base64,datetime
          root=Path('candidate/public');base='9e8195d9c3939f791795ab38add326402b5d55c8';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8';repo='neutralboardroom/franklin-navigator'
          def api(p):return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}),timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base;assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime
          diff=subprocess.check_output(['git','-C',str(root),'diff','--name-only',base],text=True).splitlines()
          def td(p):
            h=hashlib.sha256();p=Path(p)
            for f in sorted(p.rglob('*')):
              if f.is_file():h.update(f.relative_to(p).as_posix().encode()+b'\0'+hashlib.sha256(f.read_bytes()).hexdigest().encode()+b'\n')
            return h.hexdigest()
          release={'release':'FR-NAV1.15.0-HF2.5-CANDIDATE','component':'public','parent':base,'runtimePair':runtime,'publicDistSha256':td(root/'dist'),'profileCount':19103,'profileFactsChanged':False,'commerceOpenedByBuild':False,'commercePreservedOpen':True,'commercialContractChanged':False,'smarterJusticeDonorUsed':False,'qualification':{'runId':int(os.environ['GITHUB_RUN_ID']),'sourceState':'PUBLIC_SOURCE_BROWSER_QUALIFIED','financialMutations':0},'changedProductFiles':diff,'rollback':{'publicCommit':base,'runtimeCommerceKillSwitch':'COMMERCE_ENABLED=false'},'generatedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()};(root/'PRODUCTION_RELEASE.json').write_text(json.dumps(release,indent=2,sort_keys=True)+'\n');names=sorted(set(diff+['PRODUCTION_RELEASE.json']))
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf25-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);assert set(git('diff','--cached','--name-only').splitlines())==set(names);git('commit','-m','Correct Franklin post-launch membership truth across public EN/ES surfaces; preserve live checkout [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env);out={'commit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base,'runtimePair':runtime,'branch':branch,'changedFiles':names,'financialMutations':0};(root/'evidence/HF25_PREPARED.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: hf25-final-qualification-v5, path: candidate/public/evidence/, retention-days: 14, if-no-files-found: error}
