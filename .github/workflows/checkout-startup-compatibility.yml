name: Franklin HF1 actual production startup qualification
on:
  push:
    branches: [franklin-checkout-hf1-startup-compatibility]
    paths:
      - 'scripts/scc-runtime-route-guard.mjs'
      - '.github/workflows/checkout-startup-compatibility.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: franklin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d franklin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fixture:isolated_test_only@127.0.0.1:5432/franklin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install locked dependencies and verify source is not rewritten by startup guard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          sha256sum server.js > /tmp/server-before.sha256
          node scripts/scc-runtime-route-guard.mjs
          node scripts/scc-runtime-route-guard.mjs
          sha256sum --check /tmp/server-before.sha256
          npm test
          node acceptance/purchase-reservations.integration.cjs
      - name: Run the exact production npm start command, not node directly
        run: |
          python3 - <<'PY'
          import os,subprocess,time,json,urllib.request,urllib.error,hashlib,pathlib,signal
          env={**os.environ,'DATABASE_URL':os.environ['TEST_DATABASE_URL'],'PGSSL_DISABLE':'true','PORT':'10999','COMMERCE_ENABLED':'false'}
          for k in ['SESSION_SECRET','LOCAL_ASSERTION_SECRET','SRE_SHARED_SECRET','ADMIN_TOKEN']:
              env[k]='synthetic-only-'+('x'*40)
          env['STRIPE_SECRET_KEY']='_'.join(['sk','live','0'*32])
          env['STRIPE_WEBHOOK_SECRET']='_'.join(['whsec','0'*32])
          pathlib.Path('startup-proof').mkdir(exist_ok=True)
          with open('startup-proof/npm-start.log','w') as log:
              p=subprocess.Popen(['npm','start'],env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              try:
                  for _ in range(30):
                      if p.poll() is not None:raise RuntimeError('npm start exited')
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:10999/ready',timeout=2) as r:state=json.load(r)
                          break
                      except Exception:time.sleep(1)
                  else:raise RuntimeError('npm start did not become ready')
                  assert state['ok'] and state['database']
                  assert state['checkoutSafetyVersion']=='FRANKLIN_CHECKOUT_SAFETY_1'
                  assert state['commerceEnabled'] is False and state['liveCheckoutEnabled'] is False
                  req=urllib.request.Request('http://127.0.0.1:10999/api/membership/start',data=b'{}',headers={'Content-Type':'application/json'},method='POST')
                  try:urllib.request.urlopen(req);raise AssertionError('Closed checkout allowed')
                  except urllib.error.HTTPError as e:
                      assert e.code==423
                      assert json.load(e)['error']['code']=='COMMERCE_DISABLED'
                  result={'result':'PASS','testedCommit':os.environ['GITHUB_SHA'],'productionCommand':'npm start','ready':state['ok'],'safetyVersion':state['checkoutSafetyVersion'],'commerceEnabled':False,'realProviderCalls':0,'serverSha256':hashlib.sha256(pathlib.Path('server.js').read_bytes()).hexdigest()}
                  pathlib.Path('startup-proof/RESULTS.json').write_text(json.dumps(result,indent=2)+'\n')
                  print(json.dumps(result))
              finally:
                  os.killpg(p.pid,signal.SIGTERM)
                  p.wait(timeout=10)
          PY
      - name: Archive the exact tested source
        if: success()
        run: git archive --format=zip --output=startup-proof/FRANKLIN_CHECKOUT_HF1_STARTUP_QUALIFIED.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: franklin-hf1-production-startup-proof
          path: |
            startup-proof/
            evidence/CHECKOUT_SAFETY_INTEGRATION_RESULTS.json
          retention-days: 30
