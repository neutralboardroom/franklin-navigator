name: HF31 Spanish final zero-issue gate
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - scripts/hf31-spanish-final8.py
      - .github/workflows/hf31-spanish-final8.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix remaining Spanish issues and require zero high-confidence findings
        run: python3 scripts/hf31-spanish-final8.py
      - name: Persist exact final Spanish pages and report
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist/es evidence/hf31/SPANISH_LANGUAGE_FINAL_REPORT.json
          if git diff --cached --quiet; then
            echo 'Spanish final report already exact'
          else
            git commit -m 'Finish formal Spanish and untranslated UI cleanup [skip ci]'
            git push origin HEAD:hf31-profile-currentness-polish-20260910
          fi
