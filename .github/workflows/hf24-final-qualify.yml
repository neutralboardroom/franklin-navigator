name: HF24 final direct-parent qualification
on:
  push:
    branches: [local-franklin-hf24-assistant-practical-20260908]
    paths: [.github/workflows/hf24-final-qualify.yml, dist/assets/r40-assistant-safety-guard.js]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b53ec209ac74c0e9906c5045c3140a4a653c44db
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Apply exact bounded product slice to HF2.3 live parent
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          base=Path('candidate'); src=Path('transport')
          # Copy only bounded product files authored in this continuation.
          for rel in ['dist/assets/r40-assistant-practical.js','dist/assets/r40-assistant-safety-guard.js','dist/assets/device-followthrough-core.js']:
            (base/rel).write_bytes((src/rel).read_bytes())
          p=base/'dist/assets/r37-i18n.js'; text=p.read_text()
          old="""  document.addEventListener('DOMContentLoaded',async()=>{\n    bindControls();"""
          assert old in text
          # Preserve existing i18n and add one lazy loader for the Assistant/My Franklin surfaces only.
          marker="\n})();\n"
          assert text.endswith(marker)
          loader="""\n  document.addEventListener('DOMContentLoaded',()=>{\n    if(!document.querySelector('[data-navigator-bot],[data-r38-assistant-plans]'))return;\n    if(document.querySelector('script[data-r40-assistant-practical]'))return;\n    const practical=document.createElement('script');practical.src='/assets/r40-assistant-practical.js';practical.defer=true;practical.dataset.r40AssistantPractical='1';\n    practical.addEventListener('load',()=>{if(document.querySelector('script[data-r40-assistant-safety-guard]'))return;const guard=document.createElement('script');guard.src='/assets/r40-assistant-safety-guard.js';guard.defer=true;guard.dataset.r40AssistantSafetyGuard='1';document.head.append(guard)});\n    document.head.append(practical);\n  });\n"""
          text=text[:-len(marker)]+loader+marker
          p.write_text(text)
          changed=['dist/assets/r40-assistant-practical.js','dist/assets/r40-assistant-safety-guard.js','dist/assets/device-followthrough-core.js','dist/assets/r37-i18n.js']
          ev=base/'evidence';ev.mkdir(exist_ok=True)
          (ev/'HF24_SOURCE_BINDING.json').write_text(json.dumps({'parent':'b53ec209ac74c0e9906c5045c3140a4a653c44db','runtimePair':'a9c918b656ced6386b1af604fde51d4a7e88d3b9','files':{x:hashlib.sha256((base/x).read_bytes()).hexdigest() for x in changed},'profileFactsChanged':False,'commerceOpened':False,'ownerAuthenticationObserved':False},indent=2)+'\n')
          PY
      - name: Static safety and syntax
        working-directory: candidate
        run: |
          set -euo pipefail
          node --check dist/assets/r40-assistant-practical.js
          node --check dist/assets/r40-assistant-safety-guard.js
          node --check dist/assets/r37-i18n.js
          node --check dist/assets/device-followthrough-core.js
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/assets/r40-assistant-practical.js').read_text();g=Path('dist/assets/r40-assistant-safety-guard.js').read_text();core=Path('dist/assets/device-followthrough-core.js').read_text()
          assert 'fetch(' not in p and 'XMLHttpRequest' not in p and 'networkSubmission:false' in p and 'rawQuestionStored:false' in p
          assert 'Smarter Justice' not in p and 'smarterjustice' not in p.lower()
          assert 'franklinNavigator.assistantPractical.v1' in core
          assert '911' in g and '988' in g
          print('STATIC_PASS')
          PY
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real EN/ES task, same-session urgent, save, reopen, reset
        run: |
          set -euo pipefail
          python -m http.server 8875 --bind 127.0.0.1 --directory candidate/dist >/tmp/hf24.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          origin='http://127.0.0.1:8875';rows=[]
          def ok(i,v): rows.append({'id':i,'pass':bool(v)}); assert v,i
          with sync_playwright() as p:
            b=p.chromium.launch()
            for locale,path in [('en','/assistant/'),('es','/es/asistente/')]:
              c=b.new_context(viewport={'width':390,'height':900});page=c.new_page();page.goto(origin+path,wait_until='networkidle')
              ok(locale+' practical loaded',page.evaluate("typeof FranklinR40Practical==='object'"));ok(locale+' guard loaded',page.evaluate("typeof FranklinR40SafetyGuard==='object'"))
              inp=page.locator('[data-navigator-input]');inp.fill('I need help starting a business in Franklin' if locale=='en' else 'Necesito ayuda para iniciar un negocio en Franklin');page.locator('form.navigator-form button[type=submit]').click();page.locator('[data-r40-practical] h3').wait_for()
              ok(locale+' targeted clarification',page.locator('[data-r40-practical] button').count()>=3)
              page.get_by_role('button',name=('Home-based' if locale=='en' else 'Desde casa'),exact=True).click();ok(locale+' ordered checklist',page.locator('[data-r40-practical] ol li').count()>=4)
              inp.fill('new leased location' if locale=='en' else 'local nuevo alquilado');page.locator('form.navigator-form button[type=submit]').click();page.wait_for_timeout(120);txt=page.locator('[data-r40-practical]').inner_text();ok(locale+' second turn',('New or leased location' in txt if locale=='en' else 'Local nuevo o alquilado' in txt))
              page.get_by_role('button',name=('Save this checklist on this device' if locale=='en' else 'Guardar esta lista en este dispositivo'),exact=True).click();page.wait_for_timeout(80)
              stored=page.evaluate("JSON.parse(localStorage.getItem('franklinNavigator.assistantPractical.v1'))");ok(locale+' minimized save',len(stored)==1 and stored[0]['variant']=='location' and 'question' not in stored[0] and stored[0]['privacy']['networkSubmission'] is False)
              href=page.locator('[data-r40-practical-saved] a').first.get_attribute('href');ok(locale+' reopen href',bool(href and 'reopen=' in href))
              # Critical regression: urgent request after business task in the SAME session must clear the practical overlay.
              inp.fill('911 immediate danger' if locale=='en' else '911 peligro inmediato');page.locator('form.navigator-form button[type=submit]').click();page.wait_for_timeout(180);ok(locale+' urgent output','911' in page.locator('[data-navigator-output]').inner_text());ok(locale+' same-session practical cleared',page.locator('[data-r40-practical]').is_hidden())
              page.goto(origin+href,wait_until='networkidle');page.locator('[data-r40-practical] ol').wait_for();ok(locale+' reopened checklist',page.locator('[data-r40-practical] ol li').count()>=4)
              page.goto(origin+('/my-franklin/' if locale=='en' else '/es/mi-franklin/'),wait_until='networkidle');page.locator('[data-r40-practical-saved]').wait_for();ok(locale+' My Franklin projection',page.locator('[data-r40-practical-saved] article').count()==1)
              result=page.evaluate("()=>FranklinDeviceCore.createStore(()=>localStorage).clear()");ok(locale+' reset clears practical',result['ok'] and page.evaluate("localStorage.getItem('franklinNavigator.assistantPractical.v1')===null"))
              c.close()
            b.close()
          report={'result':'PASS','pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'results':rows};Path('candidate/evidence/HF24_BROWSER.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report))
          PY
      - name: Recheck bases and prepare clean direct-child candidate
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,urllib.request,os,subprocess,base64,datetime
          root=Path('candidate');repo='neutralboardroom/franklin-navigator';base='b53ec209ac74c0e9906c5045c3140a4a653c44db';runtime='a9c918b656ced6386b1af604fde51d4a7e88d3b9'
          def api(p):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'});return json.load(urllib.request.urlopen(req,timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base
          assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime
          def td(p):
            h=hashlib.sha256();p=Path(p)
            for f in sorted(p.rglob('*')):
              if f.is_file():h.update(f.relative_to(p).as_posix().encode()+b'\0'+hashlib.sha256(f.read_bytes()).hexdigest().encode()+b'\n')
            return h.hexdigest()
          binding=json.loads((root/'evidence/HF24_SOURCE_BINDING.json').read_text());browser=json.loads((root/'evidence/HF24_BROWSER.json').read_text())
          release={'release':'FR-NAV1.15.0-HF2.4-CANDIDATE','component':'public','parent':base,'runtimePair':runtime,'baseSourceArchiveSha256':'6e2eba3b7e634173355beae38d0acba15ee7f3fea3fa6017b9b5aef902b15f27','publicDistSha256':td(root/'dist'),'publicDistDigestRule':'sorted path + NUL + file sha256 hex + LF','profileCount':19103,'profileFactsChanged':False,'commerceOpenedByBuild':False,'commercialAcceptance':False,'sourceState':'PUBLIC_SOURCE_BROWSER_QUALIFIED_NOT_PAID_LAUNCH_ACCEPTANCE','qualification':{'runId':int(os.environ['GITHUB_RUN_ID']),'browserPass':browser['pass'],'browserFail':browser['fail'],'ownerAuthenticationObserved':False,'paidLifecycleAccepted':False},'changedFiles':binding['files'],'generatedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (root/'PRODUCTION_RELEASE.json').write_text(json.dumps(release,indent=2,sort_keys=True)+'\n')
          receipt={'role':'LOCAL_COMMUNITY_PLATFORM','activeEdition':'FRANKLIN_TN','writableLane':'LOCAL_COMMUNITY_EDITION:FRANKLIN_TN','predecessor':base,'runtimePair':runtime,'successor':'FR-NAV1.15.0-HF2.4-CANDIDATE','commandRevision':'2026-09-03-R2','sccR5Observed':True,'liV25Imported':False,'pf1517FactsImportedByHf24':False,'smarterJusticeDonorUsed':False,'commerceOpened':False,'ownerSigninDeferred':True,'authorityTransfer':False}
          (root/'evidence/HF24_RULE_AND_SOURCE_RECONCILIATION_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          names=list(binding['files'])+['PRODUCTION_RELEASE.json','evidence/HF24_SOURCE_BINDING.json','evidence/HF24_BROWSER.json','evidence/HF24_RULE_AND_SOURCE_RECONCILIATION_RECEIPT.json']
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf24-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);git('commit','-m','Qualify practical Franklin Assistant multi-turn checklists with same-session urgent guard; checkout held [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env)
          out={'preparedCommit':git('rev-parse','HEAD'),'parent':base,'branch':branch,'browser':browser,'runtimePair':runtime,'commerceOpened':False};(root/'evidence/HF24_PREPARED.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf24-final-qualification
          path: candidate/evidence/
          retention-days: 14
          if-no-files-found: error
