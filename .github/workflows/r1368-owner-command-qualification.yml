name: R1368 consolidated owner command qualification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout R1368 public candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact live membership runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f5a99db2f67bd76b7b01f54aeb37091153d04d8b
          path: runtime-live
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install exact runtime dependencies
        working-directory: runtime-live
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact live runtime unit and syntax regression
        working-directory: runtime-live
        run: |
          npm test
          npm run check
      - name: R1368 101-point owner-command acceptance
        run: node test-r1368-owner-command.js
      - name: Carry forward membership visibility safeguards
        run: node test-r1364-membership-visibility.js
      - name: R1367 mobile and profile boundary regression
        run: node tests/r1367-mobile-home-and-profile-boundaries.cjs
