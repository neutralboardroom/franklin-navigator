name: HF25 dynamic verified-profile truth
on:
  push:
    branches: [local-franklin-hf25-dynamic-truth-20260908]
    paths: [.github/workflows/hf25-dynamic-truth.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eaff996669a0c432e2ebd40773a86bc869310f42
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Apply bounded dynamic truth correction and Spanish parity
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('candidate');js=root/'dist/assets/membership-live.js';text=js.read_text()
          old="s.append(notice(verified?'Profile verified. You can continue when checkout is available.':'Request a representation review to continue. Payment stays closed until your representation is confirmed.',verified?'good':'warn'))"
          new="const verificationMessage=verified?(state.ready?.liveCheckoutEnabled?'Profile verified. You can continue to membership.':'Profile verified. Checkout is not open. Check membership status for any earlier payment.'):'Request a representation review to continue. Payment stays closed until your representation is confirmed.';s.append(notice(verificationMessage,verified?'good':'warn'))"
          assert text.count(old)==1,text.count(old)
          text=text.replace(old,new);js.write_text(text)
          es=root/'dist/data/r37-es-public-strings.json';d=json.loads(es.read_text());tr=d['translations'];tr['Profile verified. You can continue to membership.']='Perfil verificado. Puedes continuar con la membresía.';tr['Profile verified. Checkout is not open. Check membership status for any earlier payment.']='Perfil verificado. El pago no está abierto. Revisa el estado de la membresía para cualquier pago anterior.';tr.pop('Profile verified. You can continue when checkout is available.',None);d['count']=len(tr);d['release']='FR-NAV1.15.0-HF2.5-CANDIDATE';d['translations']=dict(sorted(tr.items()));es.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          ev=root/'evidence';ev.mkdir(exist_ok=True);(ev/'HF25_DYNAMIC_TRUTH_SOURCE.json').write_text(json.dumps({'parent':'eaff996669a0c432e2ebd40773a86bc869310f42','changedFiles':{'dist/assets/membership-live.js':hashlib.sha256(js.read_bytes()).hexdigest(),'dist/data/r37-es-public-strings.json':hashlib.sha256(es.read_bytes()).hexdigest()},'runtimeChanged':False,'pricesChanged':False,'financialMutations':0},indent=2)+'\n')
          PY
      - name: Static safety and exact rollback behavior
        run: |
          node --check candidate/dist/assets/membership-live.js
          python - <<'PY'
          from pathlib import Path
          import json
          js=Path('candidate/dist/assets/membership-live.js').read_text();es=json.loads(Path('candidate/dist/data/r37-es-public-strings.json').read_text())['translations']
          assert 'Profile verified. You can continue when checkout is available.' not in js
          assert "state.ready?.liveCheckoutEnabled?'Profile verified. You can continue to membership.':'Profile verified. Checkout is not open. Check membership status for any earlier payment.'" in js
          assert 'MEMBERSHIP_ALREADY_ACTIVE' in js and 'CHECKOUT_PENDING_MESSAGE' in js and 'COMMERCE_DISABLED' in js
          assert es['Profile verified. You can continue to membership.']=='Perfil verificado. Puedes continuar con la membresía.'
          assert es['Profile verified. Checkout is not open. Check membership status for any earlier payment.'].startswith('Perfil verificado.')
          assert 'Profile verified. You can continue when checkout is available.' not in es
          print('STATIC_PASS')
          PY
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser prove verified-profile open and rollback states in English and Spanish
        run: |
          set -euo pipefail
          python -m http.server 8877 --bind 127.0.0.1 --directory candidate/dist >/tmp/hf25-dynamic-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          dist=Path('candidate/dist');manifest=json.loads((dist/'data/franklin-profiles-manifest.json').read_text());chunk=json.loads((dist/manifest['chunks'][0]['file'].lstrip('/')).read_text());profile=chunk['records'][0];pid=profile['i'];rows=[]
          def ok(i,v,d=''):rows.append({'id':i,'pass':bool(v),'detail':d});assert v,(i,d)
          def me_payload():return {'ok':True,'account':{'email':'verified-member-fixture@example.invalid'},'profileLinks':[{'profile_id':pid,'authority_state':'VERIFIED','verified_at':'2026-09-08T00:00:00Z'}],'membership':None}
          with sync_playwright() as p:
            browser=p.chromium.launch()
            for open_state in [True,False]:
              for locale in ['en','es']:
                c=browser.new_context(viewport={'width':390,'height':900});page=c.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
                page.route('https://franklin-navigator-membership.onrender.com/ready',lambda route:route.fulfill(status=200,content_type='application/json',body=json.dumps({'ok':True,'liveCheckoutEnabled':open_state})))
                page.route('https://franklin-navigator-membership.onrender.com/api/accounts/me',lambda route:route.fulfill(status=200,content_type='application/json',body=json.dumps(me_payload())))
                page.goto('http://127.0.0.1:8877/membership-enroll/',wait_until='networkidle');page.wait_for_timeout(800)
                if locale=='es':page.locator('[data-r37-lang="es"]').click();page.wait_for_timeout(250)
                body=page.locator('body').inner_text()
                if open_state and locale=='en':ok('open-en','Profile verified. You can continue to membership.' in body,body[-1000:]);ok('open-en-no-stale','Profile verified. You can continue when checkout is available.' not in body)
                if not open_state and locale=='en':ok('closed-en','Profile verified. Checkout is not open. Check membership status for any earlier payment.' in body,body[-1000:]);ok('closed-en-no-payment',page.get_by_text('$5/month').count()==0)
                if open_state and locale=='es':ok('open-es','Perfil verificado. Puedes continuar con la membresía.' in body,body[-1000:]);ok('open-es-no-en','Profile verified. You can continue to membership.' not in body)
                if not open_state and locale=='es':ok('closed-es','Perfil verificado. El pago no está abierto.' in body,body[-1000:]);ok('closed-es-no-en','Profile verified. Checkout is not open.' not in body)
                ok(f'{open_state}-{locale}-no-js',not errors,' | '.join(errors));ok(f'{open_state}-{locale}-no-overflow',page.evaluate('document.documentElement.scrollWidth<=document.documentElement.clientWidth+2'));c.close()
            browser.close()
          report={'schemaVersion':'franklin.hf25.dynamic-browser.v1','result':'PASS','profileFixtureIdHashed':__import__('hashlib').sha256(pid.encode()).hexdigest(),'assertions':len(rows),'pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'financialMutations':0,'results':rows};Path('candidate/evidence/HF25_DYNAMIC_BROWSER.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps({'assertions':len(rows),'fail':report['fail']}))
          PY
      - name: Verify current live checkout remains open while source qualifies
        run: |
          python - <<'PY'
          import urllib.request,json
          def get(u):return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Franklin-HF25-dynamic/1.0','Cache-Control':'no-cache'}),timeout=30))
          r=get('https://franklin-navigator-membership.onrender.com/ready');c=get('https://franklin-navigator-membership.onrender.com/api/catalog');assert r['commerceEnabled'] and r['liveCheckoutEnabled'] and r['database'] and r['startupError'] is None;assert c['publicCheckoutOpen'] and [x['priceUsd'] for x in c['choices']]==[5,50,120];print('LIVE_OPEN_PRESERVED')
          PY
      - name: Fresh parent check and prepare direct child
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request,os,subprocess,base64
          root=Path('candidate');base='eaff996669a0c432e2ebd40773a86bc869310f42';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8';repo='neutralboardroom/franklin-navigator'
          def api(p):return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}),timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base,'main advanced'
          assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime,'runtime advanced'
          names=['dist/assets/membership-live.js','dist/data/r37-es-public-strings.json','evidence/HF25_DYNAMIC_TRUTH_SOURCE.json','evidence/HF25_DYNAMIC_BROWSER.json']
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf25-dynamic-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);git('commit','-m','Finish HF2.5 verified-profile dynamic checkout truth in EN/ES [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env);out={'preparedCommit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base,'runtimePair':runtime,'branch':branch,'financialMutations':0};Path('evidence/HF25_DYNAMIC_PREPARED.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: hf25-dynamic-truth-evidence, path: candidate/evidence/, retention-days: 14, if-no-files-found: error}
