name: Franklin commerce runtime persistent lifecycle proof

on:
  workflow_dispatch:
  push:
    branches:
      - franklin-commerce-runtime
    paths:
      - server.js
      - lib/**
      - schema/**
      - test/**
      - package.json
      - package-lock.json
      - render.yaml
      - evidence/**
      - .github/workflows/franklin-commerce-runtime-persistent-proof.yml

permissions:
  contents: read

jobs:
  persistent-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: franklin
          POSTGRES_PASSWORD: franklin_test_only
          POSTGRES_DB: franklin_membership
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U franklin -d franklin_membership"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: '4180'
      LOCAL_RELEASE: FR-NAV1.2.0-CANDIDATE-R27
      PUBLIC_ORIGIN: http://127.0.0.1:4180
      DATABASE_URL: postgresql://franklin:franklin_test_only@127.0.0.1:5432/franklin_membership
      SESSION_SECRET: github-actions-test-session-secret-0123456789
      LOCAL_ASSERTION_SECRET: github-actions-test-assertion-secret-0123456789
      SRE_SHARED_SECRET: github-actions-test-sre-shared-secret-0123456789
      STRIPE_WEBHOOK_SECRET: whsec_github_actions_test_only_0123456789
      STRIPE_ACCOUNT_ID: acct_1TZU2TRxNra9nizo
      STRIPE_PORTAL_LOGIN_URL: https://billing.stripe.com/p/login/testonly
      ADMIN_TOKEN: github-actions-test-admin-token-0123456789
      SESSION_DAYS: '14'
      COMMERCE_ENABLED: 'false'
      PGSSL_DISABLE: 'true'
    steps:
      - name: Check out exact Franklin runtime branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify source, syntax and complete unit suite
        run: |
          set -euo pipefail
          npm run check
          npm test
          test "$(grep -c '^function parseCookies' server.js)" -eq 1
          grep -q "COMMERCE_ENABLED" server.js
          grep -q "COMMERCE_DISABLED" server.js

      - name: Apply canonical schema and verify exact table inventory
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/001_init.sql
          psql "$DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" > /tmp/franklin-commerce-tables.txt
          cat > /tmp/expected-tables.txt <<'TABLES'
          franklin_accounts
          franklin_audit_log
          franklin_checkout_intents
          franklin_dead_letters
          franklin_entitlements
          franklin_event_ledger
          franklin_memberships
          franklin_onboarding
          franklin_payment_links
          franklin_profile_links
          franklin_recovery_tokens
          franklin_schema_migrations
          franklin_sessions
          franklin_support_requests
          TABLES
          sed -i 's/^          //' /tmp/expected-tables.txt
          diff -u /tmp/expected-tables.txt /tmp/franklin-commerce-tables.txt
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into franklin_accounts(account_id,community,email,email_normalized,password_hash) values('bad_community','OTHER','bad@example.test','bad@example.test','x')"; then
            echo 'Cross-community insert unexpectedly succeeded'; exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into franklin_accounts(account_id,community,email,email_normalized,password_hash) values('proof_account','FRANKLIN_TN','proof@example.test','proof@example.test','proof_hash') on conflict(account_id) do nothing"

      - name: Start fail-closed runtime against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          npm start >/tmp/franklin-commerce-runtime.log 2>&1 &
          echo $! >/tmp/franklin-commerce-runtime.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4180/health >/tmp/franklin-health.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/franklin-commerce-runtime.log
          exit 1

      - name: Synchronize exactly 84 synthetic non-charging mappings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >/tmp/payment-links.json
          const {plans}=require('./lib/catalog');
          if(plans.length!==84) throw new Error('catalog_not_84');
          const links=plans.map((plan,index)=>({lookupKey:plan.lookupKey,paymentLinkId:'plink_TEST'+String(index+1).padStart(4,'0'),url:'https://buy.stripe.com/test'+String(index+1).padStart(4,'0')}));
          process.stdout.write(JSON.stringify({links}));
          NODE
          STATUS=$(curl -sS -o /tmp/payment-link-sync.json -w '%{http_code}' -H "Authorization: Bearer $ADMIN_TOKEN" -H 'content-type: application/json' --data-binary @/tmp/payment-links.json http://127.0.0.1:4180/admin/payment-links/sync || true)
          if [ "$STATUS" != '200' ]; then
            echo "payment-link sync HTTP status: $STATUS"
            cat /tmp/payment-link-sync.json || true
            echo '--- runtime log ---'
            cat /tmp/franklin-commerce-runtime.log || true
            exit 1
          fi
          jq -e '.ok==true and .count==84' /tmp/payment-link-sync.json

      - name: Verify infrastructure readiness while commerce remains closed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:4180/ready > /tmp/franklin-ready.json
          jq -e '.ok==true and .database==true and .paymentLinkCount==84 and .stripeWebhookConfigured==true and .portalLoginConfigured==true and .commerceEnabled==false and .liveCheckoutEnabled==false and (.missing|length)==0' /tmp/franklin-ready.json
          STATUS=$(curl -sS -o /tmp/checkout-disabled.json -w '%{http_code}' -H 'content-type: application/json' -d '{"lookupKey":"franklin_legal_individual_monthly_v2","profileId":"FR-PROOF-001"}' http://127.0.0.1:4180/api/membership/start || true)
          test "$STATUS" = '423'
          jq -e '.error.code=="COMMERCE_DISABLED"' /tmp/checkout-disabled.json
          curl -fsS http://127.0.0.1:4180/api/catalog > /tmp/catalog.json
          jq -e '.selfServiceRecurringPriceCount==84 and .productCount==14 and ([.verticals[].enterprise.quoteOnly]|all)' /tmp/catalog.json
          jq -e '([.verticals[].plans[]|select(.tier=="ENTERPRISE")]|length)==0' /tmp/catalog.json

      - name: Exercise restart persistence and idempotent records
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat /tmp/franklin-commerce-runtime.pid)" || true
          sleep 2
          npm start >/tmp/franklin-commerce-runtime-restart.log 2>&1 &
          echo $! >/tmp/franklin-commerce-runtime.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4180/ready >/tmp/franklin-ready-after-restart.json; then break; fi
            sleep 1
          done
          jq -e '.ok==true and .paymentLinkCount==84 and .commerceEnabled==false' /tmp/franklin-ready-after-restart.json
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from franklin_accounts where account_id='proof_account'")" = '1'
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from franklin_payment_links where active=true")" = '84'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into franklin_event_ledger(event_key,source,event_type,payload_sha256,processing_state) values('proof:event','SRE','invoice.paid',repeat('a',64),'RECEIVED') on conflict(event_key) do nothing"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into franklin_event_ledger(event_key,source,event_type,payload_sha256,processing_state) values('proof:event','SRE','invoice.paid',repeat('a',64),'RECEIVED') on conflict(event_key) do nothing"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from franklin_event_ledger where event_key='proof:event'")" = '1'

      - name: Create exact non-secret evidence packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/franklin-commerce-proof/source
          cp -R server.js lib schema test package.json package-lock.json README.md render.yaml evidence /tmp/franklin-commerce-proof/source/
          cp /tmp/franklin-commerce-tables.txt /tmp/franklin-commerce-proof/
          cp /tmp/franklin-health.json /tmp/franklin-commerce-proof/
          cp /tmp/franklin-ready.json /tmp/franklin-commerce-proof/
          cp /tmp/franklin-ready-after-restart.json /tmp/franklin-commerce-proof/
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const receipt={
            schemaVersion:'franklin.commerce.persistent-proof.v2',
            workOrders:['WO-20260829-LOCAL-FRANKLIN-R22-COMMERCE-INTEGRATION-022','WO-20260830-LOCAL-FRANKLIN-R24-PERSISTENT-COMMERCE-AND-PRESELL-023','WO-20260830-LOCAL-FRANKLIN-R24-LIVE-PAID-MEMBERSHIP-ACTIVATION-024','WO-20260831-LOCAL-FRANKLIN-R26-RUNTIME-DEPLOY-AND-LIVE-PAYMENT-CUTOVER-025'],
            repository:'neutralboardroom/franklin-navigator',branch:'franklin-commerce-runtime',commit:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),tree:cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),
            runtime:'Node 22',databaseProof:'PostgreSQL 18 service container',schemaSha256:crypto.createHash('sha256').update(fs.readFileSync('schema/001_init.sql')).digest('hex'),
            tableCount:14,tables:fs.readFileSync('/tmp/franklin-commerce-tables.txt','utf8').trim().split(/\n+/),
            exact84Mapping:'PASS',enterpriseQuoteOnlyNegativeTest:'PASS',strictFranklinIsolation:'PASS',unitLifecycleTests:'PASS',restartPersistence:'PASS',eventLedgerIdempotency:'PASS',commerceEnabled:false,checkoutWithoutActivation:'FAIL_CLOSED_423_PASS',
            stripeChargeCreated:false,liveCheckoutActivated:false,authorityTransfer:false
          };
          fs.writeFileSync('/tmp/franklin-commerce-proof/FRANKLIN_COMMERCE_PERSISTENT_PROOF_RECEIPT.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          tar -C /tmp/franklin-commerce-proof -czf /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.tar.gz .
          sha256sum /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.tar.gz > /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.sha256

      - name: Upload persistent runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: franklin-commerce-runtime-persistent-proof
          path: |
            /tmp/franklin-commerce-proof
            /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.tar.gz
            /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.sha256
          if-no-files-found: error
          retention-days: 30
