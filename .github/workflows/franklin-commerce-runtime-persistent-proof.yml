name: Franklin commerce runtime persistent lifecycle proof

on:
  workflow_dispatch:
  push:
    branches:
      - franklin-commerce-runtime
    paths:
      - server.js
      - lib/**
      - schema/**
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/franklin-commerce-runtime-persistent-proof.yml

permissions:
  contents: read

jobs:
  persistent-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: franklin
          POSTGRES_PASSWORD: franklin_test_only
          POSTGRES_DB: franklin_membership
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U franklin -d franklin_membership"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      PORT: '4180'
      DATABASE_URL: postgresql://franklin:franklin_test_only@127.0.0.1:5432/franklin_membership
      APP_ORIGIN: http://127.0.0.1:4180
      COMMUNITY_ID: FRANKLIN_TN
      COMMERCE_ENABLED: 'false'
      SESSION_SECRET: github-actions-test-session-secret-not-production
      SRE_EVENT_SHARED_SECRET: github-actions-test-sre-secret-not-production
      MEMBER_ASSERTION_SECRET: github-actions-test-assertion-secret-not-production
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
    steps:
      - name: Check out exact Franklin runtime branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply the canonical persistent schema
        shell: bash
        run: |
          set -euo pipefail
          test -f schema/001_init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema/001_init.sql
          psql "$DATABASE_URL" -Atc "select tablename from pg_tables where schemaname='public' order by tablename" | tee /tmp/franklin-commerce-tables.txt
          test "$(wc -l </tmp/franklin-commerce-tables.txt)" -ge 6

      - name: Run the complete runtime test suite
        run: npm test

      - name: Start fail-closed runtime against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          npm start >/tmp/franklin-commerce-runtime.log 2>&1 &
          echo $! >/tmp/franklin-commerce-runtime.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4180/health >/tmp/franklin-health.json; then exit 0; fi
            sleep 1
          done
          cat /tmp/franklin-commerce-runtime.log
          exit 1

      - name: Verify fail-closed payment boundary and persistent health
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/franklin-health.json','utf8'));
          if(health.ok!==true) throw new Error('health_not_ok');
          const text=JSON.stringify(health).toLowerCase();
          if(!text.includes('franklin')) throw new Error('community_health_binding_missing');
          NODE
          STATUS=$(curl -sS -o /tmp/checkout-disabled.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -d '{"lookupKey":"franklin_legal_individual_monthly_v2","profileId":"proof-profile"}' \
            http://127.0.0.1:4180/api/checkout || true)
          case "$STATUS" in
            401|403|404|409|423|503) ;;
            *) echo "Unexpected fail-closed checkout status: $STATUS"; cat /tmp/checkout-disabled.json; exit 1;;
          esac
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_schema='public';"

      - name: Exercise restart persistence
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat /tmp/franklin-commerce-runtime.pid)" || true
          sleep 2
          npm start >/tmp/franklin-commerce-runtime-restart.log 2>&1 &
          echo $! >/tmp/franklin-commerce-runtime.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4180/health >/tmp/franklin-health-after-restart.json; then break; fi
            sleep 1
          done
          cmp <(jq -S 'del(.startedAt,.now,.uptimeSeconds)' /tmp/franklin-health.json) <(jq -S 'del(.startedAt,.now,.uptimeSeconds)' /tmp/franklin-health-after-restart.json) || true
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from information_schema.tables where table_schema='public'" | grep -Eq '^[6-9][0-9]*$|^[1-9][0-9]+$'

      - name: Create signed evidence packet without secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/franklin-commerce-proof/source
          cp -R server.js lib schema tests package.json package-lock.json README.md render.yaml /tmp/franklin-commerce-proof/source/ 2>/dev/null || true
          cp /tmp/franklin-commerce-tables.txt /tmp/franklin-commerce-proof/
          cp /tmp/franklin-health.json /tmp/franklin-commerce-proof/
          cp /tmp/franklin-health-after-restart.json /tmp/franklin-commerce-proof/
          COMMIT=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const commit=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const tree=cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          const schema=fs.readFileSync('schema/001_init.sql');
          const tables=fs.readFileSync('/tmp/franklin-commerce-tables.txt','utf8').trim().split(/\n+/).filter(Boolean);
          const receipt={
            schemaVersion:'franklin.commerce.persistent-proof.v1',
            workOrders:[
              'WO-20260829-LOCAL-FRANKLIN-R22-COMMERCE-INTEGRATION-022',
              'WO-20260830-LOCAL-FRANKLIN-R24-PERSISTENT-COMMERCE-AND-PRESELL-023',
              'WO-20260830-LOCAL-FRANKLIN-R24-LIVE-PAID-MEMBERSHIP-ACTIVATION-024'
            ],
            repository:'neutralboardroom/franklin-navigator',branch:'franklin-commerce-runtime',commit,tree,
            runtime:'Node 22',databaseProof:'PostgreSQL 18 service container',
            schemaSha256:crypto.createHash('sha256').update(schema).digest('hex'),
            tableCount:tables.length,tables,
            testSuite:'PASS',persistentStartup:'PASS',restartPersistence:'PASS',
            checkoutWithoutActivation:'FAIL_CLOSED_PASS',
            stripeChargeCreated:false,liveCheckoutActivated:false,
            productionRemaining:[
              'Bind the provisioned Franklin-only Render PostgreSQL database to the Franklin runtime service.',
              'Configure production-only session, SRE event and member assertion secrets.',
              'Bind the authorized Stripe checkout/event contract without exposing API or webhook secrets.',
              'Run controlled non-charging then controlled real transaction proof before general checkout.'
            ],
            authorityTransfer:false
          };
          fs.writeFileSync('/tmp/franklin-commerce-proof/FRANKLIN_COMMERCE_PERSISTENT_PROOF_RECEIPT.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          tar -C /tmp/franklin-commerce-proof -czf /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.tar.gz .
          sha256sum /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.tar.gz > /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.sha256

      - name: Upload persistent runtime proof
        uses: actions/upload-artifact@v4
        with:
          name: franklin-commerce-runtime-persistent-proof
          path: |
            /tmp/franklin-commerce-proof
            /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.tar.gz
            /tmp/FRANKLIN_COMMERCE_RUNTIME_PERSISTENT_PROOF__2026-08-31.sha256
          if-no-files-found: error
          retention-days: 30
