name: R1363 color metadata fix

on:
  push:
    branches: [r1363-release-seal-20261004]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Add explicit inherited color-system metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          color={
            'asset':'/assets/r1336-color-system.css',
            'loader':'/assets/hf36.js',
            'primary':'FRANKLIN_TEAL',
            'randomDecorativeColoring':False,
            'darkSemanticSurfaceReadabilityGuard':True,
            'inheritedFrom':'R1362',
            'inheritedWithoutVisualChange':True
          }
          p=Path('PRODUCTION_RELEASE.json')
          d=json.loads(p.read_text())
          assert d['release']=='FR-NAV1.30.63-HF3.13.45'
          assert d['r1363']['publicDesignChanged'] is False
          d['r1363']['colorSystem']=color
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          r=Path('R1363_RELEASE_RECEIPT.json')
          x=json.loads(r.read_text())
          x['colorSystem']=color
          r.write_text(json.dumps(x,indent=2)+'\n')
          PY
          python -m json.tool PRODUCTION_RELEASE.json >/dev/null
          python -m json.tool R1363_RELEASE_RECEIPT.json >/dev/null
      - name: Commit correction and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/r1363-color-metadata-fix.yml
          git config user.name "neutralboardroom"
          git config user.email "reachrgnow@gmail.com"
          git add -A
          git commit -m "R1363: attest inherited Franklin color system explicitly"
          git push origin HEAD:r1363-release-seal-20261004
