name: Verify Franklin R17 bare cache

on:
  push:
    branches:
      - r17-production-stage
    paths:
      - .github/workflows/verify-r17-bare-cache.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare bare and cache-busted canonical responses
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          curl --fail --silent --show-error --location https://franklinnavigator.com/ -D /tmp/bare.headers -o /tmp/bare.html
          curl --fail --silent --show-error --location "https://franklinnavigator.com/?verify=${stamp}" -D /tmp/bust.headers -o /tmp/bust.html
          curl --fail --silent --show-error --location https://franklin-navigator.onrender.com/ -D /tmp/render.headers -o /tmp/render.html
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/neutralboardroom/franklin-navigator/main/dist/index.html?${stamp}" -o /tmp/github.html
          echo '--- SHA256 ---'
          sha256sum /tmp/github.html /tmp/bare.html /tmp/bust.html /tmp/render.html
          echo '--- MATCHES ---'
          cmp -s /tmp/github.html /tmp/bare.html && echo 'GITHUB_BARE=MATCH' || echo 'GITHUB_BARE=MISMATCH'
          cmp -s /tmp/github.html /tmp/bust.html && echo 'GITHUB_BUST=MATCH' || echo 'GITHUB_BUST=MISMATCH'
          cmp -s /tmp/github.html /tmp/render.html && echo 'GITHUB_RENDER=MATCH' || echo 'GITHUB_RENDER=MISMATCH'
          echo '--- BARE SIGNATURES ---'
          grep -q '>For Business<' /tmp/bare.html && echo 'R17_FOR_BUSINESS=YES' || echo 'R17_FOR_BUSINESS=NO'
          grep -q '>Business Growth<' /tmp/bare.html && echo 'R17_BUSINESS_GROWTH=YES' || echo 'R17_BUSINESS_GROWTH=NO'
          grep -q '<strong>Sources shown</strong>' /tmp/bare.html && echo 'R17_SOURCES_SHOWN=YES' || echo 'R17_SOURCES_SHOWN=NO'
          grep -q '>Preparation Studio<' /tmp/bare.html && echo 'R16_PREPARATION_STUDIO_NAV=YES' || echo 'R16_PREPARATION_STUDIO_NAV=NO'
          echo '--- BARE HEADERS ---'
          cat /tmp/bare.headers
          echo '--- BUST HEADERS ---'
          cat /tmp/bust.headers
