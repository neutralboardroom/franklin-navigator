name: HF3.3 inspect public profile entitlement route
on:
  push:
    branches: [hf33-membership-public-profile-20260911]
    paths: ['.github/workflows/hf33-inspect-public-profile.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hf33-membership-public-profile-20260911
      - name: Show public profile route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('server.js').read_text()
          needles=['/api/member/public-profile','public-profile','publication','accessAllowed']
          for needle in needles:
              print('\n===', needle, '===')
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-1800):min(len(s),i+4200)])
                  start=i+len(needle)
          PY
