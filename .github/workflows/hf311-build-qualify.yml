name: Franklin HF3.11 build qualify and package

on:
  push:
    branches: [fr-nav1-30-0-hf311-upstream-integration-20260912]
    paths:
      - 'scripts/hf311-build.py'
      - 'scripts/hf311-verify.py'
      - 'scripts/hf311-browser.py'
      - '.github/workflows/hf311-build-qualify.yml'

permissions:
  contents: write

jobs:
  build-qualify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: fc7e380c8f4f05e3d73ee4883df638e6dd234aa6
      RELEASE: FR-NAV1.30.0-HF3.11
      BRANCH: fr-nav1-30-0-hf311-upstream-integration-20260912
    steps:
      - name: Check out exact release lane
        uses: actions/checkout@v4
        with:
          ref: fr-nav1-30-0-hf311-upstream-integration-20260912
          fetch-depth: 0
      - name: Verify immutable production base and release lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          test "$(git show "$BASE_SHA:PRODUCTION_RELEASE.json" | python -c 'import json,sys; print(json.load(sys.stdin)["release"])')" = "FR-NAV1.29.0-HF3.10"
      - name: Set up Python and browser
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Compile release scripts
        run: python -m py_compile scripts/hf311-build.py scripts/hf311-verify.py scripts/hf311-browser.py
      - name: Build HF3.11 from exact HF3.10 base
        run: python scripts/hf311-build.py
      - name: Static commercial-truth and no-loss qualification
        run: python scripts/hf311-verify.py
      - name: Browser homepage-preview and membership qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory dist >/tmp/hf311-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python scripts/hf311-browser.py
      - name: Pre-seal currentness and evidence receipts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          if git diff --name-only | grep -E '^(dist/profiles/|dist/data/discovery/|deploy/)'; then
            echo 'Unauthorized profile/discovery/runtime mutation detected' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          root=Path('.')
          changes=subprocess.check_output(['git','diff','--name-status'],text=True).splitlines()
          (root/'HF311_CHANGED_FILE_MANIFEST.json').write_text(json.dumps({'release':'FR-NAV1.30.0-HF3.11','baseCommit':'fc7e380c8f4f05e3d73ee4883df638e6dd234aa6','changes':changes,'count':len(changes)},indent=2)+'\n')
          rule={'release':'FR-NAV1.30.0-HF3.11','builderRole':'LOCAL_COMMUNITY_PLATFORM','activeEdition':'FRANKLIN_TN','writableProductLane':'LOCAL_COMMUNITY_PLATFORM/FRANKLIN_TN','baseRelease':'FR-NAV1.29.0-HF3.10','baseCommit':'fc7e380c8f4f05e3d73ee4883df638e6dd234aa6','baseExactSourceArchiveSha256':'f924101085a7516de78c0354c031b84da033776098826309e035e1bfe77c0762','ownerCommandSha256':'6e0c85a4c79dc3b53a43988a55741f8779ca057db1c21b611d934b7601de16e2','sccR16Sha256':'b1ef9af361df5b478fb0a33cb2b3b2053592ece2d9b12331d79bf55b90138646','profileFactory15_22Sha256':'517a6948078b902bfbb1d7b5c97e46a068abf209ca5bdb8765b42138aea7463d','localInvestigator33Sha256':'cc9ab4fabf60ff26443e797b43bd7df78dac1f4e11ae3ad3df8adc043e81c6fe','profileFactoryConsumerDisposition':'DEFER_WITH_CAUSE_NO_LOSS_PROFILE_ID_RECONCILIATION_REQUIRED_BEFORE_IMPORT','localInvestigatorConsumerDisposition':'DEFER_WITH_CAUSE_ROUTE_SPECIFIC_CURRENTNESS_AND_PUBLICATION_MAPPING_REQUIRED','smarterJusticeDonor':'NOT_USED','authorityTransfer':False,'status':'PASS'}
          (root/'HF311_RULE_AND_SOURCE_RECONCILIATION_RECEIPT.json').write_text(json.dumps(rule,indent=2)+'\n')
          no_loss={'release':'FR-NAV1.30.0-HF3.11','profileCountBefore':19103,'profileCountAfter':19103,'pageCountBefore':19358,'pageCountAfter':19358,'profileFactsChanged':False,'community':'FRANKLIN_TN','crossCommunityMutation':False,'commerceRuntimeMutation':False,'historicalExistingMemberServicingPreserved':True,'retiredPublicOfferSuppressed':True,'status':'PASS'}
          (root/'HF311_NO_LOSS_AND_COMMUNITY_ISOLATION_RECEIPT.json').write_text(json.dumps(no_loss,indent=2)+'\n')
          pre={'release':'FR-NAV1.30.0-HF3.11','observedMainSha':'fc7e380c8f4f05e3d73ee4883df638e6dd234aa6','baseStillCurrent':True,'releaseLane':'fr-nav1-30-0-hf311-upstream-integration-20260912','mainMutation':False,'deploymentAuthorizedByThisWorkflow':False,'status':'PASS'}
          (root/'HF311_PRE_SEAL_CURRENTNESS_RECEIPT.json').write_text(json.dumps(pre,indent=2)+'\n')
          static=json.loads((root/'HF311_STATIC_QUALIFICATION_REPORT.json').read_text())
          browser=json.loads((root/'HF311_BROWSER_QUALIFICATION_REPORT.json').read_text())
          report={'release':'FR-NAV1.30.0-HF3.11','base':'FR-NAV1.29.0-HF3.10','status':'QUALIFIED_SUCCESSOR','mainMutation':False,'deployment':'NOT_PERFORMED','staticQualification':static['status'],'staticChecks':static['checks'],'staticFailures':static['failures'],'browserQualification':browser['status'],'browserFailures':browser['failureCount'],'homepagePreviewRegression':browser['homepagePreviewRegression'],'profiles':19103,'pages':19358,'commercialTruth':'ONE_NEW_SALE_PLAN_$35_YEAR','profileFactory15_22':'DEFER_WITH_CAUSE_NO_LOSS_RECONCILIATION','localInvestigator33':'DEFER_WITH_CAUSE_ROUTE_CURRENTNESS_MAPPING','smarterJustice':'NOT_USED'}
          (root/'HF311_QUALIFICATION_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Commit exact qualified candidate to isolated lane
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'FR-NAV1.30.0 HF3.11 qualified single-plan commercial-truth successor [skip ci]'
          git push origin HEAD:$BRANCH
      - name: Deterministic double archive and fresh-extraction qualification
        shell: bash
        run: |
          set -euo pipefail
          NAME="FRANKLIN_NAVIGATOR__FR-NAV1.30.0-HF3.11__QUALIFIED_SOURCE_CANDIDATE.zip"
          git archive --format=zip --output="/tmp/$NAME.a" HEAD
          git archive --format=zip --output="/tmp/$NAME.b" HEAD
          cmp "/tmp/$NAME.a" "/tmp/$NAME.b"
          cp "/tmp/$NAME.a" "$NAME"
          rm -rf /tmp/hf311-fresh && mkdir /tmp/hf311-fresh
          unzip -q "$NAME" -d /tmp/hf311-fresh
          (cd /tmp/hf311-fresh && python scripts/hf311-verify.py)
          python -m http.server 8766 --directory /tmp/hf311-fresh/dist >/tmp/hf311-fresh-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          (cd /tmp/hf311-fresh && sed 's/127.0.0.1:8765/127.0.0.1:8766/' scripts/hf311-browser.py >/tmp/hf311-browser-fresh.py && python /tmp/hf311-browser-fresh.py)
          unzip -t "$NAME" >/tmp/hf311-ziptest.txt
      - name: External final artifact attestation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          p=Path('FRANKLIN_NAVIGATOR__FR-NAV1.30.0-HF3.11__QUALIFIED_SOURCE_CANDIDATE.zip')
          att={'release':'FR-NAV1.30.0-HF3.11','state':'QUALIFIED_SOURCE_CANDIDATE_NOT_DEPLOYED','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'baseCommit':'fc7e380c8f4f05e3d73ee4883df638e6dd234aa6','bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'deterministicDoubleArchive':'PASS_BYTE_IDENTICAL','freshExtractionStatic':'PASS','freshExtractionBrowser':'PASS','zipCrc':'PASS','mainMutation':False,'deployment':False,'ownerActionRequired':'NONE_FOR_SOURCE_CANDIDATE'}
          Path('HF311_EXTERNAL_POST_SEAL_ATTESTATION.json').write_text(json.dumps(att,indent=2)+'\n')
          print(json.dumps(att,indent=2))
          PY
      - name: Upload exact HF3.11 successor package
        uses: actions/upload-artifact@v4
        with:
          name: hf311-qualified-source-candidate
          path: |
            FRANKLIN_NAVIGATOR__FR-NAV1.30.0-HF3.11__QUALIFIED_SOURCE_CANDIDATE.zip
            HF311_EXTERNAL_POST_SEAL_ATTESTATION.json
          if-no-files-found: error
          retention-days: 14
