name: Final Franklin Navigator R25 verified promotion

on:
  workflow_dispatch:
  push:
    branches:
      - r25-clean-build
    paths:
      - .github/workflows/build-r25-final.yml
      - scripts/build-r25.mjs
      - scripts/verify-r25.mjs

permissions:
  contents: write

concurrency:
  group: franklin-r25-final-promotion
  cancel-in-progress: false

jobs:
  verify-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated R25 builder
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Verify clean predecessor and build R25
        shell: bash
        run: |
          set -euo pipefail
          BASE='cc8620072ba5d774cb505f236f0c98c6f29b7754'
          EXPECTED_TREE='99d8e81c6bd4a8e55e9b6e6c338dc6f49ef112dc'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$EXPECTED_TREE"
          node scripts/build-r25.mjs
          node scripts/verify-r25.mjs

      - name: Seal exact package and create clean production commit
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='FRANKLIN_NAVIGATOR__R25__COMPLETE_SITE_AUDIT_REMEDIATION__RESPONSIVE_NAV__SEO__ACCESSIBILITY__PERFORMANCE__19103_PROFILES__COMMERCE_FAIL_CLOSED__2026-08-31.zip'
          rm -rf /tmp/franklin-r25-product /tmp/franklin-r25-evidence
          mkdir -p /tmp/franklin-r25-product /tmp/franklin-r25-evidence
          cp -a dist PRODUCTION_RELEASE.json README.md render.yaml /tmp/franklin-r25-product/
          cp -a audit-output/. /tmp/franklin-r25-evidence/
          (cd /tmp/franklin-r25-product && zip -q -r "/tmp/$PACKAGE" .)
          PACKAGE_SHA="$(sha256sum "/tmp/$PACKAGE" | cut -d' ' -f1)"
          PACKAGE_BYTES="$(stat -c%s "/tmp/$PACKAGE")"
          printf '%s  %s\n' "$PACKAGE_SHA" "$PACKAGE" > /tmp/franklin-r25-package.sha256

          git checkout -B r25-production-stage
          rm -rf .github scripts audit-output artifacts .r25-builder
          test "$(find . -mindepth 1 -maxdepth 1 ! -name .git | wc -l)" -eq 4
          test "$(find dist -type f -name '*.html' | wc -l)" -eq 19276
          test "$(find dist/profiles -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)" -eq 19103
          grep -q 'FR-NAV0.10.0-CANDIDATE-R25' PRODUCTION_RELEASE.json
          grep -q 'FR-NAV0.10.0-CANDIDATE-R25' dist/release-identity.json
          grep -q '"paidCommerceActive": false' PRODUCTION_RELEASE.json
          grep -q 'R25 site-wide experience layer' dist/assets/r25.css
          grep -q 'r25-menu-toggle' dist/assets/r25.js

          git config user.name 'Franklin Navigator Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Promote Franklin Navigator R25 verified production tree'
          PRODUCTION_COMMIT="$(git rev-parse HEAD)"
          PRODUCTION_TREE="$(git rev-parse HEAD^{tree})"
          git push --force origin HEAD:r25-production-stage
          git push --force origin HEAD:main

          cat > /tmp/franklin-r25-evidence/R25_PRODUCTION_PROMOTION_RECEIPT.json <<JSON
          {
            "schemaVersion": "franklin.r25.production-promotion-receipt.v2",
            "release": "FR-NAV0.10.0-CANDIDATE-R25",
            "exactPredecessorCommit": "cc8620072ba5d774cb505f236f0c98c6f29b7754",
            "exactPredecessorTree": "99d8e81c6bd4a8e55e9b6e6c338dc6f49ef112dc",
            "productionCommit": "$PRODUCTION_COMMIT",
            "productionTree": "$PRODUCTION_TREE",
            "packageFileName": "$PACKAGE",
            "packageBytes": $PACKAGE_BYTES,
            "packageSha256": "$PACKAGE_SHA",
            "htmlPages": 19276,
            "profiles": 19103,
            "sitemapRoutes": 19274,
            "paidCommerceActive": false,
            "productionEntitlementPersistence": false,
            "authorityTransfer": false
          }
          JSON

      - name: Upload exact R25 product and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: franklin-navigator-r25-final-production
          path: |
            /tmp/FRANKLIN_NAVIGATOR__R25__COMPLETE_SITE_AUDIT_REMEDIATION__RESPONSIVE_NAV__SEO__ACCESSIBILITY__PERFORMANCE__19103_PROFILES__COMMERCE_FAIL_CLOSED__2026-08-31.zip
            /tmp/franklin-r25-package.sha256
            /tmp/franklin-r25-evidence/
          if-no-files-found: error
          retention-days: 14
