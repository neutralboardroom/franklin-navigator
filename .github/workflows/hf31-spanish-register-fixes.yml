name: HF31 Spanish final formal-register fixes
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - .github/workflows/hf31-spanish-register-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply precise Spanish formal-register corrections and require clean result
        run: python3 scripts/hf31-spanish-register-fixes.py
      - name: Persist Spanish corrections and review receipt
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist/es evidence/hf31/SPANISH_REGISTER_FINAL_REVIEW.json
          if git diff --cached --quiet; then
            echo 'Spanish register already clean'
          else
            git commit -m 'Finish Spanish formal-register cleanup [skip ci]'
            git push origin HEAD:hf31-profile-currentness-polish-20260910
          fi
