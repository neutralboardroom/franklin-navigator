name: Preserve exact Franklin checkout continuation source
on:
  push:
    branches: [franklin-checkout-safety-hf1]
    paths: ['.github/workflows/takeover-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export tracked source only, without credentials or deployment
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          git archive --format=zip --output=FRANKLIN_CHECKOUT_CONTINUATION_SOURCE.zip HEAD
          sha256sum FRANKLIN_CHECKOUT_CONTINUATION_SOURCE.zip > SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: franklin-checkout-continuation-source
          path: |
            FRANKLIN_CHECKOUT_CONTINUATION_SOURCE.zip
            SOURCE_COMMIT.txt
            SOURCE_SHA256.txt
          retention-days: 30
