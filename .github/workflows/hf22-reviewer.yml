name: HF22 reviewer email-proof qualification
on:
  push:
    branches: [local-franklin-hf22-assistant-20260907]
    paths: [hf22-reviewer/**, .github/workflows/hf22-reviewer.yml]
permissions:
  contents: write
concurrency:
  group: franklin-hf22-reviewer-source
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: franklin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d franklin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture:isolated_test_only@127.0.0.1:5432/franklin_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e975b9541e7c98c75a93a02513a5ec97cb09d3e9
          path: candidate/runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify and apply exact source correction
        run: |
          python - <<'PY'
          import pathlib,lzma,json,hashlib
          sha=lambda b:hashlib.sha256(b).hexdigest()
          base=pathlib.Path('candidate/runtime').resolve()
          # Deploy components exclude test fixtures. Restore only hash-pinned test
          # files from the earlier frozen source transport, never production data.
          restored={}
          for folder,count,digest in [('hf2-transfer',3,'a43b30c946ba37ecb9d4aff1cb1284a9dd15d82c7851731a85db22846fb215fd'),('hf21-transfer',2,'48ec9f2f927f1fc5293b123a735f3e577c443e8574b7bc3425fd1c1f872bcbb5')]:
            raw0=b''.join((pathlib.Path('transport')/folder/f'source.part{i:02d}').read_bytes() for i in range(1,count+1))
            assert sha(raw0)==digest
            for name,obj in json.loads(lzma.decompress(raw0))['files'].items():
              if not name.startswith('runtime/acceptance/') or 'text' not in obj:continue
              p=(base/name[len('runtime/'):]).resolve();assert p.is_relative_to(base)
              text=obj['text'];assert sha(text.encode())==obj['sha256']
              if p.exists():assert sha(p.read_bytes())==obj['sha256']
              else:p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
              restored[name]=obj['sha256']
          raw=pathlib.Path('transport/hf22-reviewer/reviewer.delta.xz').read_bytes()
          assert sha(raw)=='c7e98a9d9f648a5b129a1d1873d7bbcb1782955dc806045c496257a071ecf387'
          d=json.loads(lzma.decompress(raw));assert d['baseRuntime']=='e975b9541e7c98c75a93a02513a5ec97cb09d3e9'
          for n,o in d['files'].items():
            p=(base/n).resolve();assert p.is_relative_to(base) and not p.is_symlink()
            if 'replacements' in o:
              src=base/o.get('deriveFrom',n);assert sha(src.read_bytes())==o['baseSha256'],n
              if 'deriveFrom' in o:assert not p.exists()
              t=src.read_text()
              for a,b,c in reversed(o['replacements']):t=t[:a]+c+t[b:]
            else:
              assert not p.exists();t=o['text']
            assert sha(t.encode())==o['sha256'],n;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(t)
          v=pathlib.Path('candidate/validation');v.mkdir(exist_ok=True)
          for n,o in d['tests'].items():assert sha(o['text'].encode())==o['sha256'];(v/n).write_text(o['text'])
          ev=pathlib.Path('candidate/evidence');ev.mkdir(exist_ok=True)
          (ev/'SOURCE.json').write_text(json.dumps({'base':d['baseRuntime'],'deltaSha256':sha(raw),'files':{n:sha((base/n).read_bytes()) for n in d['files']},'restoredFrozenTestFiles':restored,'productionMutations':0},indent=2))
          PY
      - name: Install locked dependencies
        working-directory: candidate/runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and reviewer database regression
        working-directory: candidate/runtime
        run: |
          set -euo pipefail
          node --test | tee ../evidence/HF22_UNITS.tap
          export TEST_REPORT_DIR="$GITHUB_WORKSPACE/candidate/evidence/http"
          node acceptance/owner-review-setup.integration.cjs
          # Full Library-source member (36) and checkout (23) suites are run on
          # actual isolated Local PostgreSQL, not claimed as extra CI executions.
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real browser email confirmation and full review workflow
        run: |
          export CHROMIUM_PATH=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          export TEST_REPORT_DIR="$GITHUB_WORKSPACE/candidate/evidence/browser"
          python candidate/validation/browser_owner_review.py
      - name: Prepare exact runtime component without production promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,json,urllib.request,os,zipfile
          root=pathlib.Path('candidate/runtime');repo='neutralboardroom/franklin-navigator';base='e975b9541e7c98c75a93a02513a5ec97cb09d3e9'
          def api(p,d=None):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+p,data=json.dumps(d).encode() if d else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==base,'New runtime base; do not overwrite'
          d=json.loads(pathlib.Path('candidate/evidence/SOURCE.json').read_text());m=json.loads((root/'PRODUCTION_RELEASE.json').read_text());m.update({'release':'FR-NAV1.15.0-HF2.2-CANDIDATE','parent':base,'reviewerEmailConfirmation':d,'commerceOpenedByBuild':False,'ownerVerifiedByBuild':False});(root/'PRODUCTION_RELEASE.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          entries=[{'path':n,'mode':'100644','type':'blob','content':(root/n).read_text()} for n in list(d['files'])+['PRODUCTION_RELEASE.json']]
          tree=api('/git/trees',{'base_tree':api('/git/commits/'+base)['tree']['sha'],'tree':entries})['sha']
          commit=api('/git/commits',{'message':'Provide one-time reviewer email confirmation with existing password, durable proof and no payment or profile mutation [skip ci]','tree':tree,'parents':[base]})['sha']
          ref='refs/heads/local-franklin-hf22-reviewer-qualified-20260907';api('/git/refs',{'ref':ref,'sha':commit})
          pathlib.Path('candidate/evidence/PREPARED_RUNTIME.json').write_text(json.dumps({'commit':commit,'tree':tree,'parent':base,'branch':ref,'productionPromotion':False},indent=2))
          with zipfile.ZipFile('candidate/evidence/RUNTIME_COMPONENT_SOURCE.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(root.rglob('*')):
              n=p.relative_to(root)
              if p.is_file() and not any(x in ['.git','node_modules','evidence'] for x in n.parts):z.write(p,n.as_posix())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf22-reviewer-source-and-browser
          path: candidate/evidence/
          retention-days: 14
          if-no-files-found: error
