name: HF31 public language final audit
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - scripts/hf31-public-language-finalize.py
      - .github/workflows/hf31-public-language-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final user-facing language cleanup and scan
        run: python3 scripts/hf31-public-language-finalize.py
      - name: Commit cleanup and final report
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist evidence/hf31/PUBLIC_LANGUAGE_FINAL_REPORT.json
          if git diff --cached --quiet; then
            echo 'No additional public-language changes'
          else
            git commit -m 'Finish deep-page public-language cleanup [skip ci]'
            git push origin HEAD:hf31-profile-currentness-polish-20260910
          fi
