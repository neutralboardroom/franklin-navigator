          import json,hashlib
          a=json.loads(Path('RELEASE_ATTESTATION.json').read_text());b=Path(a['artifact']).read_bytes();assert len(b)==a['bytes'] and hashlib.sha256(b).hexdigest()==a['sha256'];a.update({'freshExtractionValidator':'PASS','freshExtractionRuntimeTests':'PASS','freshExtractionBrowserTests':'PASS'});Path('RELEASE_ATTESTATION.json').write_text(json.dumps(a,indent=2)+'\n');print(json.dumps(a))
