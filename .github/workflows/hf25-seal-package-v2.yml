          from pathlib import Path
          import shutil,json,hashlib,datetime,subprocess
          stage=Path('stage');shutil.rmtree(stage,ignore_errors=True)
          for d in ['public','runtime','evidence']:(stage/d).mkdir(parents=True,exist_ok=True)
          def cp(src,dst):
