      - name: Write package validator and full self-excluding manifest
        run: |
          cat > stage/VALIDATE_RELEASE.py <<'PY'
          from pathlib import Path
          import json,hashlib,re,sys
          root=Path(sys.argv[1] if len(sys.argv)>1 else '.').resolve();m=json.loads((root/'CONTENT_MANIFEST.json').read_text());entries=m['members'];actual=set()
          for p in root.rglob('*'):
            if p.is_symlink():raise SystemExit('symlink:'+str(p))
            if p.is_file():
              rel=p.relative_to(root).as_posix()
              if rel=='CONTENT_MANIFEST.json':continue
              if rel.lower().endswith(('.zip','.tar','.tgz','.gz','.7z','.rar')):raise SystemExit('nested archive:'+rel)
              actual.add(rel)
          if actual!=set(entries):raise SystemExit('manifest member mismatch')
          for rel,meta in entries.items():
            b=(root/rel).read_bytes()
            if len(b)!=meta['bytes'] or hashlib.sha256(b).hexdigest()!=meta['sha256']:raise SystemExit('hash mismatch:'+rel)
          profiles=list((root/'public/dist/profiles').rglob('index.html'));assert len(profiles)==19103
          receipt=json.loads((root/'evidence/RELEASE_RECEIPT.json').read_text());assert receipt['publicCommit']=='01aecafbfe16202d9d5a80eb6b97443c9ee305ad' and receipt['runtimeCommit']=='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8' and receipt['checkoutState']=='OPEN'
          banned=['new public membership checkout is closed','new public membership checkout remains closed','new public checkout is currently closed','new public checkout remains closed','membership checkout is not open yet','membership enrollment is currently closed','membership enrollment and payment are not open yet','paid business membership is not open yet','while enrollment remains closed','before checkout is available','membership comes later','before new checkout opens:','franklin will not reopen new enrollment']
          for p in (root/'public/dist').rglob('*.html'):
            low=p.read_text(errors='ignore').lower()
            for phrase in banned:
              if phrase in low:raise SystemExit('stale public phrase:'+phrase+':'+str(p))
          js=(root/'public/dist/assets/membership-live.js').read_text();assert 'Profile verified. You can continue when checkout is available.' not in js;assert "state.ready?.liveCheckoutEnabled?'Profile verified. You can continue to membership.'" in js;assert 'MEMBERSHIP_ALREADY_ACTIVE' in js and 'CHECKOUT_PENDING_MESSAGE' in js
          for p in [root/'public/dist/assets/membership-live.js',root/'runtime/server.js']:
            t=p.read_text(errors='ignore');assert not re.search(r'\bsk_live_[A-Za-z0-9]{16,}',t);assert not re.search(r'\bwhsec_[A-Za-z0-9]{16,}',t)
          print(json.dumps({'result':'PASS','members':len(entries),'profiles':19103,'checkout':'OPEN'}))
          PY
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('stage');members={}
          for p in sorted(root.rglob('*')):
            if p.is_file() and p.name!='CONTENT_MANIFEST.json':
              b=p.read_bytes();members[p.relative_to(root).as_posix()]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          (root/'CONTENT_MANIFEST.json').write_text(json.dumps({'schemaVersion':'franklin.release-content-manifest.v1','selfHashRule':'CONTENT_MANIFEST.json excluded from its own member map; every other packaged file is covered.','memberCount':len(members),'members':members},indent=2,sort_keys=True)+'\n');print(json.dumps({'manifestMembers':len(members)}))
          PY
      - name: Build two byte-identical deterministic archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          root=Path('stage');name='FRANKLIN_NAVIGATOR__FR-NAV1.15.0-HF2.5__POST_LAUNCH_TRUTH__LIVE_VERIFIED__2026-09-08.zip'
          def build(out):
            with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                rel=p.relative_to(root).as_posix();i=zipfile.ZipInfo(rel,(1980,1,1,0,0,0));i.create_system=3;i.external_attr=(0o100644&0xffff)<<16;i.compress_type=zipfile.ZIP_DEFLATED;z.writestr(i,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          build('a.zip');build('b.zip');a=Path('a.zip').read_bytes();b=Path('b.zip').read_bytes();assert a==b;Path(name).write_bytes(a);att={'schemaVersion':'franklin.hf25.external-release-attestation.v1','artifact':name,'bytes':len(a),'sha256':hashlib.sha256(a).hexdigest(),'deterministicDoubleBuild':True};Path('RELEASE_ATTESTATION.json').write_text(json.dumps(att,indent=2)+'\n');print(json.dumps(att))
