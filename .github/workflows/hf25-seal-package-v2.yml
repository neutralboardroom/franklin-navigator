          tests={'schemaVersion':'franklin.hf25.test-summary.v1','sourceQualification':{'runId':34197442159,'profiles':'19103 preserved','runtimeTests':'20/20 PASS','changedHtmlPages':43,'browser':'602/602 PASS','staleClaims':0,'brokenInternalLinks':0},'liveQualification':{'runId':34198347410,'httpReadback':'50/50 PASS','browser':'602/602 PASS'},'liveContinuityRetry':{'runId':34198606757,'result':'PASS'},'dynamicTruth':{'runId':34204909271,'static':'PASS','browser':'16/16 PASS','openCheckoutPreserved':'PASS'},'dynamicLiveReadback':{'runId':34205357375,'result':'PASS'},'financialMutationsByTests':0};(stage/'evidence/TEST_SUMMARY.json').write_text(json.dumps(tests,indent=2)+'\n')
          receipt={'schemaVersion':'franklin.local.release-receipt.v1','status':'QUALIFIED_SUCCESSOR','release':'FR-NAV1.15.0-HF2.5','builderRole':'LOCAL_COMMUNITY_PLATFORM','activeEdition':'FRANKLIN_TN','writableProductLane':'LOCAL_COMMUNITY_EDITION:FRANKLIN_TN','ownerCommandRevision':'2026-09-03-R2','publicCommit':pub,'publicTree':subprocess.check_output(['git','-C','public-src','rev-parse','HEAD^{tree}'],text=True).strip(),'runtimeCommit':run,'runtimeTree':subprocess.check_output(['git','-C','runtime-src','rev-parse','HEAD^{tree}'],text=True).strip(),'publicDeploy':'dep-dafsgtvqj5pc7387j6v0','runtimeDeploy':'dep-dafq07on74is73b4sp00','deploymentState':'LIVE_VERIFIED','checkoutState':'OPEN','pricesUsd':[5,50,120],'profileCount':19103,'profileFactsChanged':False,'improvements':['Corrected stale pre-launch membership and checkout claims across public English and Spanish surfaces','Updated current member-capability copy while leaving genuinely planned capabilities marked planned','Corrected verified-profile dynamic message for open checkout while preserving safe closed-state fallback','Preserved open commerce, exact prices, eligibility, idempotency, no-second-charge, billing/cancellation, Assistant, reviewer tools and free corrections'],'upstreamDispositions':{'ProfileFactory':'DEFER_WITH_CAUSE','LocalInvestigatorV25':'DEFER_WITH_CAUSE','SmarterJusticeDonor':'NOT_USED'},'knownLimitation':'No fabricated eligible non-member was created solely to manufacture a live Checkout Session; first genuine eligible non-member remains external-trigger evidence.','sccAcceptanceOfThisSuccessor':'NOT_CLAIMED_BY_LOCAL','authorityTransfer':False,'generatedAtUtc':now};(stage/'evidence/RELEASE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
