name: Apply Franklin R39 readability hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply light readability and non-sticky tray hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='/* R39 live readability hotfix — owner feedback 2026-09-06 */'
          css=Path('dist/assets/styles.css')
          text=css.read_text(encoding='utf-8')
          if marker not in text:
              text += '''\n\n/* R39 live readability hotfix — owner feedback 2026-09-06 */\n:root{color-scheme:only light!important}\nhtml,body{background:#fff!important;color:#172126!important;color-scheme:only light!important}\nmain{background:#fff!important;color:#172126!important}\nheader,header .top,.r37-language-switch{background:#fff!important;color:#172126!important}\n.section{color:#172126}\n.card,.r22-card,.r22-profile-result,.r22-dashboard-card,.r22-member-preview-mini,.feature-list-card,.navigator-bot,.r37-member-step,.r37-plan,.r37-search-result,.r34-card,.r33-card,.r32-org-card{background:#fff!important;color:#172126!important}\n.section.alt,.section.tint,.r24-destinations,.r24-business-section{background:#f6faf9!important;color:#172126!important}\n.hero,.r22-hero,.r27-hero,.r34-hero,.today-hero,.my-franklin-hero,.business-dashboard-hero{color:#172126}\ninput,textarea,select{background:#fff!important;color:#172126!important}\n.button:not(.primary){background:#fff!important;color:#03454b!important}\n.r22-compare-tray,.explorer-shortlist{position:static!important;bottom:auto!important;box-shadow:none!important}\n[hidden]{display:none!important}\n'''
              css.write_text(text,encoding='utf-8')
          exp=Path('dist/assets/community-explorer.css')
          et=exp.read_text(encoding='utf-8')
          em='/* R39 live readability hotfix: shortlist remains in document flow. */'
          if em not in et:
              exp.write_text(et+'\n\n'+em+'\n.explorer-shortlist{position:static!important;bottom:auto!important;box-shadow:none!important}\n',encoding='utf-8')
          PY
      - name: Verify hotfix source rules
        shell: bash
        run: |
          grep -q 'color-scheme:only light' dist/assets/styles.css
          grep -q 'r22-compare-tray,.explorer-shortlist{position:static' dist/assets/styles.css
          grep -q 'explorer-shortlist{position:static' dist/assets/community-explorer.css
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/assets/styles.css dist/assets/community-explorer.css
          if git diff --cached --quiet; then
            echo 'Hotfix already present.'
            exit 0
          fi
          git commit -m 'Hotfix Franklin R39 live readability and bottom trays [skip ci]'
          git push origin HEAD:main
