name: Verify Franklin light readability and trays

on:
  push:
    branches: [main, franklin-r40-exact-launch-recovery-20260907]

permissions:
  contents: read

jobs:
  readability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner readability requirements without modifying source
        run: |
          python - <<'PY'
          from pathlib import Path
          styles = Path('dist/assets/styles.css').read_text()
          explorer = Path('dist/assets/community-explorer.css').read_text()
          language = Path('dist/assets/r37.css').read_text()
          assert 'color-scheme:only light!important' in styles
          assert 'r22-compare-tray,.explorer-shortlist{position:static!important' in styles
          assert '.explorer-shortlist{position:static!important' in explorer
          assert '.r37-language-switch span{display:none!important}' in language
          print('Franklin light readability, non-sticky trays and language labels PASS')
          PY
