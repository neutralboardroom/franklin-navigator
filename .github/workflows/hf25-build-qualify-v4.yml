name: HF25 final post-launch truth qualification
on:
  push:
    branches: [local-franklin-hf25-postlaunch-truth-20260908]
    paths: [.github/workflows/hf25-build-qualify-v4.yml]
permissions:
  contents: write
concurrency:
  group: franklin-hf25-final-public-truth
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9e8195d9c3939f791795ab38add326402b5d55c8
          path: candidate/public
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8
          path: candidate/runtime
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Apply exact public-truth patch with global coverage gate
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          src=pathlib.Path('transport/.github/hf25/postlaunch_truth_patch.json')
          d=json.loads(src.read_text())
          # Occurrence counts are transport sanity only. The product gate below scans the entire resulting HTML tree.
          for x in d['replacements']: x['min']=1
          tmp=pathlib.Path('/tmp/hf25-patch.json');tmp.write_text(json.dumps(d,ensure_ascii=False))
          subprocess.run([sys.executable,'transport/.github/hf25/apply_postlaunch_truth.py','candidate/public',str(tmp)],check=True)
          PY
      - name: Global public truth, no-loss, authority and link gates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          root=Path('candidate/public');dist=root/'dist';runtime=Path('candidate/runtime')
          patch=json.loads(Path('transport/.github/hf25/postlaunch_truth_patch.json').read_text())
          profiles=sorted((dist/'profiles').rglob('index.html'));assert len(profiles)==19103,len(profiles)
          diff=subprocess.check_output(['git','-C',str(root),'diff','--name-only','9e8195d9c3939f791795ab38add326402b5d55c8'],text=True).splitlines()
          assert not any(x.startswith('dist/profiles/') for x in diff),[x for x in diff if x.startswith('dist/profiles/')][:10]
          assert not any(x.startswith('data/') or x.startswith('lib/') for x in diff),[x for x in diff if x.startswith(('data/','lib/'))][:10]
          # Exact static stale-copy ban across every HTML file, not only changed pages.
          stale=[]
          banned=list(patch['bannedVisiblePhrases'])+['before new checkout opens:','paid business membership is not open yet','if membership opens, pricing will be shown clearly before any payment']
          for p in dist.rglob('*.html'):
            low=p.read_text(errors='ignore').lower()
            for phrase in banned:
              if phrase.lower() in low:stale.append((p.relative_to(dist).as_posix(),phrase))
          assert not stale,stale[:30]
          # Broader semantic prelaunch scan, with explicit allowed cases for genuinely unlaunched capabilities.
          suspect=[]
          rx=re.compile(r'(?i)(membership|checkout|enrollment|paid member access).{0,90}(closed|not open|not available yet|not active on this site|when enrollment opens|before checkout is available)')
          for p in dist.rglob('*.html'):
            text=re.sub(r'<[^>]+>',' ',p.read_text(errors='ignore'));text=re.sub(r'\s+',' ',text)
            for m in rx.finditer(text):suspect.append((p.relative_to(dist).as_posix(),m.group(0)))
          assert not suspect,suspect[:30]
          # Runtime/payment authority remains exact and unchanged.
          assert subprocess.check_output(['git','-C',str(runtime),'rev-parse','HEAD'],text=True).strip()=='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8'
          server=(runtime/'server.js').read_text();reservation=(runtime/'lib/purchase-reservations.js').read_text();catalog=(runtime/'lib/catalog.js').read_text()
          for token in ['COMMERCE_DISABLED','MEMBERSHIP_ALREADY_ACTIVE','PROFILE_VERIFICATION_REQUIRED','startSafePurchase']:
            assert token in server or token in reservation,token
          for token in ['regularUsd:5','regularUsd:50','regularUsd:120','franklin_community_member_monthly_v5','franklin_community_member_annual_v5','franklin_charter_member_36_month_v5']:
            assert token in catalog,token
          # No secrets or Smarter Justice connection in changed public product files.
          for name in diff:
            if not name.startswith('dist/'):continue
            p=root/name;t=p.read_text(errors='ignore')
            assert not re.search(r'\bsk_live_[A-Za-z0-9]{16,}',t),name
            assert not re.search(r'\bwhsec_[A-Za-z0-9]{16,}',t),name
            low=t.lower();assert 'smarterjustice.com' not in low and 'smarter-justice' not in low,name
          # Entire internal-link graph remains resolvable.
          missing=[]
          for p in dist.rglob('*.html'):
            t=p.read_text(errors='ignore')
            for href in re.findall(r'href=["\']([^"\']+)',t):
              if not href.startswith('/') or href.startswith('//'):continue
              href=href.split('#',1)[0].split('?',1)[0]
              if not href:continue
              q=dist/href.lstrip('/')
              if not (q.is_file() or (q/'index.html').is_file()):missing.append((p.relative_to(dist).as_posix(),href))
          assert not missing,missing[:30]
          report={'profilePages':19103,'changedFiles':diff,'staleStaticClaims':0,'semanticPrelaunchClaims':0,'internalBrokenLinks':0,'runtimeCommit':'44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8','prices':[5,50,120],'financialMutations':0,'profileMutations':0,'smarterJusticeDonorUsed':False}
          (root/'evidence/HF25_STATIC_NO_LOSS.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps({'profilePages':19103,'changed':len(diff),'stale':0,'brokenLinks':0}))
          PY
      - name: Full unchanged runtime regression
        working-directory: candidate/runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Render every changed public page in EN/ES on phone and desktop
        run: |
          set -euo pipefail
          python -m http.server 8876 --bind 127.0.0.1 --directory candidate/public/dist >/tmp/hf25-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,subprocess
          root=Path('candidate/public');ev=root/'evidence/hf25-browser';ev.mkdir(parents=True,exist_ok=True)
          changed=[x for x in subprocess.check_output(['git','-C',str(root),'diff','--name-only','9e8195d9c3939f791795ab38add326402b5d55c8'],text=True).splitlines() if x.startswith('dist/') and x.endswith('.html')]
          patch=json.loads(Path('transport/.github/hf25/postlaunch_truth_patch.json').read_text());banned=[x.lower() for x in patch['bannedVisiblePhrases']]+['before new checkout opens:'];new_es=patch['newSpanishTranslations'];rows=[]
          def ok(i,v,d=''):rows.append({'id':i,'pass':bool(v),'detail':d});assert v,(i,d)
          with sync_playwright() as p:
            b=p.chromium.launch()
            for rel in changed:
              route='/'+rel[5:];route=route[:-10] if route.endswith('index.html') else route
              for width in [390,1280]:
                c=b.new_context(viewport={'width':width,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));r=page.goto('http://127.0.0.1:8876'+route,wait_until='networkidle')
                body=page.locator('body').inner_text();low=body.lower();ok(f'{rel}:{width}:http',r and r.status==200);ok(f'{rel}:{width}:h1',page.locator('main h1').count()==1);ok(f'{rel}:{width}:stale',not any(x in low for x in banned));ok(f'{rel}:{width}:overflow',page.evaluate('document.documentElement.scrollWidth<=document.documentElement.clientWidth+2'));ok(f'{rel}:{width}:js',not errs,' | '.join(errs[:3]))
                if page.locator('[data-r37-lang="es"]').count():
                  page.locator('[data-r37-lang="es"]').click();page.wait_for_timeout(200);ok(f'{rel}:{width}:lang',page.locator('html').get_attribute('lang')=='es');spanish=page.locator('body').inner_text();exposed=[s for s in new_es if len(s)>28 and s in spanish];ok(f'{rel}:{width}:es-new',not exposed,str(exposed[:3]))
                c.close()
            b.close()
          report={'result':'PASS','changedHtmlPages':len(changed),'assertions':len(rows),'pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'results':rows};(ev/'BROWSER.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n');print(json.dumps({'pages':len(changed),'assertions':len(rows),'fail':report['fail']}))
          PY
      - name: Verify live commerce remains open and exact
        run: |
          python - <<'PY'
          import urllib.request,json
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Franklin-HF25-qualification/1.0','Cache-Control':'no-cache'});return json.load(urllib.request.urlopen(req,timeout=30))
          ready=get('https://franklin-navigator-membership.onrender.com/ready');catalog=get('https://franklin-navigator-membership.onrender.com/api/catalog')
          assert ready['ok'] is True and ready['database'] is True and ready['commerceEnabled'] is True and ready['liveCheckoutEnabled'] is True and ready['stripeCheckoutSessionConfigured'] is True and ready['stripeWebhookConfigured'] is True and ready['portalSessionConfigured'] is True and ready['startupError'] is None
          assert catalog['publicCheckoutOpen'] is True and [x['priceUsd'] for x in catalog['choices']]==[5,50,120]
          print(json.dumps({'commerceEnabled':True,'liveCheckoutEnabled':True,'publicCheckoutOpen':True,'prices':[5,50,120]}))
          PY
      - name: Exact-parent recheck and prepared product commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,urllib.request,os,subprocess,base64,datetime
          root=Path('candidate/public');base='9e8195d9c3939f791795ab38add326402b5d55c8';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8';repo='neutralboardroom/franklin-navigator'
          def api(path):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'});return json.load(urllib.request.urlopen(req,timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base,'public main advanced; rebase required'
          assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime,'runtime advanced; requalification required'
          diff=subprocess.check_output(['git','-C',str(root),'diff','--name-only',base],text=True).splitlines()
          def td(p):
            h=hashlib.sha256();p=Path(p)
            for f in sorted(p.rglob('*')):
              if f.is_file():h.update(f.relative_to(p).as_posix().encode()+b'\0'+hashlib.sha256(f.read_bytes()).hexdigest().encode()+b'\n')
            return h.hexdigest()
          release={'release':'FR-NAV1.15.0-HF2.5-CANDIDATE','component':'public','parent':base,'runtimePair':runtime,'publicDistSha256':td(root/'dist'),'publicDistDigestRule':'sorted path + NUL + file sha256 hex + LF','profileCount':19103,'profileFactsChanged':False,'commerceOpenedByBuild':False,'commercePreservedOpen':True,'commercialContractChanged':False,'smarterJusticeDonorUsed':False,'qualification':{'runId':int(os.environ['GITHUB_RUN_ID']),'sourceState':'PUBLIC_SOURCE_BROWSER_QUALIFIED','financialMutations':0},'changedProductFiles':diff,'rollback':{'publicCommit':base,'runtimeCommerceKillSwitch':'COMMERCE_ENABLED=false'},'generatedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (root/'PRODUCTION_RELEASE.json').write_text(json.dumps(release,indent=2,sort_keys=True)+'\n');names=sorted(set(diff+['PRODUCTION_RELEASE.json']))
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf25-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','--',*names);staged=git('diff','--cached','--name-only').splitlines();assert set(staged)==set(names);git('commit','-m','Correct Franklin post-launch membership truth across public EN/ES surfaces; preserve live checkout [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env)
          prepared={'commit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base,'runtimePair':runtime,'branch':branch,'changedFiles':names,'productionPromotion':False,'financialMutations':0};(root/'evidence/HF25_PREPARED.json').write_text(json.dumps(prepared,indent=2)+'\n');print(json.dumps(prepared))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf25-final-qualification
          path: candidate/public/evidence/
          retention-days: 14
          if-no-files-found: error
