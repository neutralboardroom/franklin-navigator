name: Franklin current-successor regression and exact-artifact qualification

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'PRODUCTION_RELEASE.json'
      - 'NEXT_VERSION_IMPROVEMENT_LIST__FR_NAV1_29_2_HF3102.md'
      - '.github/workflows/hf32-site-cleanup.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'PRODUCTION_RELEASE.json'
      - '.github/workflows/hf32-site-cleanup.yml'

permissions:
  contents: read

jobs:
  qualify-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Current release identity and profile-source contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          release_data=json.loads(Path('PRODUCTION_RELEASE.json').read_text())
          release=release_data['release']
          base=release_data.get('base','')
          page_baseline=release_data.get('unchangedPageBaseline','')
          if not release.startswith('FR-NAV1.'):
              raise SystemExit(f'unexpected current release {release}')
          core=Path('dist/assets/franklin-assistant-core.js').read_text()
          if f"const VERSION='{release}'" not in core:
              raise SystemExit('Assistant successor version does not match PRODUCTION_RELEASE')
          preview=Path('dist/member-profile-preview/index.html').read_text()
          if page_baseline and f'meta content="{page_baseline}" name="franklin-release"' not in preview:
              raise SystemExit('unchanged member preview no longer carries the declared page baseline marker')
          manifest=json.loads(Path('dist/data/discovery/manifest.json').read_text())
          idx=Path('dist')/manifest['index']['file'].lstrip('/')
          digest=hashlib.sha256(idx.read_bytes()).hexdigest()
          if digest != manifest['index']['sha256']:
              raise SystemExit('profile discovery index hash drift')
          if manifest['recordCount'] != 19103:
              raise SystemExit(f'unexpected live profile projection count {manifest["recordCount"]}')
          route_receipts=release_data.get('assistantHotfix',{}).get('verifiedRouteShards',[])
          if len(route_receipts) != 4:
              raise SystemExit('Assistant route shard receipt count drift')
          route_count=0
          for i,item in enumerate(route_receipts):
              route_path=Path('dist')/item['path'].lstrip('/')
              route_hash=hashlib.sha256(route_path.read_bytes()).hexdigest()
              route_data=json.loads(route_path.read_text())
              if route_hash != item['sha256'] or route_data.get('release') != release or route_data.get('shard') != f'{i:02d}':
                  raise SystemExit(f'Assistant route shard {i} drift')
              route_count += route_data.get('recordCount',0)
          if route_count != 254:
              raise SystemExit('Assistant route count drift')
          print(release, base, page_baseline, manifest['recordCount'], digest, route_count)
          PY

      - name: JavaScript syntax and shared route integrity
        run: |
          set -euo pipefail
          node --check dist/assets/navigator-bot.js
          node --check dist/assets/franklin-assistant-core.js
          node --check dist/assets/franklin-assistant-v2.js
          node --check dist/assets/hf36.js
          test -f dist/assets/hf3102-mobile.css
          test -f dist/data/assistant-routes-00.json
          test -f dist/data/assistant-routes-01.json
          test -f dist/data/assistant-routes-02.json
          test -f dist/data/assistant-routes-03.json
          node --check dist/assets/hf32-site-cleanup.js
          node --check dist/assets/hf27-navigation.js
          node --check dist/assets/community-explorer.js
          test -f dist/index.html
          test -f dist/assistant/index.html
          test -f dist/corrections/index.html
          test -f dist/sports/index.html
          test -f dist/today/index.html
          test -f dist/get-it-done/index.html
          test -f dist/directory/index.html
          test -f dist/community-help-center/index.html
          test -f dist/my-franklin/index.html
          test -f dist/business-dashboard/index.html
          test -f dist/member-profile-preview/index.html
          test -f dist/membership-start/index.html
          test -f dist/claim-profile/index.html

      - name: Current Franklin Assistant second-pass contract
        run: |
          set -euo pipefail
          grep -F "const ROUTE_SHARDS=[" dist/assets/franklin-assistant-core.js
          grep -F "assistant-routes-00.json','c86c5a4458943af460a8cdae0efb41eb17f4b7a23c377eedd497ca51607f3e5e" dist/assets/franklin-assistant-core.js
          grep -F "assistant-routes-03.json','a5fa101d3fc916c549782171caee2a1f7d5906c420057736725a9e10d4f8c5ab" dist/assets/franklin-assistant-core.js
          grep -F 'function rankRoutes' dist/assets/franklin-assistant-core.js
          grep -F 'function rankDirectory' dist/assets/franklin-assistant-core.js
          grep -F '/profiles/${encodeURIComponent(row.id)}/' dist/assets/franklin-assistant-v2.js
          grep -F 'A Franklin plan for the parts of your question' dist/assets/franklin-assistant-v2.js
          grep -F 'Your question stays in this browser.' dist/assets/franklin-assistant-v2.js
          grep -F 'appendLegacySave' dist/assets/franklin-assistant-v2.js
          grep -F 'franklin-assistant-core.js?v=frnav1292' dist/assets/hf36.js
          grep -F 'franklin-assistant-v2.js?v=frnav1292' dist/assets/hf36.js
          grep -F 'hf3102-mobile.css' dist/assets/hf36.js
          node - <<'NODE'
          const fs=require('fs'),A=require('./dist/assets/franklin-assistant-core.js');
          const records=[0,1,2,3].flatMap(i=>JSON.parse(fs.readFileSync(`./dist/data/assistant-routes-${String(i).padStart(2,'0')}.json`,'utf8')).records);
          if(records.length!==254)throw Error('Assistant route count drift');
          const top=q=>A.rankRoutes(records,q,'en',1)[0]?.rec?.p;
          if(!['/permits-home/','/help/home/permit-contractor/'].includes(top('I need a fence permit')))throw Error('permit routing failed');
          if(top('what is happening this weekend')!=='/today/')throw Error('event routing failed');
          if(top('where can I play pickleball')!=='/sports/pickleball/')throw Error('specific sports routing failed');
          if(top('how do I start a business')!=='/start-a-business/')throw Error('business routing failed');
          if(A.mode('I want to cancel my membership')!=='billing')throw Error('billing safety routing failed');
          const topics=A.concepts('I need help with rent and food');if(!topics.includes('housing')||!topics.includes('food-benefits'))throw Error('multi-need detection failed');
          const fake=[{name:'Berry Farms Dental',category:'dentist',type:'business',area:'Franklin',location:'4020 Hughes Crossing',phoneHref:'tel:6155551212',emailHref:'',websiteHref:'',exact:true}];
          if(A.rankDirectory(fake,'phone number for Berry Farms Dental',1)[0]?.row?.name!=='Berry Farms Dental')throw Error('named profile contact routing failed');
          console.log('Assistant second-pass behavior checks PASS');
          NODE

      - name: Current Community Membership and free-profile-control contract
        run: |
          set -euo pipefail
          grep -F 'Preview your Community Member profile.' dist/member-profile-preview/index.html
          grep -F 'Community Membership — $35/year' dist/member-profile-preview/index.html
          grep -F 'Corrections and removal stay free.' dist/member-profile-preview/index.html
          grep -F 'Correct or remove a profile' dist/member-profile-preview/index.html
          grep -F 'Ordinary Directory ranking and factual accuracy do not change' dist/member-profile-preview/index.html
          grep -F 'data-r28-preview-form' dist/member-profile-preview/index.html
          grep -F '$35' dist/membership-start/index.html
          grep -F 'year' dist/membership-start/index.html
          ! grep -E '\$5/month|\$90|\$50/year|\$120|Charter Member' dist/member-profile-preview/index.html dist/membership-start/index.html

      - name: Current business/member product contract
        run: |
          set -euo pipefail
          grep -F 'Find my profile' dist/member-profile-preview/index.html
          grep -F 'Find or manage your Franklin profile.' dist/claim-profile/index.html
          grep -F 'Search profiles' dist/claim-profile/index.html
          grep -F 'Corrections and removal are free.' dist/claim-profile/index.html
          grep -F 'Community Membership' dist/business-dashboard/index.html
          grep -F 'English' dist/member-profile-preview/index.html
          grep -F 'Español' dist/member-profile-preview/index.html
          grep -F 'English' dist/membership-start/index.html
          grep -F 'Español' dist/membership-start/index.html

      - name: Preserve current HF3.10 qualification receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['HF310_STATIC_QUALIFICATION_REPORT.json','HF310_BROWSER_QUALIFICATION_REPORT.json','HF310_QUALIFICATION_REPORT.json']:
              p=Path(name)
              if not p.exists(): raise SystemExit(f'missing {name}')
              d=json.loads(p.read_text())
              if d.get('status') not in ('PASS','QUALIFIED_SUCCESSOR'):
                  raise SystemExit(f'{name} not green: {d.get("status")}')
          q=json.loads(Path('HF310_QUALIFICATION_REPORT.json').read_text())
          if q.get('issueCount') != 0:
              raise SystemExit('HF3.10 qualification issue count is nonzero')
          PY

      - name: Build deterministic exact-source artifact and manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,subprocess
          root=Path('.')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          release=json.loads(Path('PRODUCTION_RELEASE.json').read_text())['release']
          artifact=f'FRANKLIN_NAVIGATOR__{release}__CURRENT_SUCCESSOR_EXACT_SOURCE.zip'
          manifest_name='CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json'
          attestation_name='CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json'
          exclude={artifact,manifest_name,attestation_name}
          files=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel.startswith('.git/') or rel in exclude: continue
              b=p.read_bytes()
              files.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'schema':'franklin.current-source-manifest.v1','release':release,'commit':commit,'tree':tree,'memberCount':len(files),'members':files,'selfExcluded':True}
          Path(manifest_name).write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n')
          entries=files+[{'path':manifest_name,'bytes':Path(manifest_name).stat().st_size,'sha256':hashlib.sha256(Path(manifest_name).read_bytes()).hexdigest()}]
          with zipfile.ZipFile(artifact,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for item in sorted(entries,key=lambda x:x['path']):
                  p=Path(item['path']); info=zipfile.ZipInfo(item['path'],(2026,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16
                  z.writestr(info,p.read_bytes())
          Path(attestation_name).write_text(json.dumps({'release':release,'commit':commit,'tree':tree,'artifact':artifact,'artifactBytes':Path(artifact).stat().st_size,'artifactSha256':hashlib.sha256(Path(artifact).read_bytes()).hexdigest(),'manifest':manifest_name,'manifestSha256':hashlib.sha256(Path(manifest_name).read_bytes()).hexdigest(),'zipMembers':len(entries),'profileCount':19103,'result':'PASS_EXACT_SOURCE_ARTIFACT_SEALED'},indent=2)+'\n')
          PY
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          a=json.loads(Path('CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json').read_text())
          assert hashlib.sha256(Path(a['artifact']).read_bytes()).hexdigest()==a['artifactSha256']
          with zipfile.ZipFile(a['artifact']) as z:
              assert z.testzip() is None
              assert len(z.infolist())==a['zipMembers']
          print(json.dumps(a,indent=2))
          PY

      - name: Upload exact current successor artifact
        uses: actions/upload-artifact@v4
        with:
          name: franklin-current-successor-exact-source
          path: |
            FRANKLIN_NAVIGATOR__*__CURRENT_SUCCESSOR_EXACT_SOURCE.zip
            CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json
            CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json
          if-no-files-found: error
          retention-days: 30
