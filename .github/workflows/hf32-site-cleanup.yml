name: Franklin current-successor regression and exact-artifact qualification

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'assistant-runtime/**'
      - 'PRODUCTION_RELEASE.json'
      - 'NEXT_VERSION_IMPROVEMENT_LIST__FR_NAV1_29_4_HF3104.md'
      - '.github/workflows/hf32-site-cleanup.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'assistant-runtime/**'
      - 'PRODUCTION_RELEASE.json'
      - '.github/workflows/hf32-site-cleanup.yml'

permissions:
  contents: read

jobs:
  qualify-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Current release, profile and Assistant source contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          d=json.loads(Path('PRODUCTION_RELEASE.json').read_text())
          assert d['release']=='FR-NAV1.29.4-HF3.10.4'
          assert d['base']=='FR-NAV1.29.3-HF3.10.3'
          assert d['branding']['mobileBrandPosition']=='UPPER_LEFT'
          assert d['branding']['foundingMemberPublicLanguage'] is False
          assert d['branding']['newServicePublicLanguage'] is False
          a=d['assistant']
          assert a['mode']=='INTENT_FIRST_ANSWER_FIRST_LOCAL_VERIFIED_THEN_CURRENT_WEB_RESEARCH'\n          assert a['qualityRegression']=='scripts/test-assistant-r1294.js'\n          assert a['highValueIntentRules']>=22
          assert a['spanishIntentRegressionCases']>=15
          assert a['routeDataRelease']=='FR-NAV1.29.2-HF3.10.2'
          assert a['routeCount']==254 and a['profileCount']==19103
          assert a['attachmentNetworkSubmission'] is False
          manifest=json.loads(Path('dist/data/discovery/manifest.json').read_text())
          idx=Path('dist')/manifest['index']['file'].lstrip('/')
          assert manifest['recordCount']==19103
          assert hashlib.sha256(idx.read_bytes()).hexdigest()==manifest['index']['sha256']
          total=0
          for i,item in enumerate(a['verifiedRouteShards']):
              p=Path('dist')/item['path'].lstrip('/')
              r=json.loads(p.read_text())
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
              assert r['release']==a['routeDataRelease'] and r['shard']==f'{i:02d}'
              assert r['recordCount']==item['count']
              total+=r['recordCount']
          assert total==254
          print(d['release'], manifest['recordCount'], total)
          PY

      - name: JavaScript syntax and route integrity
        run: |
          set -euo pipefail
          node --check dist/assets/hf36.js
          node --check dist/assets/franklin-assistant-r1293-core.js
          node --check dist/assets/franklin-assistant-r1293-files.js
          node --check dist/assets/franklin-assistant-r1293-file-analysis.js
          node --check dist/assets/franklin-assistant-r1293.js\n          node --check dist/assets/franklin-assistant-r1294-core.js\n          node --check dist/assets/franklin-assistant-r1294.js\n          node --check scripts/test-assistant-r1294.js
          node --check dist/assets/franklin-established-positioning.js
          node --check assistant-runtime/server.js
          test -f dist/assets/hf3103-mobile.css
          for p in index.html assistant/index.html directory/index.html get-it-done/index.html today/index.html community-help-center/index.html my-franklin/index.html business-dashboard/index.html member-profile-preview/index.html membership-start/index.html claim-profile/index.html corrections/index.html; do test -f "dist/$p"; done

      - name: Franklin Assistant answer-first research, upload and mobile contract
        run: |
          set -euo pipefail
          grep -F "FR-NAV1.29.4-HF3.10.4" dist/assets/franklin-assistant-r1294-core.js dist/assets/franklin-assistant-r1294.js PRODUCTION_RELEASE.json\n          grep -F "FR-NAV1.29.3-HF3.10.3" assistant-runtime/server.js
          grep -F "Example: I just moved here and need help setting up utilities." dist/assets/franklin-assistant-r1293-files.js
          grep -F "Attach a document, screenshot or photo with readable text" dist/assets/franklin-assistant-r1293-files.js
          grep -F "action or deadline language" dist/assets/franklin-assistant-r1293-file-analysis.js
          grep -F "franklin-navigator-assistant.onrender.com/api/research" dist/assets/franklin-assistant-r1294.js
          grep -F "attached files stay on your device" dist/assets/franklin-assistant-r1294.js
          grep -F "grid-column:1!important" dist/assets/hf3103-mobile.css
          grep -F "justify-self:start!important" dist/assets/hf3103-mobile.css
          grep -F "franklin-established-positioning" dist/assets/hf36.js
          ! grep -i -E 'founding member|new service|new platform|once this feature launches|this pilot' dist/index.html dist/assistant/index.html dist/business-dashboard/index.html dist/membership-start/index.html dist/member-profile-preview/index.html
          grep -F 'Community Member benefit' dist/assets/franklin-established-positioning.js
          grep -F 'No promotional discount' dist/assets/franklin-established-positioning.js
          grep -F 'Community Membership conversation' dist/assets/franklin-established-positioning.js\n          node scripts/test-assistant-r1294.js\n          grep -F 'franklin-assistant-r1294-core.js' dist/assets/hf36.js\n          grep -F 'franklin-assistant-r1294.js' dist/assets/hf36.js
          node - <<'NODE'
          global.window={};require('./dist/assets/franklin-assistant-core.js');require('./dist/assets/franklin-assistant-r1293-core.js');
          const C=window.FranklinAssistantCore,R=window.FranklinAssistantR1293Core;
          const routes=[
            {p:'/permits-home/',l:'en',t:'Home projects & permits | Franklin Navigator'},
            {p:'/sports/pickleball/',l:'en',t:'Franklin Pickleball Leagues & Clinics | Franklin Navigator'},
            {p:'/start-a-business/',l:'en',t:'Start a business | Franklin Navigator'},
            {p:'/founding-member-planner/',l:'en',t:'Community Membership planner | Franklin Navigator'}
          ];
          if(!R.direct('I need a fence permit','en')?.text)throw Error('permit direct answer missing');
          if(!R.direct('how much is community membership','en')?.text.includes('$35'))throw Error('membership direct answer missing');
          if(R.researchNeeded('I need a fence permit','medium'))throw Error('stable permit unnecessarily forces web');
          if(!R.researchNeeded('what is open tonight','medium'))throw Error('current question must force web');
          if(R.cleanRouteHits(C.rankRoutes(routes,'where can I play pickleball','en',4))[0]?.rec.p!='/sports/pickleball/')throw Error('pickleball route mismatch');
          if(R.cleanRouteHits(C.rankRoutes(routes,'how do I start a business','en',4))[0]?.rec.p!='/start-a-business/')throw Error('business route mismatch');
          if(R.cleanRouteHits([{rec:routes[3],score:100}]).length)throw Error('retired founding route surfaced');
          NODE

      - name: Live official-source research service qualification
        run: |
          set -euo pipefail
          health=$(curl -fsS --retry 6 --retry-all-errors --retry-delay 3 --max-time 75 https://franklin-navigator-assistant.onrender.com/health)
          echo "$health"
          node -e 'const d=JSON.parse(process.argv[1]);if(!d.ok||d.release!=="FR-NAV1.29.3-HF3.10.3")process.exit(1)' "$health"
          answer=$(curl -fsS --retry 3 --retry-all-errors --retry-delay 3 --max-time 45 -H 'Origin: https://franklinnavigator.com' -H 'Content-Type: application/json' --data '{"q":"What are the current Franklin Tennessee City Hall hours?"}' https://franklin-navigator-assistant.onrender.com/api/research)
          echo "$answer"
          node -e 'const d=JSON.parse(process.argv[1]);if(!d.ok||!d.answer||!Array.isArray(d.sources)||d.sources.length<1||!d.sources.some(x=>x.official===true)||!d.researchedAt)process.exit(1);if(/Paycheck Advance|Current \| Future of Banking/i.test(d.answer+JSON.stringify(d.sources)))process.exit(1)' "$answer"

      - name: Current Community Membership and free-profile-control contract
        run: |
          set -euo pipefail
          grep -F 'Preview your Community Member profile.' dist/member-profile-preview/index.html
          grep -F 'Community Membership — $35/year' dist/member-profile-preview/index.html
          grep -F 'Corrections and removal stay free.' dist/member-profile-preview/index.html
          grep -F 'Ordinary Directory ranking and factual accuracy do not change' dist/member-profile-preview/index.html
          grep -F '$35' dist/membership-start/index.html
          ! grep -E '\$5/month|\$90|\$50/year|\$120|Charter Member' dist/member-profile-preview/index.html dist/membership-start/index.html

      - name: Current business/member product contract
        run: |
          set -euo pipefail
          grep -F 'Find my profile' dist/member-profile-preview/index.html
          grep -F 'Find or manage your Franklin profile.' dist/claim-profile/index.html
          grep -F 'Corrections and removal are free.' dist/claim-profile/index.html
          grep -F 'Community Membership' dist/business-dashboard/index.html
          grep -F 'English' dist/member-profile-preview/index.html
          grep -F 'Español' dist/member-profile-preview/index.html

      - name: Preserve qualified HF3.10 baseline receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['HF310_STATIC_QUALIFICATION_REPORT.json','HF310_BROWSER_QUALIFICATION_REPORT.json','HF310_QUALIFICATION_REPORT.json']:
              d=json.loads(Path(name).read_text())
              assert d.get('status') in ('PASS','QUALIFIED_SUCCESSOR')
          assert json.loads(Path('HF310_QUALIFICATION_REPORT.json').read_text()).get('issueCount')==0
          PY

      - name: Build deterministic exact-source artifact and manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,subprocess
          root=Path('.')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          release=json.loads(Path('PRODUCTION_RELEASE.json').read_text())['release']
          artifact=f'FRANKLIN_NAVIGATOR__{release}__CURRENT_SUCCESSOR_EXACT_SOURCE.zip'
          manifest_name='CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json'
          attestation_name='CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json'
          exclude={artifact,manifest_name,attestation_name}
          files=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel.startswith('.git/') or rel in exclude: continue
              b=p.read_bytes();files.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'schema':'franklin.current-source-manifest.v1','release':release,'commit':commit,'tree':tree,'memberCount':len(files),'members':files,'selfExcluded':True}
          Path(manifest_name).write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n')
          entries=files+[{'path':manifest_name,'bytes':Path(manifest_name).stat().st_size,'sha256':hashlib.sha256(Path(manifest_name).read_bytes()).hexdigest()}]
          with zipfile.ZipFile(artifact,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for item in sorted(entries,key=lambda x:x['path']):
                  p=Path(item['path']);info=zipfile.ZipInfo(item['path'],(2026,1,1,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16;z.writestr(info,p.read_bytes())
          att={'release':release,'commit':commit,'tree':tree,'artifact':artifact,'artifactBytes':Path(artifact).stat().st_size,'artifactSha256':hashlib.sha256(Path(artifact).read_bytes()).hexdigest(),'manifest':manifest_name,'manifestSha256':hashlib.sha256(Path(manifest_name).read_bytes()).hexdigest(),'zipMembers':len(entries),'profileCount':19103,'assistantRouteCount':254,'result':'PASS_EXACT_SOURCE_ARTIFACT_SEALED'}
          Path(attestation_name).write_text(json.dumps(att,indent=2)+'\n')
          with zipfile.ZipFile(artifact) as z: assert z.testzip() is None
          print(json.dumps(att,indent=2))
          PY

      - name: Upload exact current successor artifact
        uses: actions/upload-artifact@v4
        with:
          name: franklin-current-successor-exact-source
          path: |
            FRANKLIN_NAVIGATOR__FR-NAV1.29.4-HF3.10.4__CURRENT_SUCCESSOR_EXACT_SOURCE.zip
            CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json
            CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json
          if-no-files-found: error
          retention-days: 30
