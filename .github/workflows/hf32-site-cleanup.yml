name: Franklin HF3.2 site cleanup qualification
on:
  push:
    branches: [main]
    paths:
      - 'dist/assets/hf32-site-cleanup.js'
      - 'dist/assets/hf32-site-cleanup.css'
      - 'dist/assets/hf32-sitewide-review.css'
      - 'dist/assets/community-explorer.js'
      - 'dist/assets/hf27-navigation.js'
      - 'dist/assets/r37.css'
      - 'dist/member-profile-preview/index.html'
      - '.github/workflows/hf32-site-cleanup.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dist/assets/hf32-site-cleanup.js'
      - 'dist/assets/hf32-site-cleanup.css'
      - 'dist/assets/hf32-sitewide-review.css'
      - 'dist/assets/community-explorer.js'
      - 'dist/assets/hf27-navigation.js'
      - 'dist/assets/r37.css'
      - 'dist/member-profile-preview/index.html'
      - '.github/workflows/hf32-site-cleanup.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check dist/assets/hf32-site-cleanup.js
          node --check dist/assets/hf27-navigation.js
          node --check dist/assets/community-explorer.js
      - name: Shared cleanup contract
        run: |
          grep -F "@import url('/assets/hf32-site-cleanup.css');" dist/assets/r37.css
          grep -F "@import url('/assets/hf32-sitewide-review.css');" dist/assets/r37.css
          grep -F "Ask Franklin Assistant" dist/assets/hf32-site-cleanup.js
          grep -F "Get It Done" dist/assets/hf32-site-cleanup.js
          grep -F "Find Local" dist/assets/hf32-site-cleanup.js
          grep -F "Help Center" dist/assets/hf32-site-cleanup.js
      - name: Site-wide laptop readability contract
        run: |
          grep -F 'Owner-approved site-wide laptop readability' dist/assets/hf32-site-cleanup.css
          grep -F 'main>[class*="hero"] h1' dist/assets/hf32-site-cleanup.css
          grep -F 'font-size:clamp(2rem,3.25vw,3.35rem)!important' dist/assets/hf32-site-cleanup.css
          grep -F '.history-section,.urgent-section,.growth-trust,.growth-boundaries,.home-command-bar' dist/assets/hf32-site-cleanup.css
          grep -F 'body.hf32-site-cleanup:not(.hf31-explorer-page) .explorer-hero-card' dist/assets/hf32-site-cleanup.css
          grep -F 'color:#f7fbfa!important' dist/assets/hf32-site-cleanup.css
          grep -F 'color:#fff1b8!important' dist/assets/hf32-site-cleanup.css
          grep -F '.growth-boundaries .card a{color:var(--brand-dark)!important}' dist/assets/hf32-site-cleanup.css
      - name: Shared screenshot-review layout contract
        run: |
          grep -F 'body.hf32-site-cleanup .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))!important}' dist/assets/hf32-sitewide-review.css
          grep -F '.r41-more-actions,.hf29-card-more,.hf29-dialog-more,.hf29-footer-more,.hf31-more' dist/assets/hf32-sitewide-review.css
          grep -F 'content:" ▾"!important' dist/assets/hf32-sitewide-review.css
          grep -F 'content:" ▴"!important' dist/assets/hf32-sitewide-review.css
      - name: Community Explorer bounded loading contract
        run: |
          grep -F "retry: 'Retry loading local options'" dist/assets/community-explorer.js
          grep -F "Promise.race([request, timeout])" dist/assets/community-explorer.js
          grep -F "fetchCatalogAttempt('default', 4500, false)" dist/assets/community-explorer.js
          grep -F "fetchCatalogAttempt('no-store', 7000, true)" dist/assets/community-explorer.js
          grep -F "!Array.isArray(data.currentWindow)" dist/assets/community-explorer.js
          grep -F "showLoadError" dist/assets/community-explorer.js
      - name: Member-profile layout and single annual plan
        run: |
          grep -F 'Manage or improve your Franklin profile.' dist/member-profile-preview/index.html
          grep -F 'Join for $35/year' dist/member-profile-preview/index.html
          grep -F 'Correct or remove a profile' dist/member-profile-preview/index.html
          grep -F 'data-r28-preview-form' dist/member-profile-preview/index.html
          ! grep -E '\$5/month|\$90|\$50/year|\$120|Charter Member' dist/member-profile-preview/index.html
      - name: No accidental capability removal markers
        run: |
          test -f dist/assets/r28-community.js
          test -f dist/assets/r37-i18n.js
          test -f dist/corrections/index.html
          test -f dist/sports/index.html
          test -f dist/today/index.html
          test -f dist/get-it-done/index.html
          test -f dist/directory/index.html
