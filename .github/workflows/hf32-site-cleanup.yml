name: Franklin current-successor regression and exact-artifact qualification

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'assistant-runtime/**'
      - 'PRODUCTION_RELEASE.json'
      - 'NEXT_VERSION_IMPROVEMENT_LIST__FR_NAV*.md'
      - 'SRE_OWNER_CONSOLE_ISSUE_HANDOFF_CONTRACT*.json'
      - '*REPORT*.md'
      - '*RECEIPT*.json'
      - '.github/workflows/hf32-site-cleanup.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dist/**'
      - 'assistant-runtime/**'
      - 'PRODUCTION_RELEASE.json'
      - '.github/workflows/hf32-site-cleanup.yml'

permissions:
  contents: read

jobs:
  qualify-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Current release, profile, Assistant, navigation and monitoring contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, re
          from pathlib import Path
          d=json.loads(Path('PRODUCTION_RELEASE.json').read_text())
          assert re.fullmatch(r'FR-NAV\d+\.\d+\.\d+-HF\d+\.\d+\.\d+', d['release'])
          assert d['base'] != d['release']
          assert d['branding']['mobileBrandPosition']=='UPPER_LEFT'
          assert d['branding']['foundingMemberPublicLanguage'] is False
          assert d['branding']['newServicePublicLanguage'] is False
          assert d['branding']['headerAsset']=='/assets/franklin-mark.svg'
          assert d['branding']['favicon']=='/assets/favicon.svg'
          a=d['assistant']
          assert d['counts']['assistantRoutes']==254
          assert d['counts']['profiles']>=19103
          assert a.get('availableLegacyRouteCount',a.get('routeCount'))==254
          assert a.get('availableSiteProfileCount',a.get('profileCount'))==19103
          assert a['attachmentNetworkSubmission'] is False
          assert a['rawChatHistoryPersisted'] is False
          # Clean-room Assistant v2 intentionally retired the old guide/response-policy
          # manifest keys. Preserve the stronger current safety/neutrality contracts.
          if a.get('architecture')=='CLEAN_ROOM_V2':
              assert a['verifiedFactPrecedence'] is True
              assert a['arbitraryPublicWebSearch'] is False
              assert a['explicitDirectoryHandoff'] is True
              assert a['paidRanking'] is False
              assert a['guideQuestionnaireRouting'] is False
              assert a['legacyRouteDataPreservedButUnused'] is True
          else:
              assert a['responsePolicy']=='ONE_DIRECT_ANSWER_ONLY'
              assert a['guideMode'] is True
              assert a['routeDataRelease']=='FR-NAV1.29.2-HF3.10.2'
          nav=d['navigation']
          assert nav['rule']=='SHOW_MAXIMUM_PRACTICAL_TOP_LEVEL_ITEMS_WHILE_KEEPING_PRIMARY_NAV_ON_ONE_LINE'
          assert nav['fixedBreakpointHiding'] is False and nav['singleLinePrimaryNav'] is True
          mon=d['monitoring']
          assert mon['version']=='FRANKLIN_ISSUE_MONITOR_1'
          assert mon['durableRequirement'].startswith('CONTINUE_SITE_WIDE')
          assert mon['rawSecretsForbidden'] is True
          cc=d.get('communityConnector',{})
          if cc:
              assert cc['publicEntryPoint']=='FRANKLIN_ASSISTANT_REMAINS_FIRST_TOP_OF_HOME_ACTION'
              assert cc['paidAccuracyGate'] is False
          manifest=json.loads(Path('dist/data/discovery/manifest.json').read_text())
          idx=Path('dist')/manifest['index']['file'].lstrip('/')
          assert manifest['recordCount']==19103
          assert hashlib.sha256(idx.read_bytes()).hexdigest()==manifest['index']['sha256']
          # A single owner-directed, source-backed PF15.28 Franklin Navigator self-profile
          # overlay may extend the public profile scope to 19,104 without rewriting the
          # canonical 19,103 discovery index.
          if d['counts']['profiles']==19104:
              assert d.get('authority',{}).get('pf15_28CanonicalProfileId')=='FR-ORG-b00c0ace7943973c'
              assert Path('dist/profiles/FR-ORG-b00c0ace7943973c/index.html').is_file()
          else:
              assert d['counts']['profiles']==manifest['recordCount']
          total=a.get('availableLegacyRouteCount',a.get('routeCount',0))
          assert total==254
          # Validate legacy shards only on releases that still expose their manifest.
          if a.get('verifiedRouteShards'):
              shard_total=0
              for i,item in enumerate(a['verifiedRouteShards']):
                  p=Path('dist')/item['path'].lstrip('/')
                  r=json.loads(p.read_text())
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256']
                  assert r['release']==a['routeDataRelease'] and r['shard']==f'{i:02d}'
                  assert r['recordCount']==item['count']
                  shard_total+=r['recordCount']
              assert shard_total==254
          print(d['release'], manifest['recordCount'], d['counts']['profiles'], total)
          PY

      - name: JavaScript syntax, route integrity and R1311 UX contracts
        run: |
          set -euo pipefail
          node --check dist/assets/hf36.js
          node --check dist/assets/franklin-assistant-r1293-core.js
          node --check dist/assets/franklin-assistant-r1294-core.js
          node --check dist/assets/franklin-assistant-r1295-core.js
          node --check dist/assets/franklin-assistant-r1307.js
          node --check dist/assets/franklin-site-monitor-r1308.js
          node --check dist/assets/r1330-profile.js
          node --check dist/assets/r1332-profile.js
          node --check dist/assets/r1332-member-offers.js
          node --check dist/assets/r1333-paid-sponsored.js
          node --check dist/assets/local-discovery.js
          test -f dist/assets/r1330-profile.css
          test -f dist/assets/r1332-profile.css
          test -f dist/assets/r1333-profile.css
          test -f dist/assets/r1333-sponsored.css
          test -f dist/review-guidelines/index.html
          grep -F "Sponsored" dist/assets/r1333-paid-sponsored.js
          grep -F "ordinary unpaid" dist/membership-start/index.html
          ! grep -i -E "recommended by Franklin|endorsed by Franklin|Franklin recommends|Franklin endorses" dist/assets/r1333-paid-sponsored.js dist/assets/r1333-profile.css dist/assets/r1333-sponsored.css
          test -f dist/assets/franklin-nav-r1310.css
          test -f dist/assets/franklin-nav-r1311.css
          test -f dist/assets/r1311-community.css
          grep -F "installCommunityConnectorR1311" dist/assets/hf36.js
          grep -F "franklin-nav-r1311.css" dist/assets/hf36.js
          grep -F "franklin-site-monitor-r1308.js" dist/assets/hf36.js
          grep -F "width:min(1480px,100%)" dist/assets/franklin-nav-r1311.css
          grep -F "r1311-community-actions" dist/assets/r1311-community.css
          for p in index.html assistant/index.html directory/index.html get-it-done/index.html today/index.html activities/index.html community/index.html community-help-center/index.html my-franklin/index.html business-dashboard/index.html member-profile-preview/index.html membership-start/index.html claim-profile/index.html corrections/index.html owner-issues/index.html owner-issues/readiness/index.html; do test -f "dist/$p"; done

      - name: Assistant regression and public-language safety
        run: |
          set -euo pipefail
          node scripts/test-assistant-r1294.js
          node scripts/test-assistant-r1295.js
          ! grep -i -E 'founding member|new service|new platform|once this feature launches|this pilot' dist/index.html dist/assistant/index.html dist/business-dashboard/index.html dist/membership-start/index.html dist/member-profile-preview/index.html
          grep -F '$35' dist/membership-start/index.html
          grep -F 'Find or manage your Franklin profile.' dist/claim-profile/index.html
          grep -F 'Corrections and removal are free.' dist/claim-profile/index.html
          grep -F 'Community Membership' dist/business-dashboard/index.html
          grep -F 'English' dist/member-profile-preview/index.html
          grep -F 'Español' dist/member-profile-preview/index.html

      - name: Preserve qualified HF3.10 baseline receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['HF310_STATIC_QUALIFICATION_REPORT.json','HF310_BROWSER_QUALIFICATION_REPORT.json','HF310_QUALIFICATION_REPORT.json']:
              d=json.loads(Path(name).read_text())
              assert d.get('status') in ('PASS','QUALIFIED_SUCCESSOR')
          assert json.loads(Path('HF310_QUALIFICATION_REPORT.json').read_text()).get('issueCount')==0
          PY

      - name: Build deterministic exact-source artifact and manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,subprocess
          root=Path('.')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          release=json.loads(Path('PRODUCTION_RELEASE.json').read_text())['release']
          artifact=f'FRANKLIN_NAVIGATOR__{release}__CURRENT_SUCCESSOR_EXACT_SOURCE.zip'
          manifest_name='CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json'
          attestation_name='CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json'
          exclude={artifact,manifest_name,attestation_name}
          files=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel.startswith('.git/') or rel in exclude: continue
              b=p.read_bytes()
              files.append({'path':rel,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'schema':'franklin.current-source-manifest.v1','release':release,'commit':commit,'tree':tree,'memberCount':len(files),'members':files,'selfExcluded':True}
          Path(manifest_name).write_text(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n')
          entries=files+[{'path':manifest_name,'bytes':Path(manifest_name).stat().st_size,'sha256':hashlib.sha256(Path(manifest_name).read_bytes()).hexdigest()}]
          with zipfile.ZipFile(artifact,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for item in sorted(entries,key=lambda x:x['path']):
                  p=Path(item['path'])
                  info=zipfile.ZipInfo(item['path'],(2026,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,p.read_bytes())
          att={'release':release,'commit':commit,'tree':tree,'artifact':artifact,'artifactBytes':Path(artifact).stat().st_size,'artifactSha256':hashlib.sha256(Path(artifact).read_bytes()).hexdigest(),'manifest':manifest_name,'manifestSha256':hashlib.sha256(Path(manifest_name).read_bytes()).hexdigest(),'zipMembers':len(entries),'profileCount':json.loads(Path('PRODUCTION_RELEASE.json').read_text())['counts']['profiles'],'assistantRouteCount':json.loads(Path('PRODUCTION_RELEASE.json').read_text())['counts']['assistantRoutes'],'result':'PASS_EXACT_SOURCE_ARTIFACT_SEALED'}
          Path(attestation_name).write_text(json.dumps(att,indent=2)+'\n')
          with zipfile.ZipFile(artifact) as z: assert z.testzip() is None
          print(json.dumps(att,indent=2))
          PY

      - name: Upload exact current successor artifact
        uses: actions/upload-artifact@v4
        with:
          name: franklin-current-successor-exact-source
          path: |
            FRANKLIN_NAVIGATOR__*__CURRENT_SUCCESSOR_EXACT_SOURCE.zip
            CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json
            CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json
          if-no-files-found: error
          retention-days: 30
