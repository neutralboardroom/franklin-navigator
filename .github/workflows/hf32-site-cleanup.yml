      - name: Preserve qualified HF3.10 baseline receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['HF310_STATIC_QUALIFICATION_REPORT.json','HF310_BROWSER_QUALIFICATION_REPORT.json','HF310_QUALIFICATION_REPORT.json']:
              d=json.loads(Path(name).read_text())
              assert d.get('status') in ('PASS','QUALIFIED_SUCCESSOR')
          assert json.loads(Path('HF310_QUALIFICATION_REPORT.json').read_text()).get('issueCount')==0
          PY

      - name: Build deterministic exact-source artifact and manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,json,zipfile,subprocess

          root=Path('.')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          release_meta=json.loads(Path('PRODUCTION_RELEASE.json').read_text())
          release=release_meta['release']
          current_release_meta=next(
              (v for v in release_meta.values()
               if isinstance(v,dict) and v.get('version')==release and isinstance(v.get('runtime'),dict)),
              None
          )
          assert current_release_meta is not None, 'current release runtime metadata missing'
          runtime_commit=current_release_meta['runtime']['commit']
          assert len(runtime_commit)==40

          # Fetch the exact separately deployed Local-owned membership/runtime source
          # and package it under a namespaced directory. This preserves the two
          # deployment lanes while making the successor artifact implementation-complete.
          subprocess.check_call(['git','fetch','--no-tags','--depth=1','origin',runtime_commit])

          artifact=f'FRANKLIN_NAVIGATOR__{release}__CURRENT_SUCCESSOR_EXACT_SOURCE.zip'
          second=f'.second-build__{artifact}'
          manifest_name='CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json'
          attestation_name='CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json'
          exclude={artifact,second,manifest_name,attestation_name}
          payload={}

          def safe(rel):
              p=PurePosixPath(rel)
              assert not p.is_absolute() and '..' not in p.parts and rel and '\\' not in rel
              assert not rel.startswith('.git/')
              return rel

          # Main/public source bytes from the exact workflow commit.
          for p in sorted(root.rglob('*')):
              rel0=p.relative_to(root).as_posix()
              if rel0 in exclude or rel0.startswith('.git/'): continue
              if p.is_symlink():
                  raise AssertionError(f'symlink not allowed in release: {p}')
              if not p.is_file(): continue
              rel=safe(rel0)
              if rel.endswith('/.env') or rel=='.env':
                  raise AssertionError(f'secret-bearing env file prohibited: {rel}')
              payload[rel]=p.read_bytes()

          # Exact runtime branch snapshot, isolated inside the release namespace.
          ls=subprocess.check_output(
              ['git','ls-tree','-r',runtime_commit],
              text=True
          ).splitlines()
          runtime_members=0
          for line in ls:
              left,rp=line.split('\t',1)
              mode=left.split()[0]
              if mode not in {'100644','100755'}:
                  raise AssertionError(f'unsafe runtime member mode {mode}: {rp}')
              rel=safe('runtime/franklin-membership/'+rp)
              if rp=='.env' or rp.endswith('/.env'):
                  raise AssertionError(f'runtime secret-bearing env file prohibited: {rp}')
              payload[rel]=subprocess.check_output(['git','show',f'{runtime_commit}:{rp}'])
              runtime_members+=1
          assert runtime_members>0

          members=[
              {'path':rel,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              for rel,data in sorted(payload.items())
          ]
          manifest={
              'schema':'franklin.current-source-manifest.v2',
              'release':release,
              'publicSourceCommit':commit,
              'publicSourceTree':tree,
              'runtimeSourceCommit':runtime_commit,
              'runtimeNamespace':'runtime/franklin-membership/',
              'runtimeMemberCount':runtime_members,
              'memberCount':len(members),
              'members':members,
              'selfHashRule':'Manifest covers every packaged source member except its own manifest bytes; the manifest SHA-256 is recorded in the external attestation.',
              'selfExcluded':True
          }
          manifest_bytes=(json.dumps(manifest,sort_keys=True,separators=(',',':'))+'\n').encode()
          payload[manifest_name]=manifest_bytes

          def build_zip(out):
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in sorted(payload.items()):
                      info=zipfile.ZipInfo(rel,(2026,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=0o100644<<16
                      z.writestr(info,data)

          build_zip(artifact)
          build_zip(second)
          first_bytes=Path(artifact).read_bytes()
          second_bytes=Path(second).read_bytes()
          assert first_bytes==second_bytes, 'deterministic double build mismatch'
          artifact_sha=hashlib.sha256(first_bytes).hexdigest()
          second_sha=hashlib.sha256(second_bytes).hexdigest()
          assert artifact_sha==second_sha
          Path(second).unlink()

          with zipfile.ZipFile(artifact) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              assert set(names)==set(payload)
              for info in z.infolist():
                  pp=PurePosixPath(info.filename)
                  assert not pp.is_absolute() and '..' not in pp.parts
                  assert (info.external_attr>>16)&0o170000 == 0o100000

          att={
              'release':release,
              'publicSourceCommit':commit,
              'publicSourceTree':tree,
              'runtimeSourceCommit':runtime_commit,
              'artifact':artifact,
              'artifactBytes':Path(artifact).stat().st_size,
              'artifactSha256':artifact_sha,
              'secondBuildSha256':second_sha,
              'doubleBuildByteIdentical':True,
              'manifest':manifest_name,
              'manifestSha256':hashlib.sha256(manifest_bytes).hexdigest(),
              'zipMembers':len(payload),
              'runtimeMembers':runtime_members,
              'profileCount':release_meta['counts']['profiles'],
              'assistantRouteCount':release_meta['counts']['assistantRoutes'],
              'safePaths':'PASS',
              'zipIntegrity':'PASS',
              'result':'PASS_EXACT_SOURCE_ARTIFACT_SEALED'
          }
          Path(attestation_name).write_text(json.dumps(att,indent=2)+'\n')
          print(json.dumps(att,indent=2))
          PY

      - name: Fresh extraction validation and tests
        run: |
          set -euo pipefail
          rm -rf _current_release_fresh
          mkdir _current_release_fresh
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,json,zipfile
          release=json.loads(Path('PRODUCTION_RELEASE.json').read_text())['release']
          zpath=next(Path('.').glob(f'FRANKLIN_NAVIGATOR__{release}__CURRENT_SUCCESSOR_EXACT_SOURCE.zip'))
          out=Path('_current_release_fresh')
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              for info in z.infolist():
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(out)
          manifest=json.loads((out/'CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json').read_text())
          expected={m['path']:m for m in manifest['members']}
          actual={p.relative_to(out).as_posix():p for p in out.rglob('*') if p.is_file()}
          assert set(actual)==set(expected)|{'CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json'}
          for rel,m in expected.items():
              b=actual[rel].read_bytes()
              assert len(b)==m['bytes']
              assert hashlib.sha256(b).hexdigest()==m['sha256']
          print({'manifestMembersVerified':len(expected),'runtimeMembers':manifest['runtimeMemberCount'],'result':'PASS'})
          PY
          (
            cd _current_release_fresh
            python scripts/validate-current-release.py
            node scripts/test-assistant-r1294.js
            node scripts/test-assistant-r1295.js
            node --check dist/assets/r1330-profile.js
            node --check dist/assets/r1332-profile.js
            node --check dist/assets/r1332-member-offers.js
            node --check dist/assets/r1333-paid-sponsored.js
            node --check dist/assets/franklin-site-monitor-r1308.js
          )
          (
            cd _current_release_fresh/runtime/franklin-membership
            npm ci --ignore-scripts --no-audit --no-fund
            npm test
            npm run check
          )
          rm -rf _current_release_fresh

      - name: Upload exact current successor artifact
        uses: actions/upload-artifact@v4
        with:
          name: franklin-current-successor-exact-source
          path: |
            FRANKLIN_NAVIGATOR__*__CURRENT_SUCCESSOR_EXACT_SOURCE.zip
            CURRENT_SUCCESSOR_EXACT_SOURCE_MANIFEST.json
            CURRENT_SUCCESSOR_EXACT_SOURCE_ATTESTATION.json
          if-no-files-found: error
          retention-days: 30
