name: HF26 language remediation retry
on:
  push:
    branches: [local-franklin-hf25-dynamic-truth-20260908]
    paths: [.github/workflows/hf26-language-remediation-retry.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: transport, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 01aecafbfe16202d9d5a80eb6b97443c9ee305ad, path: candidate, persist-credentials: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Reapply exact language remediation recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,textwrap
          s=Path('transport/.github/workflows/hf26-language-remediation.yml').read_text()
          marker='      - name: Rewrite public language without changing source-backed profile facts\n        run: |\n          python - <<\'PY\'\n'
          body=s.split(marker,1)[1].split('\n          PY\n',1)[0]
          exec(compile(textwrap.dedent(body),'hf26-language-recipe','exec'))
          PY
      - name: Source gates and checkout safety
        working-directory: candidate
        run: |
          set -euo pipefail
          node --check dist/assets/app.js
          node --check dist/assets/membership-live.js
          node --check dist/assets/r37-i18n.js
          python - <<'PY'
          from pathlib import Path
          import re,html,json
          root=Path('dist');html_pages=list(root.rglob('*.html'));profiles=list((root/'profiles').rglob('index.html'));assert len(html_pages)==19356;assert len(profiles)==19103
          banned=['Your everyday operating system for living, participating and doing business in Franklin, Tennessee.','Franklin Navigator separates public-source facts from member-provided content.','Suggest a correction or claim this profile','Membership does not buy factual accuracy or ordinary directory rank.','Claim submission is not open yet. Keep this packet until it is.','Profile verified. You can continue when checkout is available.']
          for p in html_pages:
            t=p.read_text(errors='ignore')
            for phrase in banned:assert phrase not in t,(p,phrase)
          app=(root/'assets/app.js').read_text();assert 'Public profile ID' not in app and 'FRANKLIN PROFILE REVIEW CHECKLIST' in app and 'use Profile Studio to request representation review' in app
          js=(root/'assets/membership-live.js').read_text();assert 'MEMBERSHIP_ALREADY_ACTIVE' in js and 'CHECKOUT_PENDING_MESSAGE' in js and 'PROFILE_VERIFICATION_REQUIRED' in js and '$5/month' in js and '$50/year' in js and '$120 for 36 months' in js
          over=[]
          for p in html_pages:
            rel=p.relative_to(root).as_posix()
            if rel.startswith('profiles/'):continue
            m=re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']',p.read_text(),re.I)
            if m and len(html.unescape(m.group(1)))>180:over.append(rel)
          assert not over,over[:10]
          print(json.dumps({'htmlPages':len(html_pages),'profilePages':len(profiles),'overlongMeta':0,'banned':0}))
          PY
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser every non-profile page plus stratified profile templates
        run: |
          set -euo pipefail
          python -m http.server 8879 --bind 127.0.0.1 --directory candidate/dist >/tmp/hf26r-http.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          root=Path('candidate/dist');origin='http://127.0.0.1:8879';rows=[]
          def ok(i,v,d=''):rows.append({'id':i,'pass':bool(v),'detail':d});assert v,(i,d)
          non=sorted(p for p in root.rglob('*.html') if 'profiles' not in p.relative_to(root).parts);profiles=sorted((root/'profiles').rglob('index.html'));sample=[profiles[(i*(len(profiles)-1))//119] for i in range(120)]
          with sync_playwright() as pw:
            b=pw.chromium.launch()
            for p in non+sample:
              rel=p.relative_to(root).as_posix();url=origin+'/'+(rel[:-10] if rel.endswith('index.html') else rel);page=b.new_page(viewport={'width':390,'height':900});errors=[];page.on('pageerror',lambda e:errors.append(str(e)));page.goto(url,wait_until='domcontentloaded');page.wait_for_timeout(25)
              ok(rel+' no-js-errors',not errors,' | '.join(errors));ok(rel+' h1',page.locator('main h1').count()==1);ok(rel+' no-overflow',page.evaluate('document.documentElement.scrollWidth<=document.documentElement.clientWidth+2'))
              if rel.startswith('profiles/'):
                body=page.locator('body').inner_text();ok(rel+' no-old-profile-wording','Franklin Navigator separates public-source facts' not in body and 'Membership does not buy factual accuracy' not in body and 'Suggest a correction or claim this profile' not in body)
              page.close()
            for path in ['/membership-enroll/','/free-membership/','/capability-status/','/directory/','/assistant/']:
              page=b.new_page(viewport={'width':390,'height':900});page.goto(origin+path,wait_until='networkidle');
              if page.locator('[data-r37-lang="es"]').count():page.locator('[data-r37-lang="es"]').click();page.wait_for_timeout(250);ok(path+' Spanish selected',page.locator('html').get_attribute('lang')=='es');ok(path+' no-old-spanish-tagline','Su sistema cotidiano' not in page.locator('body').inner_text());page.close()
            b.close()
          out={'result':'PASS','assertions':len(rows),'pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'nonProfilePages':len(non),'profileSamples':len(sample),'financialMutations':0};Path('candidate/evidence/HF26_BROWSER_LANGUAGE.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - name: Fresh open-check and prepare exact direct child
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,urllib.request,os,subprocess,base64
          root=Path('candidate');repo='neutralboardroom/franklin-navigator';base='01aecafbfe16202d9d5a80eb6b97443c9ee305ad';runtime='44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8'
          def api(p):return json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+p,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}),timeout=30))
          assert api('/git/ref/heads/main')['object']['sha']==base;assert api('/git/ref/heads/franklin-commerce-runtime-r30')['object']['sha']==runtime
          ready=json.load(urllib.request.urlopen('https://franklin-navigator-membership.onrender.com/ready'));catalog=json.load(urllib.request.urlopen('https://franklin-navigator-membership.onrender.com/api/catalog'));assert ready['commerceEnabled'] and ready['liveCheckoutEnabled'] and ready['database'] and ready['startupError'] is None;assert catalog['publicCheckoutOpen'] and [x['priceUsd'] for x in catalog['choices']]==[5,50,120]
          rem=json.loads((root/'evidence/HF26_LANGUAGE_REMEDIATION.json').read_text());browser=json.loads((root/'evidence/HF26_BROWSER_LANGUAGE.json').read_text());release={'release':'FR-NAV1.15.0-HF2.6-CANDIDATE','component':'public','parent':base,'runtimePair':runtime,'profileCount':19103,'profileFactsChanged':False,'checkoutState':'OPEN','pricesUsd':[5,50,120],'scope':'WHOLE_SITE_PUBLIC_LANGUAGE_REMEDIATION','remediation':rem,'browser':browser,'authorityTransfer':False};(root/'PRODUCTION_RELEASE.json').write_text(json.dumps(release,indent=2,sort_keys=True)+'\n')
          def git(*a,**kw):return subprocess.check_output(['git','-C',str(root),*a],text=True,**kw).strip()
          branch='local-franklin-hf26-language-qualified-'+os.environ['GITHUB_RUN_ID'];git('checkout','-b',branch);git('config','user.name','neutralboardroom');git('config','user.email','reachrgnow@gmail.com');git('add','dist','evidence/HF26_LANGUAGE_REMEDIATION.json','evidence/HF26_BROWSER_LANGUAGE.json','PRODUCTION_RELEASE.json');git('commit','-m','Improve Franklin public language across every page while preserving facts and open checkout [skip ci]');assert git('rev-parse','HEAD^')==base
          env=os.environ.copy();env['GIT_CONFIG_COUNT']='1';env['GIT_CONFIG_KEY_0']='http.https://github.com/.extraheader';env['GIT_CONFIG_VALUE_0']='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env['GH_TOKEN']).encode()).decode();git('push','origin','HEAD:refs/heads/'+branch,env=env);out={'preparedCommit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':base,'runtimePair':runtime,'branch':branch};Path('HF26_PREPARED.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf26-language-qualified
          path: |
            candidate/evidence/
            HF26_PREPARED.json
          retention-days: 14
          if-no-files-found: error
