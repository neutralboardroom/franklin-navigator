name: Expand verified Franklin R22 payload

on:
  push:
    branches:
      - r22-production-stage

permissions:
  contents: write

jobs:
  expand-r22:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deployment dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd unzip

      - name: Verify accidental main upload is contained
        shell: bash
        run: |
          set -euo pipefail
          BASE='8ffa7a9dd935e8763f1ca7fd731d98b6b38d4d79'
          MAIN_UPLOAD='711332599f19cd88667055aaf1aaa2e8deafd02f'
          test "$(git rev-parse origin/main)" = "$MAIN_UPLOAD"
          test "$(git rev-parse origin/main^)" = "$BASE"
          test "$(git diff --name-only "$BASE" "$MAIN_UPLOAD")" = 'FRANKLIN_R22__GITHUB_DEPLOY_PAYLOAD.zip'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git update-ref refs/remotes/origin/main "$BASE"

      - name: Verify and expand exact R22 public payload
        shell: bash
        run: |
          set -euo pipefail
          echo '15323df60731adfe76fd6a3d160abaf8df9467733e56b26f2a5381f119f1db31  FRANKLIN_R22__GITHUB_DEPLOY_PAYLOAD.zip' | sha256sum -c -
          rm -rf /tmp/r22-upload
          mkdir -p /tmp/r22-upload
          unzip -q FRANKLIN_R22__GITHUB_DEPLOY_PAYLOAD.zip -d /tmp/r22-upload

          echo 'd5653a6ee2cbab93543642d0ea1f087e988ee883a6c6a3074af33e28ba3316e8  /tmp/r22-upload/r22-dist.tar.zst' | sha256sum -c -
          echo '32e7f27c276e2c731f604ddd64ee1f1bb7198effa72969b97e223c6be06253e3  /tmp/r22-upload/PRODUCTION_RELEASE.json' | sha256sum -c -
          echo '145210ed980dce89e728c4690d654b0783f1ef2424f0aedcad385826013a9f53  /tmp/r22-upload/README.md' | sha256sum -c -
          echo '24b797dffe1726335994a95307cc9be888197bdc32053bb6dbc44976eb35740c  /tmp/r22-upload/deploy-r22.sh' | sha256sum -c -

          zstd -q -dc /tmp/r22-upload/r22-dist.tar.zst > /tmp/r22-dist.tar
          echo '3f9d413b6d9ec599c769e8b0c124f2d18a01d0ee145c0cd4a45b889e76a36549  /tmp/r22-dist.tar' | sha256sum -c -
          rm -rf dist
          tar -xf /tmp/r22-dist.tar

          test "$(find dist -type f -name '*.html' | wc -l)" -eq 19275
          test "$(find dist/profiles -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l)" -eq 19103
          test "$(find dist -type f | wc -l)" -eq 19342
          grep -q 'FR-NAV0.7.0-CANDIDATE-R22' dist/release-identity.json
          echo 'bbec2a38bcf59b12cea93ac5b4a7597b445048e5bd07d8674492a33f09a58cbe  dist/sitemap.xml' | sha256sum -c -
          echo 'f1c137c6ea67568bc14d827914beb1525d845aea9f10fe33398e3145094c62c3  dist/index.html' | sha256sum -c -
          echo 'b1584d827ba31d55153fb17069653db1b8e065abf486c41c8ac490b44a61c75a  dist/FRANKLIN_BUILD_MANIFEST.json' | sha256sum -c -

          TREE_DIGEST=$(python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist')
          h=hashlib.sha256()
          files=sorted((p for p in root.rglob('*') if p.is_file()), key=lambda p:p.relative_to(root).as_posix())
          for p in files:
              rel=p.relative_to(root).as_posix().encode('utf-8')
              h.update(rel); h.update(b'\0'); h.update(hashlib.sha256(p.read_bytes()).digest())
          print(h.hexdigest())
          PY
          )
          test "$TREE_DIGEST" = 'c4d2cc56dfeb769a4d7ca2ef64901c11cd069f5fa4084fbe053907409d298b26'

          cp /tmp/r22-upload/PRODUCTION_RELEASE.json PRODUCTION_RELEASE.json
          cp /tmp/r22-upload/README.md README.md
          rm -f FRANKLIN_R22__GITHUB_DEPLOY_PAYLOAD.zip
          rm -f .github/workflows/expand-r22.yml

          git config user.name 'Franklin Navigator Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy Franklin Navigator R22 exact verified payload'
          git push origin HEAD:r22-production-stage
