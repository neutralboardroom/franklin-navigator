name: HF26 Playwright overflow comparison
on:
  push:
    branches: [local-franklin-hf26-public-language-20260908]
    paths: [.github/workflows/hf26-overflow-playwright.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: transport, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 01aecafbfe16202d9d5a80eb6b97443c9ee305ad, path: base, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 01aecafbfe16202d9d5a80eb6b97443c9ee305ad, path: candidate, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Reconstruct exact candidate
        run: |
          set -euo pipefail
          cp transport/.github/hf26/public_language_patch.py ./public_language_patch.py
          python public_language_patch.py
          python transport/.github/hf26/public_language_refine_v5.py
      - name: Install exact browser toolchain
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Measure exact before and after pages
        run: |
          set -euo pipefail
          python -m http.server 8892 --bind 127.0.0.1 --directory base/dist >/tmp/base.log 2>&1 &
          python -m http.server 8893 --bind 127.0.0.1 --directory candidate/dist >/tmp/cand.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          path='/profiles/FR-NPI-818439aa9937bb66/';out={}
          with sync_playwright() as p:
            b=p.chromium.launch()
            for name,origin in [('base','http://127.0.0.1:8892'),('candidate','http://127.0.0.1:8893')]:
              c=b.new_context(viewport={'width':390,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));resp=page.goto(origin+path,wait_until='domcontentloaded');page.wait_for_timeout(100)
              out[name]={'status':resp.status if resp else 0,'scrollWidth':page.evaluate('document.documentElement.scrollWidth'),'clientWidth':page.evaluate('document.documentElement.clientWidth'),'overflow':page.evaluate('document.documentElement.scrollWidth>document.documentElement.clientWidth+2'),'bodyScrollWidth':page.evaluate('document.body.scrollWidth'),'bodyClientWidth':page.evaluate('document.body.clientWidth'),'errors':errs}
              # Identify any elements extending past the viewport.
              out[name]['wideElements']=page.evaluate("""()=>Array.from(document.querySelectorAll('body *')).map(x=>{const r=x.getBoundingClientRect();return {tag:x.tagName,cls:x.className&&String(x.className).slice(0,100),text:(x.innerText||'').trim().slice(0,120),left:r.left,right:r.right,width:r.width}}).filter(x=>x.right>document.documentElement.clientWidth+2||x.left<-2).slice(0,20)""")
              c.close()
            b.close()
          Path('HF26_PLAYWRIGHT_OVERFLOW.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out,indent=2));assert out['base']['overflow']==out['candidate']['overflow'],out
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf26-playwright-overflow
          path: HF26_PLAYWRIGHT_OVERFLOW.json
          retention-days: 14
          if-no-files-found: error
