name: Franklin R35 membership runtime CI

on:
  push:
    branches: [franklin-commerce-runtime-r30]
  pull_request:
    branches: [franklin-commerce-runtime-r30]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
