name: Apply Franklin R30 Checkout Session runtime patch
on:
  push:
    branches: [franklin-commerce-runtime-r30]
jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: franklin-commerce-runtime-r30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-r30-checkout-session.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Commit generated R30 runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js test/r30-checkout-session.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply Franklin R30 server-created Checkout Session contract"
          git push origin HEAD:franklin-commerce-runtime-r30
