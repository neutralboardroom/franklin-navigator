name: Franklin Assistant live 120-question adversarial run
on:
  push:
    branches: [main]
    paths:
      - 'tests/franklin-assistant-adversarial-acceptance-bank.json'
      - 'tests/run-franklin-assistant-live-120-adversarial.cjs'
      - 'tests/aggregate-franklin-assistant-live-120-adversarial.cjs'
      - '.github/workflows/franklin-assistant-live-120-adversarial.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live-test:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run adversarial shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '6'
        run: node tests/run-franklin-assistant-live-120-adversarial.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: adversarial-shard-${{ matrix.shard }}
          path: adversarial-live-test-results/shard-${{ matrix.shard }}.json
          retention-days: 3
  aggregate:
    needs: live-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: adversarial-shard-*
          path: downloaded-adversarial-results
      - name: Aggregate report
        run: node tests/aggregate-franklin-assistant-live-120-adversarial.cjs
      - name: Commit report
        run: |
          git config user.name "Franklin Assistant Acceptance"
          git config user.email "actions@users.noreply.github.com"
          git add tests/results/franklin-assistant-live-120-adversarial-latest.json tests/results/franklin-assistant-live-120-adversarial-latest.md
          git commit -m "Record live Franklin Assistant 120-question adversarial report" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
