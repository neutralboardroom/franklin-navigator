name: Franklin password recovery closeout v2
on:
  push:
    branches: [local-franklin-runtime-password-recovery-closeout-20260908]
    paths: [.github/runtime-reset/**, .github/workflows/runtime-password-recovery-closeout-v2.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: franklin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d franklin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture:isolated_test_only@127.0.0.1:5432/franklin_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a9c918b656ced6386b1af604fde51d4a7e88d3b9
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reconstruct exact bounded patch
        run: python transport/.github/runtime-reset/reconstruct.py candidate
      - name: Install locked runtime dependencies
        working-directory: candidate
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full runtime unit regression
        working-directory: candidate
        run: |
          mkdir -p evidence
          npm test | tee evidence/PASSWORD_RECOVERY_UNIT_TESTS.tap
      - name: Existing member and reviewer Postgres regression
        working-directory: candidate
        run: |
          mkdir -p evidence/reviewer
          TEST_REPORT_DIR="$GITHUB_WORKSPACE/candidate/evidence/reviewer" node acceptance/owner-review-setup.integration.cjs
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser reset and reviewer sign-in
        run: |
          set -euo pipefail
          export BROWSER_FIXTURE_PATH="$GITHUB_WORKSPACE/candidate/evidence/password-reset-fixture.json"
          cd candidate
          node acceptance/owner-review-browser-fixture.cjs > evidence/password-reset-fixture.log 2>&1 &
          echo $! > evidence/password-reset-fixture.pid
          cd ..
          for i in $(seq 1 160); do
            if test -s candidate/evidence/password-reset-fixture.json; then break; fi
            sleep .1
          done
          test -s candidate/evidence/password-reset-fixture.json
          python transport/.github/runtime-reset/browser_test.py candidate/evidence/password-reset-fixture.json candidate/evidence/PASSWORD_RECOVERY_BROWSER.json
          cd candidate
          node ../transport/.github/runtime-reset/db_verify.cjs evidence/password-reset-fixture.json evidence/PASSWORD_RECOVERY_DB.json
          kill $(cat evidence/password-reset-fixture.pid) || true
      - name: Verify runtime base has not moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import json,urllib.request,os; u='https://api.github.com/repos/neutralboardroom/franklin-navigator/git/ref/heads/franklin-commerce-runtime-r30'; r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}); d=json.load(urllib.request.urlopen(r,timeout=30)); assert d['object']['sha']=='a9c918b656ced6386b1af604fde51d4a7e88d3b9'; print(d['object']['sha'])"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: franklin-password-recovery-v2-evidence
          path: candidate/evidence/
          retention-days: 14
          if-no-files-found: error
