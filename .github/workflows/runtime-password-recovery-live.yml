name: Franklin password recovery live verification
on:
  push:
    branches: [local-franklin-runtime-password-recovery-closeout-20260908]
    paths: [.github/workflows/runtime-password-recovery-live.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5a4e104221a282ef99d46b3ec9175507ae1fc226
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Exact live recovery surface and runtime gate check
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json,hashlib
          origin='https://franklin-navigator-membership.onrender.com'
          def get(path):
            req=urllib.request.Request(origin+path,headers={'User-Agent':'Franklin-launch-closeout-live/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.status,r.read(),{k.lower():v for k,v in r.headers.items()}
          rows=[]
          for route,file in [('/review/','review/index.html'),('/review/reset/','review/reset.html'),('/review/reset.js','review/reset.js'),('/review/style.css','review/style.css')]:
            status,b,h=get(route); expected=Path(file).read_bytes(); ok=status==200 and hashlib.sha256(b).digest()==hashlib.sha256(expected).digest()
            rows.append({'route':route,'status':status,'exactBytes':ok,'cacheControl':h.get('cache-control'),'robots':h.get('x-robots-tag')})
            assert ok,(route,len(b),len(expected))
            assert 'no-store' in h.get('cache-control','').lower(),route
          review=get('/review/')[1].decode(); reset=get('/review/reset/')[1].decode()
          assert 'Forgot your password?' in review and 'href="/review/reset/"' in review
          assert 'Reset your Franklin password' in reset and 'name="robots" content="noindex,nofollow,noarchive"' in reset
          for route in ['/health','/ready']:
            status,b,h=get(route);d=json.loads(b);rows.append({'route':route,'status':status,'json':d});assert status==200 and d.get('ok') is True and d.get('database') is True;assert d.get('commerceEnabled') is False;assert d.get('reviewerConsoleConfigured') is True
            if route=='/ready':assert d.get('liveCheckoutEnabled') is False
          print(json.dumps({'result':'PASS','productionWrites':0,'credentialsUsed':False,'checks':rows},indent=2))
          PY
