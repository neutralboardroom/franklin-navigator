name: HF32 focused browser qualification

on:
  push:
    branches:
      - hf32-owner-approved-simplification-20260910
    paths:
      - .github/workflows/hf32-qualify-fast.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf32-owner-approved-simplification-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Qualify rendered UX at 1366x768
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hf32-browser-evidence
          python -m http.server 8765 --directory dist >/tmp/hf32-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          BASE='http://127.0.0.1:8765'
          result={}
          def visible(page,sel):
              return page.locator(sel).evaluate_all("els=>els.filter(e=>!e.hidden&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden').length")
          def load(page,path,cls,wait=800):
              page.goto(BASE+path,wait_until='domcontentloaded',timeout=20000)
              page.wait_for_function("c=>document.body&&document.body.classList.contains(c)",arg=cls,timeout=15000)
              page.wait_for_timeout(wait)
          def header(page):
              assert page.locator('header .nav > a').count()==4,page.locator('header .nav').inner_text()
              assert page.locator('header .nav > details .r41-nav-more-menu > a').count()==3
          with sync_playwright() as p:
              b=p.chromium.launch()
              page=b.new_page(viewport={'width':1366,'height':768})
              load(page,'/','hf32-home'); header(page)
              assert page.locator('.hf32-history h2').inner_text().strip()=='Then & Now'
              assert 'skyline.webp' in page.locator('.hf32-history img').nth(2).get_attribute('src')
              assert page.get_by_role('heading',name='Grow your visibility in the Franklin community.').count()==1
              result['home']='PASS'
              load(page,'/today/','hf32-today'); header(page)
              assert page.locator('main > .r22-hero .actions').count()==0
              assert visible(page,'[data-today-grid] .hf32-today-group')>=1
              assert page.get_by_text('How we keep Today current',exact=True).count()==1
              result['today']='PASS'
              load(page,'/get-it-done/','hf32-tasks'); header(page)
              assert page.locator('.r22-task-search .actions a,.r22-task-search .actions button').count()==1
              assert page.get_by_role('heading',name='Choose what you want to get done').count()==1
              n=visible(page,'.task-card'); assert n<=6,n
              assert page.get_by_role('button',name='See all tasks').count()==1
              result['get_it_done']=f'PASS visible={n}'
              load(page,'/directory/','hf32-directory',1500); header(page)
              assert page.get_by_role('heading',name='Search or choose a category').count()==1
              assert visible(page,'[data-dir-results]')==0
              page.locator('[data-dir-search]').fill("Carson's Barbershop")
              page.wait_for_timeout(1000)
              assert visible(page,'.r22-profile-result')>=1
              assert visible(page,'.r22-profile-result .fine-print')==0
              cols=page.locator('[data-dir-results]').evaluate("e=>getComputedStyle(e).gridTemplateColumns.split(' ').length")
              assert cols==3,cols
              result['find_local']='PASS'
              load(page,'/profiles/FR-ORG-5d72d3ee4e9961c5/','hf32-profile'); header(page)
              assert visible(page,'.profile-currentness')==0
              assert page.get_by_role('heading',name='Contact & links').count()==1
              links=page.locator('.hf32-contact-links').inner_text(); assert 'Call' in links and 'Email' in links,links
              assert visible(page,'.profile-facts-grid')==0
              assert page.get_by_text('Own or manage this business?',exact=True).count()==1
              result['profile']='PASS'
              load(page,'/sports/','hf32-sports',1800); header(page)
              assert page.get_by_role('heading',name='Find sports in Franklin.').count()==1
              assert page.locator('.explorer-hero').evaluate("e=>e.nextElementSibling&&e.nextElementSibling.id")=='finder'
              assert page.locator('.hf32-sport-select').count()==1
              assert visible(page,'#short-list')==0
              n=visible(page,'[data-explorer-grid] .explorer-card'); assert n<=9,n
              result['sports']=f'PASS visible={n}'
              load(page,'/sports/bowling/','hf32-sports',1800); header(page)
              assert 'bowling' in page.locator('h1').first.inner_text().lower()
              assert page.locator('.explorer-hero').evaluate("e=>e.nextElementSibling&&e.nextElementSibling.id")=='finder'
              n=visible(page,'[data-explorer-grid] .explorer-card'); assert n>=1,n
              result['bowling']=f'PASS visible={n}'
              load(page,'/everyday-help/','hf32-high-load-page'); header(page)
              total=page.locator('[data-help-card]').count(); n=visible(page,'[data-help-card]')
              assert total>=20,total; assert n<total,(n,total)
              assert page.get_by_text('Emergency help',exact=True).count()==1
              assert page.get_by_text('Mental-health crisis',exact=True).count()==1
              result['high_load_safety']=f'PASS visible={n} total={total}'
              load(page,'/es/hacerlo/','hf32-tasks'); header(page)
              assert page.get_by_role('heading',name='Elija lo que quiere resolver').count()==1
              assert page.get_by_role('button',name='Ver todas las tareas').count()==1
              result['spanish_tasks']='PASS'
              load(page,'/es/deportes/','hf32-sports',1500); header(page)
              assert page.get_by_role('heading',name='Encuentre deportes en Franklin.').count()==1
              assert page.get_by_text('Más filtros',exact=True).count()>=1
              result['spanish_sports']='PASS'
              b.close()
          Path('hf32-browser-evidence/HF32_BROWSER_QUALIFICATION.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HF32_FOCUSED_BROWSER_EVIDENCE
          path: hf32-browser-evidence/HF32_BROWSER_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 30
