name: Franklin existing member first value closeout
on:
  push:
    branches: [local-franklin-existing-member-first-value-closeout-20260908]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: franklin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fixture -d franklin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fixture:isolated_test_only@127.0.0.1:5432/franklin_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and complete unit regression
        run: |
          mkdir -p evidence
          npm run check | tee evidence/FIRST_VALUE_CHECK.log
          npm test | tee evidence/FIRST_VALUE_UNIT.tap
      - name: Real isolated Postgres reconciliation
        run: node acceptance/owner-first-value-reconcile.integration.cjs | tee evidence/FIRST_VALUE_POSTGRES.json
      - name: Disabled startup is mutation-free
        run: OWNER_FIRST_VALUE_RECONCILE=false node scripts/owner-first-value-reconcile.cjs | tee evidence/FIRST_VALUE_DISABLED.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: franklin-existing-member-first-value-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
