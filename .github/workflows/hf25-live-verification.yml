name: HF25 live verification
on:
  push:
    branches: [local-franklin-hf25-postlaunch-truth-20260908]
    paths: [.github/workflows/hf25-live-verification.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: eaff996669a0c432e2ebd40773a86bc869310f42
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Exact live HTTP readback for every changed public asset plus profile samples
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,urllib.request,json,concurrent.futures,datetime
          root=Path('dist');parent='9e8195d9c3939f791795ab38add326402b5d55c8';origin='https://franklinnavigator.com'
          changed=[x for x in subprocess.check_output(['git','diff','--name-only',parent+'..HEAD'],text=True).splitlines() if x.startswith('dist/') and (Path(x).suffix in {'.html','.json','.js','.css'})]
          # Include deterministic live profile samples without mutating or requalifying profile truth.
          profiles=sorted((root/'profiles').rglob('index.html'));assert len(profiles)==19103
          samples=[profiles[0],profiles[len(profiles)//4],profiles[len(profiles)//2],profiles[(3*len(profiles))//4],profiles[-1]]
          paths=[Path(x) for x in changed]+samples
          def fetch(p):
            rel=p.relative_to(root).as_posix();url=origin+'/'+(rel[:-10] if rel.endswith('index.html') else rel)
            req=urllib.request.Request(url,headers={'User-Agent':'Franklin-HF25-live-readback/1.0','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:b=r.read();status=r.status
              return {'path':rel,'url':url,'status':status,'expected':hashlib.sha256(p.read_bytes()).hexdigest(),'actual':hashlib.sha256(b).hexdigest(),'bytes':len(b),'pass':status==200 and hashlib.sha256(b).hexdigest()==hashlib.sha256(p.read_bytes()).hexdigest()}
            except Exception as e:return {'path':rel,'url':url,'pass':False,'error':type(e).__name__+':'+str(e)[:160]}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as ex:rows=list(ex.map(fetch,paths))
          report={'schemaVersion':'franklin.hf25.live-http.v1','atUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'publicCommit':'eaff996669a0c432e2ebd40773a86bc869310f42','publicDeploy':'dep-dafraeon74is73ba99mg','changedAssetsChecked':len(changed),'profileSamplesChecked':len(samples),'pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'results':rows}
          Path('HF25_LIVE_HTTP.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps({'changed':len(changed),'profiles':len(samples),'pass':report['pass'],'fail':report['fail']}));assert report['fail']==0
          PY
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual live EN/ES phone and desktop journeys across every changed HTML page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import subprocess,json,datetime
          parent='9e8195d9c3939f791795ab38add326402b5d55c8';origin='https://franklinnavigator.com'
          changed=[x for x in subprocess.check_output(['git','diff','--name-only',parent+'..HEAD'],text=True).splitlines() if x.startswith('dist/') and x.endswith('.html')]
          banned=['new public membership checkout is closed','new public membership checkout remains closed','new public checkout is currently closed','new public checkout remains closed','membership checkout is not open yet','membership enrollment is currently closed','membership enrollment and payment are not open yet','paid business membership is not open yet','while enrollment remains closed','before checkout is available','membership comes later','before new checkout opens:','franklin will not reopen new enrollment']
          rows=[]
          def add(i,v,d=''):rows.append({'id':i,'pass':bool(v),'detail':d});assert v,(i,d)
          with sync_playwright() as p:
            b=p.chromium.launch()
            for rel in changed:
              route='/'+rel[5:];route=route[:-10] if route.endswith('index.html') else route
              for width in [390,1280]:
                c=b.new_context(viewport={'width':width,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)))
                resp=page.goto(origin+route,wait_until='networkidle',timeout=45000);body=page.locator('body').inner_text();low=body.lower()
                add(f'{rel}:{width}:http',resp is not None and resp.status==200,str(resp.status if resp else None));add(f'{rel}:{width}:h1',page.locator('main h1').count()==1);add(f'{rel}:{width}:stale',not any(x in low for x in banned));add(f'{rel}:{width}:overflow',page.evaluate('document.documentElement.scrollWidth<=document.documentElement.clientWidth+2'));add(f'{rel}:{width}:js',not errs,' | '.join(errs[:3]))
                if page.locator('[data-r37-lang="es"]').count():
                  page.locator('[data-r37-lang="es"]').click();page.wait_for_timeout(250);add(f'{rel}:{width}:es-lang',page.locator('html').get_attribute('lang')=='es');spanish=page.locator('body').inner_text();add(f'{rel}:{width}:es-new-open-copy','Eligible verified profiles can start membership setup now after representation is confirmed.' not in spanish)
                c.close()
            b.close()
          report={'schemaVersion':'franklin.hf25.live-browser.v1','atUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'publicCommit':'eaff996669a0c432e2ebd40773a86bc869310f42','publicDeploy':'dep-dafraeon74is73ba99mg','changedHtmlPages':len(changed),'viewports':[390,1280],'assertions':len(rows),'pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'results':rows};Path('HF25_LIVE_BROWSER.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n');print(json.dumps({'pages':len(changed),'assertions':len(rows),'fail':report['fail']}));assert report['fail']==0
          PY
      - name: Live commerce, Assistant, reviewer and public membership continuity
        run: |
          python - <<'PY'
          import urllib.request,json,datetime
          def raw(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Franklin-HF25-live-continuity/1.0','Cache-Control':'no-cache'});return urllib.request.urlopen(req,timeout=30)
          with raw('https://franklin-navigator-membership.onrender.com/ready') as r:ready=json.load(r)
          with raw('https://franklin-navigator-membership.onrender.com/api/catalog') as r:catalog=json.load(r)
          assert ready['ok'] and ready['database'] and ready['commerceEnabled'] and ready['liveCheckoutEnabled'] and ready['stripeCheckoutSessionConfigured'] and ready['stripeWebhookConfigured'] and ready['portalSessionConfigured'] and ready['startupError'] is None
          assert catalog['publicCheckoutOpen'] and [x['priceUsd'] for x in catalog['choices']]==[5,50,120]
          endpoints={}
          for name,url in {'enroll':'https://franklinnavigator.com/membership-enroll/','assistant':'https://franklinnavigator.com/assistant/','reviewer':'https://franklin-navigator-membership.onrender.com/review/'}.items():
            with raw(url) as r:endpoints[name]={'status':r.status,'bytes':len(r.read())};assert endpoints[name]['status']==200
          report={'schemaVersion':'franklin.hf25.live-continuity.v1','atUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runtimeCommit':'44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8','runtimeDeploy':'dep-dafq07on74is73b4sp00','ready':{'database':ready['database'],'commerceEnabled':ready['commerceEnabled'],'liveCheckoutEnabled':ready['liveCheckoutEnabled'],'stripeCheckoutSessionConfigured':ready['stripeCheckoutSessionConfigured'],'stripeWebhookConfigured':ready['stripeWebhookConfigured'],'portalSessionConfigured':ready['portalSessionConfigured'],'startupError':ready['startupError']},'catalog':{'publicCheckoutOpen':catalog['publicCheckoutOpen'],'pricesUsd':[x['priceUsd'] for x in catalog['choices']]},'endpoints':endpoints,'financialMutationsByVerification':0}
          Path('HF25_LIVE_CONTINUITY.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf25-live-verification
          path: |
            HF25_LIVE_HTTP.json
            HF25_LIVE_BROWSER.json
            HF25_LIVE_CONTINUITY.json
          retention-days: 14
          if-no-files-found: error
