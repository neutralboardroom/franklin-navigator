      - name: Whole-site language gate on every HTML page and public JS
        working-directory: candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re,json,html,collections
          root=Path('dist');issues=[]
          banned=[
            'Your everyday operating system for living, participating and doing business in Franklin, Tennessee.',
            'Linked agencies, organizations and businesses are not affiliated with or endorsed by Franklin Navigator unless expressly stated.',
            'Franklin Navigator separates public-source facts from member-provided content.',
            'Suggest a correction or claim this profile',
            'Membership does not buy factual accuracy or ordinary directory rank.',
            'Related by category, not ranking or recommendation.',
            'Location shown from a cited public source',
            'Claim submission is not open yet. Keep this packet until it is.',
            'Profile verified. You can continue when checkout is available.'
          ]
          html_pages=0;profiles=0
          for p in root.rglob('*.html'):
            html_pages+=1;rel=p.relative_to(root).as_posix();profiles+=rel.startswith('profiles/');t=p.read_text(errors='ignore')
            for phrase in banned:
              if phrase in t:issues.append((rel,phrase))
            # technical internal language must not appear on ordinary public non-profile pages
            if not rel.startswith('profiles/'):
              visible=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',t,flags=re.I);visible=re.sub(r'<[^>]+>',' ',visible);visible=html.unescape(visible)
              for rx in [r'\bADMIN_TOKEN\b',r'\blookup key\b',r'\bentitlement key\b',r'\bwebhook event id\b',r'\bruntime service\b',r'\bschema version\b',r'\breceipt hash\b',r'\bAUTHORITY_TRANSFER\b']:
                if re.search(rx,visible,re.I):issues.append((rel,rx))
          assert html_pages==19356,(html_pages,19356);assert profiles==19103,(profiles,19103)
          assert not issues,issues[:20]
          app=(root/'assets/app.js').read_text();assert 'Public profile ID' not in app;assert 'FRANKLIN PROFILE REVIEW CHECKLIST' in app;assert 'use Profile Studio to request representation review' in app
          # All non-profile meta descriptions are now concise enough for ordinary search snippets.
          over=[]
          for p in root.rglob('*.html'):
            rel=p.relative_to(root).as_posix()
            if rel.startswith('profiles/'):continue
            m=re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']',p.read_text(),re.I)
            if m:
              v=html.unescape(m.group(1));
              if len(v)>180:over.append((rel,len(v),v))
          assert not over,over[:20]
          print(json.dumps({'result':'PASS','htmlPages':html_pages,'profilePages':profiles,'nonProfilePages':html_pages-profiles,'bannedFindings':0,'overlongNonProfileMeta':0}))
          PY
