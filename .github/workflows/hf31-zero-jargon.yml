name: HF31 zero-jargon public language gate
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - scripts/hf31-public-language-zero-jargon.py
      - .github/workflows/hf31-zero-jargon.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply high-confidence public wording cleanup and write report
        run: python3 scripts/hf31-public-language-zero-jargon.py || true
      - name: Persist changed pages and exact report
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist evidence/hf31/PUBLIC_LANGUAGE_ZERO_JARGON_REPORT.json
          if git diff --cached --quiet; then
            echo 'No public wording delta'
          else
            git commit -m 'Apply zero-jargon public wording pass [skip ci]'
            git push origin HEAD:hf31-profile-currentness-polish-20260910
          fi
      - name: Report remaining gate state
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('evidence/hf31/PUBLIC_LANGUAGE_ZERO_JARGON_REPORT.json'))
          print('remainingHighConfidenceJargonMatches=',p['remainingHighConfidenceJargonMatches'])
          # Persist first; a later qualification gate enforces zero after human-qualified cleanup.
          PY
