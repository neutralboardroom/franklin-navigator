name: Expand verified Franklin R21 payload

on:
  push:
    branches:
      - r21-production-stage
    paths:
      - FRANKLIN_R21__GITHUB_DEPLOY_PAYLOAD.zip

permissions:
  contents: write

jobs:
  expand-r21:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install reconstruction dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd unzip

      - name: Verify and expand the sealed R21 deployment payload
        shell: bash
        run: |
          set -euo pipefail
          echo "1ac7868538b559f46cb724593d1f8a9832aa9546c09cdbac1fd3c0ee1bc8a1f6  FRANKLIN_R21__GITHUB_DEPLOY_PAYLOAD.zip" | sha256sum -c -
          rm -rf /tmp/r21-upload
          mkdir -p /tmp/r21-upload
          unzip -q FRANKLIN_R21__GITHUB_DEPLOY_PAYLOAD.zip -d /tmp/r21-upload
          bash /tmp/r21-upload/deploy-r21.sh
