name: Expand verified Franklin R21 payload

on:
  push:
    branches:
      - r21-production-stage
    paths:
      - FRANKLIN_R21__GITHUB_DEPLOY_PAYLOAD.zip
      - .github/workflows/expand-r21.yml

permissions:
  contents: write

jobs:
  expand-r21:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install reconstruction dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd unzip

      - name: Verify accidental main upload is contained
        shell: bash
        run: |
          set -euo pipefail
          BASE='4fa7b9ab1c747fec58040ec754e2d0090f078c19'
          MAIN_UPLOAD='b869a5e3cebe6e7c3b7370ef4bc8263ae6f622e9'
          test "$(git rev-parse origin/main)" = "$MAIN_UPLOAD"
          test "$(git rev-parse origin/main^)" = "$BASE"
          test "$(git diff --name-only "$BASE" "$MAIN_UPLOAD")" = 'FRANKLIN_R21__GITHUB_DEPLOY_PAYLOAD.zip'
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git update-ref refs/remotes/origin/main "$BASE"

      - name: Verify and expand the sealed R21 deployment payload
        shell: bash
        run: |
          set -euo pipefail
          echo "1ac7868538b559f46cb724593d1f8a9832aa9546c09cdbac1fd3c0ee1bc8a1f6  FRANKLIN_R21__GITHUB_DEPLOY_PAYLOAD.zip" | sha256sum -c -
          rm -rf /tmp/r21-upload
          mkdir -p /tmp/r21-upload
          unzip -q FRANKLIN_R21__GITHUB_DEPLOY_PAYLOAD.zip -d /tmp/r21-upload
          bash /tmp/r21-upload/deploy-r21.sh
