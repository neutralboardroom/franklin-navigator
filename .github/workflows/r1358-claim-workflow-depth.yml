name: R1358 claim workflow depth
on:
  pull_request:
    branches: [franklin-commerce-runtime-r30]
    paths:
      - 'server.js'
      - 'lib/member-fulfillment.js'
      - 'lib/reviewer-console.js'
      - 'review/**'
      - 'schema/010_claim_workflow.sql'
      - 'test/r1358-claim-workflow-depth.test.js'
      - 'test/r1357-profile-review-audit.test.js'
      - 'test/r1346-claim-path-contract.test.js'
      - '.github/workflows/r1358-claim-workflow-depth.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1358-claim-workflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax
        run: npm run check
      - name: Full runtime tests
        run: npm test
      - name: R1358 focused regression
        run: node --test test/r1358-claim-workflow-depth.test.js test/r1357-profile-review-audit.test.js test/r1346-claim-path-contract.test.js
