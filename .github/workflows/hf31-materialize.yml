name: HF31 materialize reviewed-page successor
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - .github/workflows/hf31-materialize.yml
      - scripts/apply-hf31-reviewed-pages.py

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact HF3.1 release identity and suppress already-expired dated cards
        run: python3 scripts/apply-hf31-reviewed-pages.py
      - name: Commit deterministic public-tree transform
        run: |
          if git diff --quiet -- dist; then
            echo 'Expected HF3.1 public-tree changes were not produced' >&2
            exit 1
          fi
          git config user.name 'neutralboardroom'
          git config user.email 'reachrgnow@gmail.com'
          git add dist
          git commit -m 'Apply HF3.1 reviewed-page design carrier and expired-date suppression [skip ci]'
          git push origin HEAD:hf31-profile-currentness-polish-20260910
