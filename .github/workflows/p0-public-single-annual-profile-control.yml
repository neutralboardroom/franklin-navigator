name: Franklin P0 public closeout
'on':
  push:
    branches:
      - main
    paths:
      - scripts/p0-closeout-trigger.txt
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify trigger head
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Apply P0 public closeout
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          cat scripts/p0-closeout-parts/part*.b64 | base64 -d > scripts/p0-closeout-apply-on-repo.py
          python scripts/p0-closeout-apply-on-repo.py
          rm scripts/p0-closeout-apply-on-repo.py
          python scripts/p0-closeout-post.py
      - name: Syntax and qualification
        run: |
          node --check dist/assets/membership-live.js
          node --check dist/assets/profile-control.js
          node --check dist/assets/member-public.js
          node --check dist/assets/local-discovery.js
          node --check dist/assets/r37-i18n.js
          python -m py_compile scripts/apply-profile-suppressions.py scripts/build-hf31-release.py scripts/review-public-profile-suppression.py scripts/p0-closeout-post.py
          python scripts/p0-closeout-qualify.py
      - name: Commit qualified public closeout
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add -A
          git commit -m 'P0: activate $35 annual membership and free profile control'
          git push origin HEAD:main
