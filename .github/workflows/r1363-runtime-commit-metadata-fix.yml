name: R1363 runtime commit metadata fix

on:
  push:
    branches: [r1363-release-seal-20261004]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Add exact runtime commit packaging key
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          runtime_commit='10bc9678415589335b63b86c92bd4ae6d39d7baa'
          p=Path('PRODUCTION_RELEASE.json')
          d=json.loads(p.read_text())
          assert d['release']=='FR-NAV1.30.63-HF3.13.45'
          r=d['r1363']
          assert r['runtimeMergeCommit']==runtime_commit
          r['runtimeCommit']=runtime_commit
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          python -m json.tool PRODUCTION_RELEASE.json >/dev/null
      - name: Commit correction and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/r1363-runtime-commit-metadata-fix.yml
          git config user.name "neutralboardroom"
          git config user.email "reachrgnow@gmail.com"
          git add -A
          git commit -m "R1363: expose exact runtime commit to deterministic packager"
          git push origin HEAD:r1363-release-seal-20261004
