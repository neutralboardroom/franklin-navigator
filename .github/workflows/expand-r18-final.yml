name: Expand verified final Franklin R18 payload

on:
  push:
    branches:
      - r18-production-stage
    paths:
      - .github/workflows/expand-r18-final.yml

permissions:
  contents: write

jobs:
  expand-r18:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: r18-production-stage
          fetch-depth: 0

      - name: Install zstd
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y zstd >/dev/null

      - name: Verify exact R17 public starting tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD:dist)"
          expected="af2cdf53d625c6ba42548901de8fc54153dce9ae"
          echo "R17 dist tree: $actual"
          test "$actual" = "$expected"

      - name: Reassemble and verify final R18 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .r18-patch/chunk-*.b64 | base64 --decode > /tmp/r18.delta.zst
          echo "2c627472b807915d51a296698280bf25c853448b8a401514ae18f820e1b63e4e  /tmp/r18.delta.zst" | sha256sum -c -

      - name: Reconstruct and verify exact final R18 public tree
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner --mode='u=rwX,go=rX' -cf /tmp/base.tar dist
          echo "fb69feaa1d6fc45a2df56b1106b9e12ce42f51c39a179e58fbc59232cdc8b079  /tmp/base.tar" | sha256sum -c -
          zstd -d --patch-from=/tmp/base.tar /tmp/r18.delta.zst -o /tmp/final.tar
          echo "353b829b51e70fb68412c7ab2d1443524a3ff9fde479181809c991d58b8f8803  /tmp/final.tar" | sha256sum -c -
          rm -rf dist
          tar -xf /tmp/final.tar
          git add -A dist
          tree="$(git write-tree)"
          dist_tree="$(git rev-parse "${tree}:dist")"
          echo "R18 dist tree: $dist_tree"
          test "$dist_tree" = "025a3566d6e54c1d6a6756fec97016d5cda2dcd5"
          grep -q 'Tell Franklin Navigator what you need' dist/index.html
          grep -q 'Ask Navigator' dist/index.html
          grep -q 'Get It Done' dist/index.html
          grep -q 'My Franklin' dist/index.html
          test -f dist/today/index.html
          test -f dist/get-it-done/index.html
          test -f dist/my-franklin/index.html
          test -f dist/housing/index.html
          test -f dist/updates/index.html
          test -f dist/business-dashboard/index.html

      - name: Commit verified final R18 public payload
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo 'No staged payload change; refusing to create an empty release commit.'
            exit 1
          fi
          git config user.name 'Franklin Navigator Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Stage Franklin Navigator R18 final public payload'
          git push origin HEAD:r18-production-stage
