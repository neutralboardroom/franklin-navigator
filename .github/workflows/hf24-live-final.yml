name: HF24 live final verification
on:
  push:
    branches: [local-franklin-hf24-assistant-practical-20260908]
    paths: [.github/workflows/hf24-live-final.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1a289026f981f89b8c9077b99cc076c21b50221d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Exact HTTPS bytes and closed-commerce health
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,hashlib,json
          sha=lambda b:hashlib.sha256(b).hexdigest()
          origin='https://franklinnavigator.com'
          for rel in ['assets/r40-assistant-practical.js','assets/r40-assistant-safety-guard.js','assets/r37-i18n.js','assets/device-followthrough-core.js']:
            req=urllib.request.Request(origin+'/'+rel,headers={'Cache-Control':'no-cache','User-Agent':'HF24-live-verifier/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:b=r.read();assert r.status==200 and sha(b)==sha((Path('dist')/rel).read_bytes()),rel
          for route in ['/health','/ready']:
            with urllib.request.urlopen('https://franklin-navigator-membership.onrender.com'+route,timeout=30) as r:d=json.load(r);assert r.status==200 and d.get('ok') is True and d.get('database') is True and d.get('commerceEnabled') is False and d.get('reviewerConsoleConfigured') is True,(route,d)
          print('HTTPS_BYTES_AND_CLOSED_COMMERCE_PASS')
          PY
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real live EN/ES Assistant task completion
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          origin='https://franklinnavigator.com';rows=[]
          def ok(i,v): rows.append({'id':i,'pass':bool(v)});assert v,i
          with sync_playwright() as p:
            b=p.chromium.launch()
            for locale,path in [('en','/assistant/'),('es','/es/asistente/')]:
              c=b.new_context(viewport={'width':390,'height':900});page=c.new_page();page.goto(origin+path,wait_until='networkidle')
              ok(locale+' practical loaded',page.evaluate("typeof FranklinR40Practical==='object'"));ok(locale+' guard loaded',page.evaluate("typeof FranklinR40SafetyGuard==='object'"))
              inp=page.locator('[data-navigator-input]');inp.fill('I need help starting a business in Franklin' if locale=='en' else 'Necesito ayuda para iniciar un negocio en Franklin');page.locator('form.navigator-form button[type=submit]').click();page.locator('[data-r40-practical] h3').wait_for();ok(locale+' targeted clarification',page.locator('[data-r40-practical] button').count()>=3)
              page.get_by_role('button',name=('Home-based' if locale=='en' else 'Desde casa'),exact=True).click();ok(locale+' ordered checklist',page.locator('[data-r40-practical] ol li').count()>=4)
              inp.fill('new leased location' if locale=='en' else 'local nuevo alquilado');page.locator('form.navigator-form button[type=submit]').click();page.wait_for_timeout(150);txt=page.locator('[data-r40-practical]').inner_text();ok(locale+' second turn',('New or leased location' in txt if locale=='en' else 'Local nuevo o alquilado' in txt))
              page.get_by_role('button',name=('Save this checklist on this device' if locale=='en' else 'Guardar esta lista en este dispositivo'),exact=True).click();page.wait_for_timeout(100);stored=page.evaluate("JSON.parse(localStorage.getItem('franklinNavigator.assistantPractical.v1'))");ok(locale+' minimized save',len(stored)==1 and stored[0]['variant']=='location' and 'question' not in stored[0])
              href=page.locator('[data-r40-practical-saved] a').first.get_attribute('href');ok(locale+' reopen href',bool(href and 'reopen=' in href))
              inp.fill('911 immediate danger' if locale=='en' else '911 peligro inmediato');page.locator('form.navigator-form button[type=submit]').click();page.wait_for_timeout(200);ok(locale+' urgent output','911' in page.locator('[data-navigator-output]').inner_text());ok(locale+' same session practical cleared',page.locator('[data-r40-practical]').is_hidden())
              page.goto(origin+href,wait_until='networkidle');page.locator('[data-r40-practical] ol').wait_for();ok(locale+' reopen works',page.locator('[data-r40-practical] ol li').count()>=4)
              page.goto(origin+('/my-franklin/' if locale=='en' else '/es/mi-franklin/'),wait_until='networkidle');page.locator('[data-r40-practical-saved]').wait_for();ok(locale+' My Franklin projection',page.locator('[data-r40-practical-saved] article').count()==1)
              result=page.evaluate("()=>FranklinDeviceCore.createStore(()=>localStorage).clear()");ok(locale+' reset clears new store',result['ok'] and page.evaluate("localStorage.getItem('franklinNavigator.assistantPractical.v1')===null"));c.close()
            b.close()
          report={'result':'PASS','pass':sum(x['pass'] for x in rows),'fail':sum(not x['pass'] for x in rows),'ownerAuthenticationObserved':False,'commerceOpened':False,'results':rows};Path('HF24_LIVE_BROWSER.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf24-live-final-evidence
          path: HF24_LIVE_BROWSER.json
          retention-days: 14
          if-no-files-found: error
