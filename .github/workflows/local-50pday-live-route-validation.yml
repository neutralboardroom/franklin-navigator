name: Local 50/day live route convergence validation
on:
  push:
    branches: [local-50pday-live-route-validation-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-live-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate 50 exact live profile and claim/manage routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import csv,json,subprocess,re,html,pathlib,sys
          rows=[]
          with open('evidence/local-50pday-live-route-input-20261015.tsv',encoding='utf-8') as f:
              for ordinal,line in enumerate(f,1):
                  pid,name=line.rstrip('\n').split('\t',1)
                  rows.append({'cohort_ordinal':ordinal,'canonical_profile_id':pid,'business_person_name':name})
          results=[]
          def fetch(url):
              p=subprocess.run(['curl','--location','--silent','--show-error','--max-time','25','--retry','2','--retry-all-errors','-H','Cache-Control: no-cache','-w','\n__HTTP__%{http_code}\n__FINAL__%{url_effective}','-o','/tmp/body',url],text=True,capture_output=True)
              body=pathlib.Path('/tmp/body').read_text(errors='ignore') if pathlib.Path('/tmp/body').exists() else ''
              code='000'; final=''
              m=re.search(r'__HTTP__(\d+)',p.stdout or '')
              if m: code=m.group(1)
              m=re.search(r'__FINAL__(.+)',p.stdout or '')
              if m: final=m.group(1).strip()
              return p.returncode,int(code) if code.isdigit() else 0,final,body,p.stderr.strip()
          for row in rows:
              pid=row['canonical_profile_id']; name=row['business_person_name']
              profile_url=f'https://franklinnavigator.com/profiles/{pid}/'
              claim_url=f'https://franklinnavigator.com/claim-profile/?profile={pid}'
              prc,pcode,pfinal,pbody,perr=fetch(profile_url)
              crc,ccode,cfinal,cbody,cerr=fetch(claim_url)
              text=html.unescape(pbody)
              profile_ok=(prc==0 and 200<=pcode<400 and pid in pbody and name.lower() in text.lower())
              claim_link_ok=(f'/claim-profile/?profile={pid}' in pbody)
              free_manage_ok=('Corrections and removal requests are free' in pbody and 'Claim or manage this profile' in pbody)
              membership_truth_ok=('member profile options' in pbody.lower())
              internal_terms=['CANDIDATE_QUALIFICATION','PF15.41','SCC_D1','AUTHORITY_TRANSFER','PERSISTED_NOT_DISPATCHED','BUILD_AND_QUALIFICATION_RECEIPT']
              leaks=[t for t in internal_terms if t in pbody]
              claim_ok=(crc==0 and 200<=ccode<400 and ('claim' in cbody.lower() or 'manage' in cbody.lower()))
              ok=profile_ok and claim_link_ok and free_manage_ok and membership_truth_ok and not leaks and claim_ok
              reasons=[]
              if perr: reasons.append(perr)
              if cerr: reasons.append(cerr)
              if not profile_ok: reasons.append('profile/body mismatch')
              if not claim_link_ok: reasons.append('missing exact claim link')
              if not free_manage_ok: reasons.append('free claim/correction text missing')
              if not membership_truth_ok: reasons.append('membership positioning missing')
              if leaks: reasons.append('internal language leak')
              if not claim_ok: reasons.append('claim route failed')
              results.append({**row,'profile_url':profile_url,'claim_manage_url':claim_url,'profile_http_status':pcode,'profile_final_url':pfinal,'profile_live_ok':profile_ok,'claim_http_status':ccode,'claim_final_url':cfinal,'claim_live_ok':claim_ok,'profile_contains_exact_claim_link':claim_link_ok,'free_basic_claim_manage_positioning_pass':free_manage_ok,'free_correction_removal_positioning_pass':free_manage_ok,'optional_paid_membership_positioning_pass':membership_truth_ok,'internal_language_leak_scan_pass':not leaks,'internal_language_leak_terms':leaks,'route_smoke_result':'PASS' if ok else 'FAIL','eligible':'YES' if ok else 'NO','block_reason':None if ok else '; '.join(reasons)})
          eligible=sum(r['eligible']=='YES' for r in results)
          summary={'tested':len(results),'eligible':eligible,'result':'PASS' if eligible>=50 else 'FAIL','outreach_ready_for_sre_final_preflight':'YES' if eligible>=50 else 'NO'}
          pathlib.Path('out/results.json').write_text(json.dumps({'summary':summary,'rows':results},indent=2))
          pathlib.Path('out/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if eligible<50: sys.exit(1)
          PY
      - name: Upload live route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-50pday-live-route-validation
          path: out/
          if-no-files-found: error
