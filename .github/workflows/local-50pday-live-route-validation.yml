          import json,subprocess,re,html,pathlib,sys
          data=json.load(open('out/input.json'))
          results=[]
          def fetch(url):
              cmd=['curl','--location','--silent','--show-error','--max-time','25','--retry','2','--retry-all-errors','-H','Cache-Control: no-cache','-w','\n__HTTP__%{http_code}\n__FINAL__%{url_effective}','-o','/tmp/body',url]
              p=subprocess.run(cmd,text=True,capture_output=True)
              body=pathlib.Path('/tmp/body').read_text(errors='ignore') if pathlib.Path('/tmp/body').exists() else ''
              code='000'; final=''
              m=re.search(r'__HTTP__(\d+)',p.stdout or '')
              if m: code=m.group(1)
              m=re.search(r'__FINAL__(.+)',p.stdout or '')
              if m: final=m.group(1).strip()
              return p.returncode,int(code) if code.isdigit() else 0,final,body,p.stderr.strip()
          for row in data:
              prc,pcode,pfinal,pbody,perr=fetch(row['profile_url'])
              crc,ccode,cfinal,cbody,cerr=fetch(row['claim_manage_url'])
              name=row['business_person_name']; pid=row['canonical_profile_id']
              profile_ok=(prc==0 and 200<=pcode<400 and pid in pbody and name.lower() in html.unescape(pbody).lower())
              claim_link_ok=(f'/claim-profile/?profile={pid}' in pbody)
              free_manage_ok=('Corrections and removal requests are free' in pbody and 'Claim or manage this profile' in pbody)
              membership_truth_ok=('member profile options' in pbody.lower())
              internal_leak_terms=['CANDIDATE_QUALIFICATION','PF15.41','SCC_D1','AUTHORITY_TRANSFER','PERSISTED_NOT_DISPATCHED','BUILD_AND_QUALIFICATION_RECEIPT']
              internal_leak=[t for t in internal_leak_terms if t in pbody]
              claim_ok=(crc==0 and 200<=ccode<400 and ('claim' in cbody.lower() or 'manage' in cbody.lower()))
              ok=profile_ok and claim_link_ok and free_manage_ok and membership_truth_ok and not internal_leak and claim_ok
              results.append({**row,'profile_http_status':pcode,'profile_final_url':pfinal,'profile_live_ok':profile_ok,'claim_http_status':ccode,'claim_final_url':cfinal,'claim_live_ok':claim_ok,'profile_contains_exact_claim_link':claim_link_ok,'free_basic_claim_manage_positioning_pass':free_manage_ok,'free_correction_removal_positioning_pass':free_manage_ok,'optional_paid_membership_positioning_pass':membership_truth_ok,'internal_language_leak_scan_pass':not internal_leak,'internal_language_leak_terms':internal_leak,'route_smoke_result':'PASS' if ok else 'FAIL','eligible':'YES' if ok else 'NO','block_reason':None if ok else '; '.join([x for x in [perr,cerr,'profile/body mismatch' if not profile_ok else '', 'missing exact claim link' if not claim_link_ok else '', 'free claim/correction text missing' if not free_manage_ok else '', 'membership positioning missing' if not membership_truth_ok else '', 'internal language leak' if internal_leak else '', 'claim route failed' if not claim_ok else ''] if x])})
          eligible=sum(r['eligible']=='YES' for r in results)
          summary={'tested':len(results),'eligible':eligible,'result':'PASS' if eligible>=50 else 'FAIL','outreach_ready_for_sre_final_preflight':'YES' if eligible>=50 else 'NO'}
          pathlib.Path('out/results.json').write_text(json.dumps({'summary':summary,'rows':results},indent=2))
          pathlib.Path('out/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          if eligible<50: sys.exit(1)
          PY2
