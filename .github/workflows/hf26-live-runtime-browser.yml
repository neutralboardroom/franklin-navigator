name: HF26 live runtime and browser verification
on:
  push:
    branches: [local-franklin-hf26-public-language-20260908]
    paths: [.github/workflows/hf26-live-runtime-browser.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 2d4a9d3bb46151d0a93c32318fedf6b2e7812a68, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Verify live runtime remains open and unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import urllib.request,json
          def get(u):
            req=urllib.request.Request(u,headers={'User-Agent':'Franklin-HF26-live-runtime/1.0','Cache-Control':'no-cache'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          ready=get('https://franklin-navigator-membership.onrender.com/ready');cat=get('https://franklin-navigator-membership.onrender.com/api/catalog')
          assert ready['database'] is True and ready['commerceEnabled'] is True and ready['liveCheckoutEnabled'] is True and ready['stripeCheckoutSessionConfigured'] is True and ready['stripeWebhookConfigured'] is True and ready['portalSessionConfigured'] is True and ready['startupError'] is None,ready
          assert cat['publicCheckoutOpen'] is True and [x['priceUsd'] for x in cat['choices']]==[5,50,120],cat
          out={'schemaVersion':'franklin.hf26.live-commerce.v1','database':ready['database'],'commerceEnabled':ready['commerceEnabled'],'liveCheckoutEnabled':ready['liveCheckoutEnabled'],'stripeCheckoutSessionConfigured':ready['stripeCheckoutSessionConfigured'],'stripeWebhookConfigured':ready['stripeWebhookConfigured'],'portalSessionConfigured':ready['portalSessionConfigured'],'startupError':ready['startupError'],'publicCheckoutOpen':cat['publicCheckoutOpen'],'pricesUsd':[5,50,120],'runtimeCommit':'44b62d30c5e2726f8e449a5d2a52a1cdc864d5e8','financialMutations':0};Path('HF26_LIVE_COMMERCE.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps(out))
          PY
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Live customer-facing browser smoke in English and Spanish
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          origin='https://franklinnavigator.com';routes=['/','/directory/','/membership-start/','/membership-pricing/','/membership-enroll/','/business-dashboard/','/claim-profile/','/profile-studio/','/my-franklin/','/capability-status/','/privacy/','/terms/','/assistant/','/es/','/es/directorio/','/es/negocios/','/es/mi-franklin/','/es/privacidad/','/es/aprendizaje/','/es/deportes/'];rows=[]
          stale=['Ask Navigator','Your everyday operating system','Profile representation review','representation review','Growth Desk entitlement','paid membership is not open today','Claim / manage this profile','Sanitized topic-and-link plans','Prepárate para','Planifica el próximo paso']
          with sync_playwright() as p:
            b=p.chromium.launch()
            for width in [390,1280]:
              for route in routes:
                c=b.new_context(viewport={'width':width,'height':900});page=c.new_page();errs=[];page.on('pageerror',lambda e:errs.append(str(e)));resp=page.goto(origin+route,wait_until='networkidle');body=page.locator('body').inner_text();bad=[s for s in stale if s.casefold() in body.casefold()];row={'route':route,'width':width,'status':resp.status if resp else 0,'h1':page.locator('main h1').count(),'errors':errs,'overflow':page.evaluate('document.documentElement.scrollWidth>document.documentElement.clientWidth+2'),'stale':bad};rows.append(row);c.close()
            b.close()
          fail=[r for r in rows if r['status']!=200 or r['h1']!=1 or r['errors'] or r['overflow'] or r['stale']]
          out={'schemaVersion':'franklin.hf26.live-browser.v3','views':len(rows),'failures':len(fail),'financialMutations':0,'results':rows};Path('HF26_LIVE_BROWSER.json').write_text(json.dumps(out,indent=2)+'\n');print(json.dumps({'views':len(rows),'failures':len(fail)}));assert not fail,fail[:10]
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hf26-live-runtime-browser
          path: |
            HF26_LIVE_COMMERCE.json
            HF26_LIVE_BROWSER.json
          retention-days: 14
          if-no-files-found: error
