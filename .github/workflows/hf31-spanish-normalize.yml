name: HF31 Spanish public-language normalization
on:
  push:
    branches:
      - hf31-profile-currentness-polish-20260910
    paths:
      - scripts/hf31-spanish-normalize.py
      - .github/workflows/hf31-spanish-normalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hf31-profile-currentness-polish-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize Spanish public language and audit all Spanish pages
        run: python3 scripts/hf31-spanish-normalize.py
      - name: Commit normalized Spanish pages and final report
        run: |
          git config user.name neutralboardroom
          git config user.email reachrgnow@gmail.com
          git add dist/es evidence/hf31/SPANISH_LANGUAGE_FINAL_REPORT.json
          if git diff --cached --quiet; then
            echo 'No Spanish page changes needed'
          else
            git commit -m 'Normalize formal Spanish and remove untranslated public UI [skip ci]'
            git push origin HEAD:hf31-profile-currentness-polish-20260910
          fi
